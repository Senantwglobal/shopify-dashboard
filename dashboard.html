window.runAIMtg=async()=>{
  const raw=document.getElementById('aim-raw')?.value.trim();if(!raw){toast('내용을 입력해주세요.',false);return}
  document.getElementById('aim-loading').style.display='block'
  document.getElementById('aim-result').style.display='none'
  const btn=document.getElementById('aim-btn');btn.disabled=true
  try{
    const resp=await fetch('/api/summarize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:raw})})
    const rawText=await resp.text()
    // 백틱 블록 제거 (멀티라인 포함)
    const cleanText=rawText
      .replace(/^\s*```(?:json)?\s*\n?/,'')  // 시작 백틱 제거
      .replace(/\n?```\s*$/,'')               // 끝 백틱 제거
      .replace(/^```json/,'').replace(/^```/,'') // 인라인 백틱 제거
      .trim()
    let respData
    try{
      respData=JSON.parse(cleanText)
    }catch{
      // JSON 블록만 추출 시도 ({ ... })
      const jsonMatch=cleanText.match(/\{[\s\S]*\}/)
      if(jsonMatch){
        try{respData=JSON.parse(jsonMatch[0])}catch{throw new Error('JSON 파싱 실패: '+cleanText.slice(0,120))}
      }else{
        throw new Error('JSON 파싱 실패: '+cleanText.slice(0,120))
      }
    }
    if(!resp.ok||respData.error)throw new Error(respData.error||'서버 오류 '+resp.status)
    const p=respData
    window._parsedMtg={...p,title:document.getElementById('aim-title')?.value.trim()||'AI 회의록',date:document.getElementById('aim-date')?.value,attendees:document.getElementById('aim-att')?.value.split(',').map(s=>s.trim()).filter(Boolean),raw}
    document.getElementById('aim-loading').style.display='none'
    document.getElementById('aim-result').style.display='block'
    document.getElementById('aim-summary-box').innerHTML=
      `<strong>핵심 요약</strong>\n${p.summary||''}\n\n<strong style="color:#3B6D11">✅ 결정사항 (${(p.decisions||[]).length}건)</strong>\n${(p.decisions||[]).map((d,i)=>`${i+1}. ${d}`).join('\n')||'없음'}\n\n<strong style="color:#A32D2D">❓ 미확인 사항</strong>\n${(p.pending||[]).map(x=>`• ${x}`).join('\n')||'없음'}`
    // 액션아이템 카드 렌더링
    const actBox=document.getElementById('aim-actions-box')
    if(p.actions?.length){
      actBox.style.display='block'
      const catOpts=D.cats.map(c=>`<option value="${c.id}">${c.label}</option>`).join('')
      const memberOpts=MEMBERS.map(m=>`<option value="${m.name}">${m.name}</option>`).join('')
      const prOpts=[['critical','긴급'],['high','중요'],['medium','보통']].map(([v,l])=>`<option value="${v}">${l}</option>`).join('')
      const stOpts=STATUS_LIST.map(s=>`<option value="${s}">${s}</option>`).join('')
      actBox.innerHTML=`<div style="font-weight:500;font-size:13px;color:var(--o);margin-bottom:10px"><i class="ti ti-list-check"></i> 📌 액션아이템 (${p.actions.length}건) — 추가할 항목을 선택하고 정보를 입력하세요</div>`+
        p.actions.map((a,i)=>`
        <div style="background:var(--sf);border:0.5px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <input type="checkbox" id="act-chk-${i}" checked style="accent-color:var(--o);width:15px;height:15px;flex-shrink:0">
            <input class="inp" id="act-txt-${i}" value="${a.replace(/"/g,'&quot;')}" style="margin:0;font-size:13px;font-weight:500;flex:1">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
            <div>
              <div style="font-size:11px;color:var(--muted);margin-bottom:3px">카테고리</div>
              <select class="inp" id="act-cat-${i}" style="margin:0;font-size:12px;padding:5px 8px">${catOpts}</select>
            </div>
            <div>
              <div style="font-size:11px;color:var(--muted);margin-bottom:3px">우선순위</div>
              <select class="inp" id="act-pr-${i}" style="margin:0;font-size:12px;padding:5px 8px">${prOpts}</select>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
            <div>
              <div style="font-size:11px;color:var(--muted);margin-bottom:3px">담당자</div>
              <select class="inp" id="act-own-${i}" style="margin:0;font-size:12px;padding:5px 8px">
                <option value="">없음</option>${memberOpts}
              </select>
            </div>
            <div>
              <div style="font-size:11px;color:var(--muted);margin-bottom:3px">요청자</div>
              <select class="inp" id="act-req-${i}" style="margin:0;font-size:12px;padding:5px 8px">
                <option value="">없음</option>${memberOpts}
              </select>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div>
              <div style="font-size:11px;color:var(--muted);margin-bottom:3px">마감일</div>
              <input type="date" class="inp" id="act-dl-${i}" style="margin:0;font-size:12px;padding:5px 8px">
            </div>
            <div>
              <div style="font-size:11px;color:var(--muted);margin-bottom:3px">상태</div>
              <select class="inp" id="act-st-${i}" style="margin:0;font-size:12px;padding:5px 8px">${stOpts}</select>
            </div>
          </div>
        </div>`).join('')+
        `<button class="btn btn-o" style="width:100%;margin-top:4px" onclick="addCheckedActions()"><i class="ti ti-circle-plus"></i> 선택 항목 체크리스트에 추가</button>`
    } else {
      actBox.style.display='none'
    }
  }catch(e){
    document.getElementById('aim-loading').style.display='none'
    toast('AI 분석 실패: '+e.message,false)
  }
  btn.disabled=false
}

  const icon=isComplete?'ti-circle-check':isAdd?'ti-circle-plus':isEdit?'ti-pencil':'ti-circle-dot'

    clickAction="showTab('ck')"

      <div style="font-size:13px;line-height:1.4">
        <span style="font-weight:600">${h.user_name}</span>
        <span style="color:var(--muted)">님이 </span>
        <span style="color:${iconColor};font-weight:500">${h.action}</span>
        ${h.target?`<span style="color:var(--muted)"> — </span><span style="font-size:12px;color:var(--text);background:var(--sf);padding:1px 6px;border-radius:4px">${h.target.slice(0,40)}${h.target.length>40?'...':''}</span>`:''}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">${new Date(h.created_at).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
    </div>
  </div>`
}

let _activityExpanded=false
window.toggleActivityFeed=()=>{
  _activityExpanded=!_activityExpanded
  const feed=document.getElementById('activity-feed')
  const btn=document.getElementById('activity-more-btn')
  const icon=document.getElementById('activity-more-icon')
  if(!feed||!btn)return
  if(_activityExpanded){
    feed.innerHTML=D.history.slice(0,20).map((h,i)=>renderActivityItem(h,i,19)).join('')
    btn.innerHTML=`<i class="ti ti-chevron-up" id="activity-more-icon"></i> 접기`
  } else {
    feed.innerHTML=D.history.slice(0,3).map((h,i)=>renderActivityItem(h,i,2)).join('')
    btn.innerHTML=`<i class="ti ti-chevron-down" id="activity-more-icon"></i> 더보기 (${D.history.length-3}건 더)`
  }
}

  const todo=myItems.filter(i=>!i.done&&i.status!=='완료').sort((a,b)=>new Date(a.deadline||'9999')-new Date(b.deadline||'9999'))
  const m=MEMBERS.find(m=>m.name===name)||{name,color:'#888'}
  const w=mkOv('member-tasks-ov')
  w.innerHTML=`<div class="modal" style="width:560px">
  <div class="mh" style="border-top-color:${m.color}">
    <div style="display:flex;align-items:center;gap:10px">
      ${avEl(name,36)}
      <div>
        <div style="font-weight:500;font-size:15px">${name}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">전체 ${myItems.length}건 · 완료 ${done.length}건 · 미완료 ${todo.length}건</div>
      </div>
    </div>
    <button class="btn btn-g" onclick="document.getElementById('member-tasks-ov').remove()"><i class="ti ti-x"></i></button>
  </div>
  <div class="mb" style="padding:0">
    <!-- 진행률 바 -->
    <div style="padding:12px 18px;border-bottom:0.5px solid var(--bd);background:var(--sf)">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">
        <span style="color:var(--muted)">전체 진행률</span>
        <span style="font-weight:500">${myItems.length?Math.round(done.length/myItems.length*100):0}%</span>
      </div>
      <div class="pgb" style="height:6px"><div class="pgf" style="width:${myItems.length?Math.round(done.length/myItems.length*100):0}%;background:${m.color}"></div></div>
    </div>

    <!-- 미완료 -->
    ${todo.length?`<div style="padding:10px 18px 6px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px">미완료 (${todo.length}건)</div>
    ${todo.map(i=>{
      const isDone=i.done||i.status==='완료'||i.status==='검증완료'
      const color=i.category_id?getCatColor(i.category_id):'var(--o)'
      const cat=i.category_id?D.cats.find(c=>c.id===i.category_id)?.label||'':'회의록 액션'
      return`<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 18px;border-bottom:0.5px solid var(--bd);cursor:pointer;transition:background .12s" onclick="document.getElementById('member-tasks-ov').remove();${i.category_id?`location.href='detail.html?type=item&id=${i.id}'`:`openAIDetail('${i.id}')`}" onmouseover="this.style.background='var(--sf)'" onmouseout="this.style.background=''">
        <div style="width:3px;border-radius:2px;background:${color};align-self:stretch;flex-shrink:0;min-height:36px"></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px">${i.text}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
            <span style="font-size:10px;color:${color};background:${color}18;padding:1px 6px;border-radius:4px">${cat}</span>
            <span class="badge ${i.status==='진행중'?'bb':i.status==='검증대기'?'bo':'bgr'}">${i.status||'할 일'}</span>
            ${i.deadline?dlc(i.deadline,false):''}

        </div>
        <i class="ti ti-chevron-right" style="color:var(--muted);font-size:13px;flex-shrink:0;margin-top:3px"></i>
      </div>`
    }).join('')}`:''}

    <!-- 완료 -->
    ${done.length?`<div style="padding:10px 18px 6px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;margin-top:4px">완료 (${done.length}건)</div>
    ${done.map(i=>{
      const color=i.category_id?getCatColor(i.category_id):'var(--o)'
      const cat=i.category_id?D.cats.find(c=>c.id===i.category_id)?.label||'':'회의록 액션'
      return`<div style="display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:0.5px solid var(--bd);opacity:.6">

        <div style="flex:1;min-width:0;font-size:12px;text-decoration:line-through;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.text}</div>
        <span class="badge bg">완료</span>
      </div>`
    }).join('')}`:''}

    ${!myItems.length?`<div style="text-align:center;padding:30px;font-size:14px;color:var(--muted)">${name}님 담당 항목 없음</div>`:''}
  </div>
  </div>`
  document.body.appendChild(w)
}

window.saveDdayDate=async()=>{
  const v=document.getElementById('dday-inp')?.value
  if(!v)return
  setDday(v)
  // DB에도 저장
  await sb.from('app_settings').delete().eq('key','dday')
  await sb.from('app_settings').insert({key:'dday',value:v,updated_at:new Date().toISOString()})
  const idx=(D.appSettings||[]).findIndex(r=>r.key==='dday')
  if(idx>=0)D.appSettings[idx].value=v
  else D.appSettings=[...(D.appSettings||[]),{key:'dday',value:v}]
  document.getElementById('dday-ov')?.remove()
  window.render();toast('D-Day 설정됨')
}
window.openDdayEdit=()=>{
  const w=mkOv('dday-ov')
  w.innerHTML=`<div class="modal" style="width:320px"><div class="mh"><span style="font-weight:500">D-Day 날짜 설정</span><button class="btn btn-g" onclick="document.getElementById('dday-ov').remove()"><i class="ti ti-x"></i></button></div>
  <div class="mb"><input class="inp" type="date" id="dday-inp" value="${getDday()}"></div>
  <div class="mf"><button class="btn btn-o" onclick="saveDdayDate()">저장</button></div>
  </div>`
  document.body.appendChild(w)
}

document.addEventListener('click', async function(e) {
  const btn = e.target.closest('.verify-btn')
  if (!btn) return
  e.stopPropagation()
  e.preventDefault()
  const id = btn.dataset.id
  if (!id) return
  await window.updateItemField(id, 'status', '검증완료')
}, true)
