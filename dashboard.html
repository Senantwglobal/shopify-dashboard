<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPLE Shopify 전환 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--o:#E8680A;--ol:#FEF0E6;--od:#B84E06;--ob:#F5C49A;--bg:#f8f7f5;--card:#fff;--bd:#e5e3dc;--text:#1a1a1a;--muted:#888;--sf:#f3f2ef}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
/* 헤더 */
.hdr{background:var(--card);border-bottom:0.5px solid var(--bd);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.logo{background:var(--o);color:#fff;font-size:13px;font-weight:600;padding:4px 10px;border-radius:6px}
.dday-b{background:var(--ol);color:var(--od);font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;border:0.5px solid var(--ob);cursor:pointer}
.uinfo{display:flex;align-items:center;gap:8px;position:relative}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;flex-shrink:0}
.notif-btn{position:relative;background:none;border:none;cursor:pointer;padding:0}
.notif-badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:#E24B4A;color:#fff;font-size:10px;font-weight:600;display:none;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid var(--card)}
.notif-badge.show{display:flex}
.notif-panel{position:absolute;top:38px;right:0;width:300px;background:var(--card);border:0.5px solid var(--bd);border-radius:12px;z-index:100;display:none;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.notif-panel.open{display:block}
.notif-item{padding:10px 14px;border-bottom:0.5px solid var(--bd);cursor:pointer;font-size:13px}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:var(--ol)}
.logout-btn{font-size:12px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--bd);background:none;color:var(--muted);cursor:pointer}
/* 네비 */
.nav{display:flex;padding:0 16px;background:var(--card);border-bottom:0.5px solid var(--bd);overflow-x:auto;position:sticky;top:51px;z-index:49}
.nb{padding:10px 14px;font-size:13px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:5px;font-weight:400}
.nb.active{color:var(--o);border-bottom-color:var(--o);font-weight:500}
.nb:hover:not(.active){color:var(--text)}
/* 레이아웃 */
.cnt{padding:20px;max-width:1200px;margin:0 auto}
/* 카드/섹션 */
.card{background:var(--card);border:0.5px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.card-o{border-color:var(--ob)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.st{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.oi{color:var(--o)}
/* 버튼 */
.btn{font-size:12px;padding:6px 12px;border-radius:8px;border:0.5px solid var(--bd);background:none;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.btn:hover{background:var(--sf)}
.btn-o{background:var(--o);color:#fff;border-color:var(--o)}
.btn-o:hover{background:var(--od);color:#fff}
.btn-g{border-color:transparent;color:var(--muted)}
.btn-g:hover{color:var(--text);background:var(--sf)}
.btn-red{color:#A32D2D;border-color:#F09595}
.btn-red:hover{background:#FCEBEB}
/* 뱃지 */
.badge{font-size:10px;padding:2px 7px;border-radius:9px;font-weight:500;white-space:nowrap}
.bo{background:var(--ol);color:var(--od)}
.bb{background:#E6F1FB;color:#185FA5}
.br{background:#FCEBEB;color:#A32D2D}
.bg{background:#EAF3DE;color:#3B6D11}
.bgr{background:#F1EFE8;color:#5F5E5A}
.bp{background:#EEEDFE;color:#534AB7}
.bpu{background:#F0F0F0;color:#666666}
.bgv{background:#1E4D0F;color:#fff}
/* 입력 */
.inp{width:100%;padding:8px 11px;border:0.5px solid var(--bd);border-radius:8px;font-size:13px;background:var(--sf);color:var(--text);margin-bottom:8px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--o)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.5}
select.inp{cursor:pointer}
/* 그리드 */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:12px;border:0.5px solid var(--bd);padding:14px;text-align:center;transition:border-color .15s,transform .1s}.kpi[onclick]:hover{border-color:var(--ob);transform:translateY(-1px)}
.kn{font-size:24px;font-weight:500;margin-bottom:3px}
.kl{font-size:11px;color:var(--muted)}
/* 진행률 바 */
.pgb{height:5px;border-radius:3px;background:var(--sf);overflow:hidden;margin-top:4px}
.pgf{height:100%;border-radius:3px;transition:width .4s}
/* D-day 칩 */
.dlc{font-size:10px;font-weight:500;padding:2px 7px;border-radius:9px;white-space:nowrap}
.dl-ok{background:#EAF3DE;color:#3B6D11}
.dl-w{background:var(--ol);color:var(--od)}
.dl-c{background:#FCEBEB;color:#A32D2D}
.dl-d{background:#F1EFE8;color:#5F5E5A}
/* Go/No-Go */
.gng-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.gng-c{border-radius:9px;padding:10px 12px;border:0.5px solid var(--bd);display:flex;align-items:flex-start;gap:8px;background:var(--card)}
.gng-l{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.lg-r{background:#E24B4A}.lg-o{background:var(--o)}.lg-g{background:#639922}
/* 체크리스트 */
.cat-tabs{display:flex;gap:0;border-bottom:0.5px solid var(--bd);margin-bottom:16px;overflow-x:auto;padding-bottom:0}
.cat-tab{padding:8px 14px;font-size:12px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.cat-tab.active{color:var(--o);border-bottom-color:var(--o);font-weight:500}
.cat-tab:hover:not(.active){color:var(--text)}
.ck-item{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:10px;border:0.5px solid var(--bd);margin-bottom:6px;background:var(--card);cursor:pointer;transition:border-color .15s}
.ck-item:hover{border-color:var(--ob)}
.ck-item.done-item{opacity:.6;cursor:pointer}
.ck-cb{accent-color:var(--o);width:16px;height:16px;margin-top:2px;flex-shrink:0;cursor:pointer}
.ck-body{flex:1;min-width:0}
.ck-title{font-size:13px;font-weight:500;margin-bottom:4px;line-height:1.4}
.ck-title.done{text-decoration:line-through;color:var(--muted)}
.ck-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.ck-right{display:flex;align-items:center;gap:6px;flex-shrink:0;position:relative;z-index:2}
.sub-wrap{display:none;padding:2px 0 2px 26px}
.sub-wrap.open{display:block}
.sub-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-size:12px;cursor:pointer}
.sub-row:hover{background:var(--sf)}
.sub-row input{accent-color:var(--o);width:13px;height:13px;flex-shrink:0}
.vbadge{font-size:9px;padding:1px 5px;border-radius:6px;background:#EEEDFE;color:#534AB7}
.vbadge.ok{background:#EAF3DE;color:#3B6D11}
/* 상태 셀렉트 */
.st-sel{font-size:11px;padding:2px 6px;border:0.5px solid var(--bd);border-radius:6px;background:var(--sf);cursor:pointer;color:var(--text);outline:none}
.st-sel:focus{border-color:var(--o)}
/* 담당자 칩 */
.owner-chips{display:flex;flex-wrap:wrap;gap:4px;min-height:30px;padding:4px 6px;border:0.5px solid var(--bd);border-radius:8px;background:var(--sf);margin-bottom:8px;align-items:center}
.ochip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;color:#fff}
.ochip-x{cursor:pointer;opacity:.7;font-size:10px}
.ochip-x:hover{opacity:1}
/* 캘린더 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dh{text-align:center;font-size:11px;color:var(--muted);padding:5px;font-weight:500}
.cal-cell{min-height:72px;border-radius:8px;padding:5px;border:0.5px solid transparent;background:var(--sf);position:relative;cursor:pointer;transition:border-color .12s;overflow:hidden}
.cal-cell:hover{border-color:var(--o)}
.cal-cell.today{border-color:var(--o);border-width:1.5px}
.cal-cell.empty{background:transparent;border:none;cursor:default}
.cal-cell.wknd{opacity:.6}
.cal-cell.drag-over{border-color:var(--o);background:var(--ol);border-style:dashed}
.cal-num{font-size:11px;font-weight:500;margin-bottom:2px}
.cal-cell.today .cal-num{color:var(--o)}
.cal-ev{font-size:9px;padding:2px 5px;border-radius:3px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab;max-width:100%;display:block}
.cal-ev.dragging{opacity:.4}
.cal-add{position:absolute;bottom:3px;right:3px;width:17px;height:17px;border-radius:50%;background:var(--o);color:#fff;font-size:13px;line-height:17px;text-align:center;display:none;border:none;cursor:pointer}
.cal-cell:hover .cal-add{display:block}
/* 회의록 */
.mtg-card{padding:14px;border:0.5px solid var(--bd);border-radius:10px;margin-bottom:10px;cursor:pointer;background:var(--card);transition:border-color .15s}
.mtg-card:hover{border-color:var(--ob)}
/* 댓글 */
.comment{background:var(--sf);border-radius:10px;padding:12px;margin-bottom:8px;border-left:3px solid var(--o)}
.cauth{font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;margin-bottom:5px}
.ctime{font-size:10px;color:var(--muted);font-weight:400}
.ctext{font-size:13px;color:#333;line-height:1.6;white-space:pre-wrap}
/* 모달/오버레이 */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding-top:28px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;border:0.5px solid var(--bd);border-top:3px solid var(--o);width:580px;max-width:95%;max-height:90vh;overflow-y:auto}
.mh{padding:14px 18px;border-bottom:0.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px}
.mb{padding:18px}
.mf{padding:12px 18px;border-top:0.5px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
/* 토스트 */
.toast{position:fixed;bottom:20px;right:20px;background:#2d6a27;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
/* 기타 */
.rdot{width:7px;height:7px;border-radius:50%;background:#639922;display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
.hist-r{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--bd);font-size:12px}
.kpi-tbl{width:100%;border-collapse:collapse;font-size:12px}
.kpi-tbl th{background:var(--sf);padding:8px;text-align:left;font-weight:500;font-size:11px;color:var(--muted);border-bottom:0.5px solid var(--bd);white-space:nowrap}
.kpi-tbl td{padding:7px 8px;border-bottom:0.5px solid var(--bd)}
.kpi-cell{width:100%;min-width:70px;padding:4px 7px;border:0.5px solid var(--bd);border-radius:5px;font-size:12px;background:var(--sf);color:var(--text);outline:none}
.kpi-cell:focus{border-color:var(--o)}
.dash-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--bd);font-size:13px}
.dash-row:last-child{border-bottom:none}
@media(max-width:640px){.two{grid-template-columns:1fr}.three{grid-template-columns:1fr}.cnt{padding:12px}}
</style>
</head>
<body style="visibility:hidden">

<div class="hdr">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span class="logo">OPLE</span>
    <span style="font-size:14px;font-weight:500">Shopify 전환 프로젝트</span>
    <span class="dday-b" id="dday-c" onclick="openDdayEdit()">D-? · ?</span>
    <span style="font-size:11px;color:var(--muted)"><span class="rdot"></span>실시간</span>
  </div>
  <div class="uinfo">
    <button class="notif-btn" onclick="toggleNotif()">
      <div class="av" id="user-av" style="width:30px;height:30px;font-size:12px;background:var(--o)">?</div>
      <div class="notif-badge" id="notif-badge"></div>
    </button>
    <span id="user-name" style="font-size:13px;color:var(--muted)"></span>
    <div class="notif-panel" id="notif-panel">
      <div style="padding:10px 14px;font-size:12px;font-weight:500;color:var(--muted);border-bottom:0.5px solid var(--bd)">내 담당 항목</div>
      <div id="notif-list"></div>
    </div>
    <button class="logout-btn" onclick="logout()">로그아웃</button>
  </div>
</div>

<div class="nav">
  <button class="nb active" onclick="showTab('dash')" id="tab-dash"><i class="ti ti-layout-dashboard"></i>대시보드</button>
  <button class="nb" onclick="showTab('cal')" id="tab-cal"><i class="ti ti-calendar"></i>캘린더</button>
  <button class="nb" onclick="showTab('ck')" id="tab-ck"><i class="ti ti-checklist"></i>체크리스트</button>
  <button class="nb" onclick="showTab('kpi')" id="tab-kpi"><i class="ti ti-chart-line"></i>KPI</button>
  <button class="nb" onclick="showTab('mtg')" id="tab-mtg"><i class="ti ti-notes"></i>회의록</button>
  <button class="nb" onclick="showTab('files')" id="tab-files"><i class="ti ti-paperclip"></i>파일 보관함</button>
  <button class="nb" onclick="showTab('histlog')" id="tab-histlog"><i class="ti ti-history"></i>History Log</button>
</div>

<div class="cnt" id="mc">
  <div style="animation:pulse 1.5s ease-in-out infinite">
    <div style="height:110px;background:var(--card);border-radius:12px;margin-bottom:14px;border:0.5px solid var(--bd)"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div style="height:200px;background:var(--card);border-radius:12px;border:0.5px solid var(--bd)"></div>
      <div style="height:200px;background:var(--card);border-radius:12px;border:0.5px solid var(--bd)"></div>
    </div>
  </div>
</div>
<style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}</style>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const sb=createClient('https://btutlgcidpjgedpypzri.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0dXRsZ2NpZHBqZ2VkcHlwenJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NTE0MjQsImV4cCI6MjA5ODAyNzQyNH0.qZp04DhOmm4oSho3Qsfz8UWEeY-eNhGcIydyVNejqBc')

// ── 상수 ──
const MC=['#E8680A','#534AB7','#0F6E56','#A32D2D','#185FA5','#854F0B','#993556','#5F5E5A']
const STATUS_LIST=['할 일','진행중','검증대기','보류','완료','검증완료']
const STATUS_NEXT={'할 일':'진행중','진행중':'검증대기','검증대기':'완료','완료':'완료','보류':'할 일','검증완료':'검증완료'}
const TODAY=new Date()

const DEFAULT_MEMBERS=[{name:'한덕희',email:'handeokhee@ople.co'},{name:'박영환',email:'younghwan@ople.co'},{name:'천세나',email:'sena@ople.co'},{name:'권현정',email:'hyunjeong@ople.co'},{name:'김현수',email:'hyunsu@ople.co'}]
function getMembers(){
  try{
    const dbRow=(D.appSettings||[]).find(r=>r.key==='members')
    if(dbRow?.value){const parsed=JSON.parse(dbRow.value);if(parsed.length)return parsed.map((m,i)=>({...m,color:MC[i%MC.length]}))}
    const s=localStorage.getItem('ople-members')
    return(s?JSON.parse(s):DEFAULT_MEMBERS).map((m,i)=>({...m,color:MC[i%MC.length]}))
  }catch{return DEFAULT_MEMBERS.map((m,i)=>({...m,color:MC[i%MC.length]}))}
}

// ── 상태 ──
let MEMBERS=[], curUser=null, activeTab='dash'
let expandCks={}
window.activeCat='전체'
window.setCat=(id)=>{window.activeCat=id;render()}
window.ckFilter={status:'',priority:'',owner:'',requester:'',keyword:''}
window.setCkFilter=(key,val)=>{window.ckFilter[key]=val;render()}
window.filterCkItems=()=>{
  // 검색 시 포커스 유지하면서 체크리스트만 업데이트
  const ckArea=document.getElementById('ck-items-area')
  if(!ckArea){render();return}
  const kw=window.ckFilter.keyword.toLowerCase().trim()
  const allItems=D.cats.flatMap(cat=>D.items.filter(i=>i.category_id===cat.id))
  let filtered=[...allItems]
  if(window.ckFilter.status)filtered=filtered.filter(i=>(i.status||'할 일')===window.ckFilter.status)
  if(window.ckFilter.priority)filtered=filtered.filter(i=>i.priority===window.ckFilter.priority)
  if(window.ckFilter.owner)filtered=filtered.filter(i=>{const owners=Array.isArray(i.owners)&&i.owners.length?i.owners:i.owner?[i.owner]:[];return owners.includes(window.ckFilter.owner)})
  if(window.ckFilter.requester)filtered=filtered.filter(i=>i.requester===window.ckFilter.requester)
  if(kw){
    filtered=filtered.filter(i=>{
      if(i.text?.toLowerCase().includes(kw))return true
      const owners=Array.isArray(i.owners)&&i.owners.length?i.owners:i.owner?[i.owner]:[]
      if(owners.some(o=>o.toLowerCase().includes(kw)))return true
      if(i.requester?.toLowerCase().includes(kw))return true
      const itemCmts=D.comments.filter(c=>c.item_id===i.id)
      if(itemCmts.some(c=>{let txt=c.text||'';try{const p=JSON.parse(c.text);txt=p.text||txt}catch{};return txt.toLowerCase().includes(kw)||c.user_name?.toLowerCase().includes(kw)}))return true
      const subs=D.subs.filter(s=>s.item_id===i.id)
      if(subs.some(s=>s.text?.toLowerCase().includes(kw)))return true
      return false
    })
  }
  ckArea.innerHTML=renderCheckItems(filtered)
  // 포커스 복원
  const si=document.getElementById('ck-search')
  if(si){const pos=si.value.length;si.focus();si.setSelectionRange(pos,pos)}
}
window.resetCkFilter=()=>{window.ckFilter={status:'',priority:'',owner:'',requester:'',keyword:''};const ki=document.getElementById('ck-search');if(ki)ki.value='';render()}
let calYear=2026, calMonth=6
let notifOpen=false
let D={cats:[],items:[],subs:[],comments:[],kpiRows:[],kpiAnalysis:{},actionItems:[],meetings:[],history:[],appSettings:[]}

// ── 인증 ──
const {data:{session}}=await sb.auth.getSession()
if(!session){location.href='index.html';throw new Error()}
const curEmail=session.user.email
MEMBERS=getMembers()
curUser=MEMBERS.find(m=>m.email===curEmail)||{name:curEmail.split('@')[0],color:'#888'}
// localStorage 멤버를 DB에 동기화 (최초 1회)
if(!(D.appSettings||[]).find(r=>r.key==='members')){
  const localMembers=localStorage.getItem('ople-members')
  if(localMembers){
    sb.from('app_settings').insert({key:'members',value:localMembers,updated_at:new Date().toISOString()}).then(({error})=>{
      if(!error)D.appSettings=[...(D.appSettings||[]),{key:'members',value:localMembers}]
    })
  }
}
document.getElementById('user-av').textContent=curUser.name[0]
document.getElementById('user-av').style.background=curUser.color
document.getElementById('user-name').textContent=curUser.name
window.logout=async()=>{await sb.auth.signOut();location.href='index.html'}

// ── 유틸 ──
function ddu(ds){if(!ds)return 999;return Math.ceil((new Date(ds)-TODAY)/864e5)}
function calcDD(){return Math.max(0,Math.ceil((new Date(getDday())-TODAY)/864e5))}
function getDday(){
  try{
    const dbRow=(D.appSettings||[]).find(r=>r.key==='dday')
    if(dbRow?.value)return dbRow.value
  }catch{}
  return localStorage.getItem('ople-dday')||'2026-07-14'
}
function setDday(d){localStorage.setItem('ople-dday',d)}
function fmtDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'})}
function ts(){return new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function dlc(dl,done){
  if(done)return`<span class="dlc dl-d">완료</span>`
  if(!dl)return''
  const d=ddu(dl)
  if(d<0)return`<span class="dlc dl-c">D+${Math.abs(d)}초과</span>`
  if(d===0)return`<span class="dlc dl-c">오늘</span>`
  if(d<=3)return`<span class="dlc dl-c">D-${d}</span>`
  if(d<=7)return`<span class="dlc dl-w">D-${d}</span>`
  return`<span class="dlc dl-ok">D-${d}</span>`
}
function stBadge(s){
  const m={'할 일':'bgr','진행중':'bb','검증대기':'bo','보류':'bpu','완료':'bg','검증완료':'bgv'}
  return`<span class="badge ${m[s]||'bgr'}">${s||'할 일'}</span>`
}
function prBadge(p){return{critical:'<span class="badge br">긴급</span>',high:'<span class="badge bo">중요</span>',medium:'<span class="badge bg">보통</span>'}[p]||''}
function avEl(name,sz=22){
  const m=MEMBERS.find(m=>m.name===name)
  let c=m?m.color:'#888'
  if(!m&&name){
    // 이름 기반 일관된 색상 생성
    const colors=['#185FA5','#3B6D11','#534AB7','#0F6E56','#854F0B','#993556','#5F5E5A','#A32D2D']
    let hash=0;for(let i=0;i<name.length;i++)hash=(hash*31+name.charCodeAt(i))&0xfffffff
    c=colors[hash%colors.length]
  }
  return`<div class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px;background:${c}" title="${name}">${name?name[0]:'?'}</div>`
}
function ownersEl(owners,sz=20){return(Array.isArray(owners)?owners:[owners||'']).filter(Boolean).map(o=>avEl(o,sz)).join('')}
function getCatColor(id){const c=D.cats.find(c=>c.id===id);return c?c.color:'#888'}
function getOwners(a){return Array.isArray(a.owners)&&a.owners.length?a.owners:a.owner?[a.owner]:[]}
function toast(msg,ok=true){const t=document.getElementById('toast');t.textContent=msg;t.style.background=ok?'#2d6a27':'#A32D2D';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function mkOv(id){const old=document.getElementById(id);if(old)old.remove();const w=document.createElement('div');w.id=id;w.className='overlay';w.onclick=e=>{if(e.target===w)w.remove()};return w}

window.toggleNotif=()=>{
  notifOpen=!notifOpen
  document.getElementById('notif-panel').classList.toggle('open',notifOpen)
  if(notifOpen)setTimeout(()=>document.addEventListener('click',()=>{notifOpen=false;document.getElementById('notif-panel').classList.remove('open')},{once:true}),100)
}
function updateNotif(){
  const myItems=D.items.filter(a=>{
    if(a.done||a.status==='완료'||a.status==='검증완료')return false
    const o=getOwners(a)||[]
    return o.includes(curUser.name)||a.owner===curUser.name
  })
  const mentionCmts=D.comments.filter(c=>{
    try{
      let mentions=[];try{const p=JSON.parse(c.text);const t=p.text||c.text;mentions=[...t.matchAll(/@(\S+)/g)].map(m=>m[1])}catch{mentions=typeof c.text==='string'?[...c.text.matchAll(/@(\S+)/g)].map(m=>m[1]):[]}
      return mentions.includes(curUser.name)
    }catch{return false}
  }).slice(0,3)
  const total=myItems.length+mentionCmts.length
  const badge=document.getElementById('notif-badge')
  badge.textContent=total;badge.classList.toggle('show',total>0)
  const list=document.getElementById('notif-list')
  const mentionHtml=mentionCmts.length?`<div style="padding:8px 14px;font-size:11px;font-weight:600;color:var(--o);border-bottom:0.5px solid var(--bd)"><i class="ti ti-at"></i> 멘션</div>`+
    mentionCmts.map(c=>{
      let txt=c.text;try{const p=JSON.parse(c.text);txt=p.text||txt}catch{}
      const item=D.items.find(i=>i.id===c.item_id)
      return`<div class="notif-item" onclick="location.href='detail.html?type=item&id=${c.item_id}'">
        <div style="font-size:11px;color:var(--muted);margin-bottom:2px"><i class="ti ti-at" style="color:var(--o)"></i> ${c.user_name}님이 언급</div>
        <div style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${txt.replace(/@(\S+)/g,'<b style="color:var(--o)">@$1</b>')}</div>
        ${item?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${item.text}</div>`:''}
      </div>`
    }).join('')+`<div style="height:1px;background:var(--bd);margin:0"></div>`:''
  const taskHtml=myItems.length
    ?`<div style="padding:8px 14px;font-size:11px;font-weight:600;color:var(--muted)">담당 항목</div>`+myItems.slice(0,5).map(a=>`<div class="notif-item" onclick="goNotifItem('${a.id}','${a.category_id||''}')"><div style="font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.text}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${dlc(a.deadline,false)}</div></div>`).join('')+(myItems.length>5?`<div style="padding:8px 14px;font-size:11px;color:var(--muted)">+${myItems.length-5}건 더</div>`:'')
    :''
  list.innerHTML=mentionHtml+taskHtml||(mentionHtml+taskHtml?mentionHtml+taskHtml:`<div style="padding:14px;font-size:13px;color:var(--muted);text-align:center">새 알림 없음</div>`)
  if(!mentionHtml&&!taskHtml)list.innerHTML=`<div style="padding:14px;font-size:13px;color:var(--muted);text-align:center">새 알림 없음</div>`
}

async function loadAll(){
  const [cR,iR,sR,cmR,kR,kaR,aR,mR,hR,kdR,asR]=await Promise.all([
    sb.from('checklist_categories').select('*').order('sort_order'),
    sb.from('checklist_items').select('*').order('sort_order'),
    sb.from('checklist_subs').select('*').order('sort_order'),
    sb.from('checklist_comments').select('*').order('created_at'),
    sb.from('kpi_data').select('*'),
    sb.from('kpi_analysis').select('*').eq('id','main').single(),
    sb.from('action_items').select('*').order('created_at'),
    sb.from('meetings').select('*').order('date',{ascending:false}),
    sb.from('history').select('*').order('created_at',{ascending:false}).limit(100),
    sb.from('kpi_daily').select('*').order('record_date'),
    sb.from('app_settings').select('*'),
  ])
  D={cats:cR.data||[],items:iR.data||[],subs:sR.data||[],comments:cmR.data||[],kpiRows:kR.data||[],kpiAnalysis:kaR.data||{},actionItems:aR.data||[],meetings:mR.data||[],history:hR.data||[],kpiDaily:kdR.data||[],appSettings:asR?.data||[]}
  updateNotif();render()
  document.body.style.visibility='visible'
}

window.render=function render(){
  document.getElementById('dday-c').textContent=`D-${calcDD()} · ${getDday().slice(5).replace('-','/')}`
  const mc=document.getElementById('mc')
  if(activeTab==='dash')mc.innerHTML=renderDash()
  else if(activeTab==='cal')mc.innerHTML=renderCal()
  else if(activeTab==='ck')mc.innerHTML=renderCK()
  else if(activeTab==='kpi'){
    const focusedNote=document.activeElement?.id==='kpi-note-ta'
    const noteVal=focusedNote?document.getElementById('kpi-note-ta').value:null
    mc.innerHTML=renderKPITab()
    if(focusedNote&&noteVal!==null){
      const ta=document.getElementById('kpi-note-ta')
      if(ta){ta.value=noteVal;ta.focus()}
    }
  }
  else if(activeTab==='files')mc.innerHTML=renderFiles()
  else if(activeTab==='histlog')mc.innerHTML=renderHistLog()

}

    const d=its.reduce((s,i)=>s+(i.done?1:0)+D.subs.filter(s=>s.item_id===i.id&&s.done).length,0)
    return{...cat,t,d,pct:t?Math.round(d/t*100):0}

    return{...m,count:mine.length,items:mine.slice(0,3)}

  // KPI 미리보기

function renderCal(){
  const ML=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월']
  const yr=calYear,mo=calMonth
  const first=new Date(yr,mo,1).getDay(),last=new Date(yr,mo+1,0).getDate()
  const days=['일','월','화','수','목','금','토']
  // 모든 항목 (체크리스트 + 액션)
  const allItems=D.items
  function evsOn(d){
    const k=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    return allItems.filter(i=>i.deadline===k)
  }
  let cells=''
  for(let i=0;i<first;i++)cells+=`<div class="cal-cell empty"></div>`
  for(let d=1;d<=last;d++){
    const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const evs=evsOn(d),wk=(d+first-1)%7
    const isToday=ds===TODAY.toISOString().slice(0,10)
    cells+=`<div class="cal-cell${wk===0||wk===6?' wknd':''}${isToday?' today':''}" onclick="calClick('${ds}')" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="event.preventDefault();this.classList.remove('drag-over');calDrop('${ds}',event)">
    <div class="cal-num">${d}</div>
    ${evs.slice(0,2).map(e=>{
      const color=e.category_id?getCatColor(e.category_id):'var(--o)'
      const isDone=e.done||e.status==='완료'||e.status==='검증완료'
      return`<div class="cal-ev" draggable="true" style="background:${color}22;color:${color};border-left:2px solid ${color};${isDone?'text-decoration:line-through;opacity:.5':''}" onclick="event.stopPropagation();${e.category_id?`location.href='detail.html?type=item&id=${e.id}'`:`openAIDetail('${e.id}')`}" ondragstart="event.stopPropagation();calDragStart('${e.id}','${e.category_id?'item':'action'}',event)" ondragend="event.target.classList.remove('dragging')">${e.text}</div>`
    }).join('')}
    ${evs.length>2?`<div style="font-size:9px;color:var(--muted);padding:1px 2px">+${evs.length-2}개 더</div>`:''}
    <button class="cal-add" onclick="event.stopPropagation();openAddItem('','${ds}')">+</button>
    </div>`
  }
  // 이번 달 전체 목록
  const monthItems=allItems.filter(i=>{if(!i.deadline)return false;const d=new Date(i.deadline);return d.getFullYear()===yr&&d.getMonth()===mo}).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline))

  return`<div class="card">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn btn-g" onclick="calNav(-1)"><i class="ti ti-chevron-left"></i></button>
      <span style="font-size:15px;font-weight:500">${yr}년 ${ML[mo]}</span>
      <button class="btn btn-g" onclick="calNav(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <button class="btn btn-o" onclick="openAddItem('','')"><i class="ti ti-plus"></i> 항목 추가</button>
  </div>
  <div class="cal-grid">${days.map(d=>`<div class="cal-dh">${d}</div>`).join('')}${cells}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)">
    ${D.cats.map(c=>`<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:3px"></span>${c.label}</span>`).join('')}
  </div>
  </div>
  <div class="card">
  <div class="sh"><span class="st"><i class="ti ti-list oi"></i> ${ML[mo]} 마감 항목 (${monthItems.length}건)</span></div>
  ${monthItems.map(i=>{
    const color=i.category_id?getCatColor(i.category_id):'var(--o)'
    const isDone=i.done||i.status==='완료'||i.status==='검증완료'
    return`<div class="dash-row" style="cursor:pointer" onclick="${i.category_id?`location.href='detail.html?type=item&id=${i.id}'`:`openAIDetail('${i.id}')`}">
    <span style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0"></span>
    <div style="flex:1;min-width:0"><div style="font-size:13px;${isDone?'text-decoration:line-through;color:var(--muted)':''};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.text}</div>
    <div style="font-size:11px;color:var(--muted)">${i.owner||ownersEl(i.owners||[],14)}</div></div>
    <span style="font-size:11px;color:var(--muted);white-space:nowrap">${fmtDate(i.deadline)}</span>
    ${dlc(i.deadline,isDone)}
    </div>`
  }).join('')||'<div style="font-size:13px;color:var(--muted)">이번 달 마감 항목 없음</div>'}
  </div>`
}
let _dragId=null,_dragType=null
window.calDragStart=(id,type,event)=>{_dragId=id;_dragType=type;event.target.classList.add('dragging');event.dataTransfer.setData('text/plain',id)}
window.calDrop=async(newDate,event)=>{
  const id=_dragId||event.dataTransfer.getData('text/plain');if(!id||!newDate)return
  if(_dragType==='item'||D.items.find(i=>i.id===id)){
    const item=D.items.find(i=>i.id===id);if(!item||item.deadline===newDate)return
    await sb.from('checklist_items').update({deadline:newDate,updated_at:new Date().toISOString()}).eq('id',id)
    await logH('마감일 변경 (드래그)',`${item.text}: →${newDate}`)
  } else {
    const a=D.actionItems.find(a=>a.id===id);if(!a||a.deadline===newDate)return
    await sb.from('action_items').update({deadline:newDate,updated_at:new Date().toISOString()}).eq('id',id)
    await logH('마감일 변경 (드래그)',`${a.text}: →${newDate}`)
  }
  toast('마감일 변경됨');_dragId=null;await loadAll()
}
window.calNav=(dir)=>{calMonth+=dir;if(calMonth>11){calMonth=0;calYear++}if(calMonth<0){calMonth=11;calYear--};render()}
window.calClick=(ds)=>{
  const evs=D.items.filter(i=>i.deadline===ds)
  if(evs.length===0){openAddItem('',ds);return}
  // 날짜 클릭 → 해당 날짜 항목 팝업

  w.innerHTML=`<div class="modal" style="width:480px">
  <div class="mh">
    <div>
      <div style="font-weight:500;font-size:15px">${dateLabel}</div>

      <button class="btn btn-g" onclick="document.getElementById('cal-day-ov').remove()"><i class="ti ti-x"></i></button>
    </div>
  </div>
  <div class="mb" style="padding:12px 16px">
    ${evs.map(e=>{
      const isDone=e.done||e.status==='완료'||e.status==='검증완료'
      const color=e.category_id?getCatColor(e.category_id):'var(--o)'
      const catLabel=e.category_id?D.cats.find(c=>c.id===e.category_id)?.label||'':'회의록 액션'
      const owners=e.category_id?
        (e.owners?.length?e.owners:e.owner?[e.owner]:[]):
        (Array.isArray(e.owners)&&e.owners.length?e.owners:e.owner?[e.owner]:[])
      return`<div style="display:flex;align-items:flex-start;gap:10px;padding:10px;border:0.5px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--card)" onclick="document.getElementById('cal-day-ov').remove();${e.category_id?`location.href='detail.html?type=item&id=${e.id}'`:`openAIDetail('${e.id}')`}">
        <div style="width:4px;height:100%;min-height:40px;border-radius:2px;background:${color};flex-shrink:0;margin-top:2px"></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:500;${isDone?'text-decoration:line-through;color:var(--muted)':''};margin-bottom:4px">${e.text}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
            <span style="font-size:10px;color:${color};background:${color}18;padding:1px 6px;border-radius:4px">${catLabel}</span>
            ${owners.map(o=>avEl(o,18)).join('')}
            <span class="badge ${isDone?'bg':e.status==='진행중'?'bb':'bgr'}">${e.status||'할 일'}</span>
            ${e.priority==='critical'?'<span class="badge br">긴급</span>':e.priority==='high'?'<span class="badge bo">중요</span>':''}
          </div>
        </div>
        <i class="ti ti-chevron-right" style="color:var(--muted);font-size:14px;flex-shrink:0;margin-top:4px"></i>
      </div>`
    }).join('')}
  </div>
  </div>`
  document.body.appendChild(w)
}

function renderCK(){
  const allCats=[{id:"전체",label:"전체",color:"#888"},...D.cats]
  const getItems=()=>{
    if(window.activeCat==="전체")return D.items
    return D.items.filter(i=>i.category_id===window.activeCat)
  }
  const items=getItems()
  const total=items.length
  const done=items.filter(i=>i.done||i.status==="완료"||i.status==="검증완료").length
  // 완료 항목 기본 접힘
  items.forEach(i=>{if((i.done||i.status==="완료"||i.status==="검증완료")&&expandCks[i.id]===undefined)expandCks[i.id]=false})

  function catDone(id){
    if(id==="전체")return D.items.filter(i=>i.done).length
    return D.items.filter(i=>i.category_id===id&&i.done).length
  }
  function catTotal(id){
    if(id==="전체")return D.items.length
    return D.items.filter(i=>i.category_id===id).length
  }

  const sidebarItems = allCats.map(cat=>{
    const t=catTotal(cat.id), d=catDone(cat.id)
    const isActive=window.activeCat===cat.id
    const pct=t?Math.round(d/t*100):0
    const activeStyle=isActive?"background:var(--ol);color:var(--o);font-weight:600;border-left:3px solid var(--o)":"background:none;color:var(--text);font-weight:400;border-left:3px solid transparent"
    const countBadge=t>0?`<span style="font-size:10px;color:${isActive?"var(--o)":"var(--muted)"};flex-shrink:0">${d}/${t}</span>`:""
    const progressBar=t>0?`<div style="margin:0 14px 4px;height:2px;background:var(--sf);border-radius:1px"><div style="width:${pct}%;height:100%;background:${pct===100?"#639922":cat.color};border-radius:1px"></div></div>`:""
    return `<button onclick="setCat('` + cat.id + `')" style="width:100%;padding:9px 14px;border:none;${activeStyle};font-size:12px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;transition:all .15s"><span style="width:8px;height:8px;border-radius:50%;background:${cat.color};flex-shrink:0"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cat.label}</span>${countBadge}</button>${progressBar}`
  }).join("")

  const catLabel = allCats.find(c=>c.id===window.activeCat)?.label||"전체"
  const addCatId = (window.activeCat==="전체"||window.activeCat==="회의록액션")?"":window.activeCat
  const progPct = total?Math.round(done/total*100):0
  const progBar = total?`<div class="pgb" style="width:120px;display:inline-block;vertical-align:middle"><div class="pgf" style="width:${progPct}%;background:${done===total?"#639922":"var(--o)"}"></div></div>`:""
  const kpiNote = window.activeCat==="kpicat"?`<div style="background:var(--ol);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--od);margin-bottom:12px">KPI 수치는 <span style="font-weight:600;cursor:pointer;text-decoration:underline" onclick="showTab('kpi')">KPI 탭</span>에서 입력하세요.</div>`:""

  return `<div style="display:flex;gap:0;min-height:calc(100vh - 140px)">
  <div style="width:200px;flex-shrink:0;background:var(--card);border:0.5px solid var(--bd);border-radius:12px;padding:10px 0;margin-right:14px;height:fit-content;position:sticky;top:80px">
    ${sidebarItems}
    <div style="border-top:0.5px solid var(--bd);margin:8px 10px;padding-top:8px">
      <button class="btn" style="width:100%;justify-content:center;font-size:11px" onclick="openAddCat()"><i class="ti ti-folder-plus"></i> 카테고리 추가</button>
    </div>
  </div>
  <div style="flex:1;min-width:0">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:15px;font-weight:500">${catLabel}</span>
        <span style="font-size:13px;color:var(--muted)">${done}/${total} 완료</span>
        ${progBar}
      </div>
      <button class="btn btn-o" onclick="openAddItem('${addCatId}','')"><i class="ti ti-plus"></i> 항목 추가</button>
    </div>
    <!-- 필터 바 -->
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:10px 12px;background:var(--card);border:0.5px solid var(--bd);border-radius:10px">
      <i class="ti ti-filter" style="color:var(--muted);font-size:13px"></i>
      <select style="font-size:12px;padding:4px 8px;border:0.5px solid var(--bd);border-radius:7px;background:var(--sf);color:var(--text);outline:none;cursor:pointer" onchange="setCkFilter('status',this.value)">
        <option value="">전체 상태</option>
        <option value="할 일" ${window.ckFilter.status==='할 일'?'selected':''}>할 일</option>
        <option value="진행중" ${window.ckFilter.status==='진행중'?'selected':''}>진행중</option>
        <option value="검증대기" ${window.ckFilter.status==='검증대기'?'selected':''}>검증대기</option>

function renderCheckItems(items){
  // 필터 적용
  let filtered=[...items]
  if(window.ckFilter.status)filtered=filtered.filter(i=>(i.status||'할 일')===window.ckFilter.status)
  if(window.ckFilter.priority)filtered=filtered.filter(i=>i.priority===window.ckFilter.priority)
  if(window.ckFilter.owner)filtered=filtered.filter(i=>{
    const owners=Array.isArray(i.owners)&&i.owners.length?i.owners:i.owner?[i.owner]:[]
    return owners.includes(window.ckFilter.owner)
  })
  if(window.ckFilter.requester)filtered=filtered.filter(i=>i.requester===window.ckFilter.requester)
  if(window.ckFilter.keyword){
    const kw=window.ckFilter.keyword.toLowerCase().trim()
    filtered=filtered.filter(i=>{
      // 제목 검색
      if(i.text?.toLowerCase().includes(kw))return true
      // 담당자 이름 검색
      const owners=Array.isArray(i.owners)&&i.owners.length?i.owners:i.owner?[i.owner]:[]
      if(owners.some(o=>o.toLowerCase().includes(kw)))return true
      // 요청자 검색
      if(i.requester?.toLowerCase().includes(kw))return true
      // 댓글 작성자 or 댓글 내용 검색
      const itemCmts=D.comments.filter(c=>c.item_id===i.id)
      if(itemCmts.some(c=>{
        let txt=c.text||''
        try{const p=JSON.parse(c.text);txt=p.text||txt}catch{}
        return txt.toLowerCase().includes(kw)||c.user_name?.toLowerCase().includes(kw)
      }))return true
      // 세부항목 검색
      const subs=D.subs.filter(s=>s.item_id===i.id)
      if(subs.some(s=>s.text?.toLowerCase().includes(kw)))return true
      return false
    })
  }

  if(!filtered.length){
    const hasFilter=Object.values(window.ckFilter).some(v=>v)
    return`<div style="text-align:center;padding:40px;color:var(--muted);font-size:14px">${hasFilter?`<div style="font-size:32px;margin-bottom:8px">🔍</div>필터 조건에 맞는 항목이 없어요.<br><span style="color:var(--o);cursor:pointer;font-size:13px" onclick="window.ckFilter={status:'',priority:'',owner:'',requester:''};render()">필터 초기화</span>`:'항목이 없어요.<br><span style="color:var(--o);cursor:pointer" onclick="openAddItem(\'\',\'\')">+ 추가하기</span>'}</div>`
  }
  return filtered.map(item=>{
    const subs=D.subs.filter(s=>s.item_id===item.id)
    const cmts=D.comments.filter(c=>c.item_id===item.id)
    const sdone=subs.filter(s=>s.done).length
    const isExp=expandCks[item.id]!==false
    const owners=item.owners?.length?item.owners:item.owner?[item.owner]:[]
    return`<div class="ck-item ${item.done?'done-item':''}" onclick="if(event.target.closest('button')||event.target.closest('.ck-right'))return;location.href='detail.html?type=item&id=${item.id}'">
    <input class="ck-cb" type="checkbox" ${item.done?'checked':''} onclick="event.stopPropagation()" onchange="toggleItem('${item.id}',this.checked)">
    <div class="ck-body" style="cursor:pointer">
      <div class="ck-title ${item.done?'done':''}">${item.text}</div>
      <div class="ck-meta">
        ${prBadge(item.priority)}
        <select class="st-sel" onclick="event.stopPropagation()" onchange="updateItemField('${item.id}','status',this.value)">
          ${STATUS_LIST.map(s=>`<option ${(item.status||'할 일')===s?'selected':''}>${s}</option>`).join('')}
        </select>
        ${ownersEl(owners,18)}
        ${item.deadline?`<span>${fmtDate(item.deadline)}</span>`:''}
        ${dlc(item.deadline,item.done)}
        ${subs.length?`<span>${sdone}/${subs.length} 세부</span>`:''}
        ${item.created_at?`<span style="font-size:10px;color:var(--muted)"><i class="ti ti-calendar-plus" style="font-size:9px"></i> ${new Date(item.created_at).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'})}</span>`:''}
      </div>
    </div>
    <div class="ck-right" onclick="event.stopPropagation()">
      ${item.status==='완료'?`<button class="btn verify-btn" data-id="${item.id}" style="padding:3px 8px;font-size:11px;background:#FEF0E6;color:#B84E06;border-color:#F5C49A;cursor:pointer"><i class="ti ti-clock" style="pointer-events:none"></i> <span style="pointer-events:none">검증대기</span></button>`:''}
      ${item.status==='검증완료'?`<span style="font-size:11px;color:#3B6D11;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:3px"><i class="ti ti-shield-check"></i> 검증완료 ${item.verified_by||''}</span>`:''}
      ${cmts.length?`<div style="display:flex;align-items:center;gap:2px;flex-shrink:0">
        ${[...new Set(cmts.map(c=>c.user_name))].slice(0,3).map(name=>avEl(name,18)).join('')}
        <span style="font-size:10px;color:var(--muted);margin-left:2px">${cmts.length}</span>
      </div>`:''}
      <button class="btn btn-g" style="padding:3px 8px;font-size:11px" onclick="location.href='detail.html?type=item&id=${item.id}'">
        <i class="ti ti-pencil"></i>
      </button>
      <button class="btn btn-g" style="padding:3px 6px;font-size:11px;color:#A32D2D" onclick="deleteItem('${item.id}')"><i class="ti ti-trash"></i></button>
    </div>
    </div>
    <div class="sub-wrap ${isExp?'open':''}" id="sub-${item.id}">
      ${subs.map(s=>`<div class="sub-row" onclick="if(event.target.closest('button'))return;location.href='detail.html?type=item&id=${item.id}'">
      <input type="checkbox" ${s.done?'checked':''} onclick="event.stopPropagation()" onchange="toggleSub('${s.id}','${item.id}',this.checked)" style="accent-color:var(--o);width:13px;height:13px;flex-shrink:0">
      <span style="${s.done?'text-decoration:line-through;color:var(--muted);':''}flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.text}</span>
      ${s.done&&!s.verified?`<button class="btn" style="font-size:10px;padding:1px 7px;background:#FEF0E6;color:#B84E06;border-color:#F5C49A" onclick="event.stopPropagation();event.preventDefault();verifySub('${s.id}','${item.id}');return false"><span style="pointer-events:none"><i class="ti ti-clock"></i> 검증대기</span></button>`:''}
      ${s.verified?`<span style="font-size:10px;color:#3B6D11;font-weight:500;white-space:nowrap"><i class="ti ti-shield-check"></i> 검증완료 ${s.verified_by||''}</span>`:''}
      </div>`).join('')}
      <div style="display:flex;gap:5px;padding:2px 8px;margin-top:0">
        <input id="ns-${item.id}" style="flex:1;font-size:12px;padding:5px 8px;border:0.5px solid var(--bd);border-radius:7px;background:var(--sf);color:var(--text);outline:none" placeholder="세부 항목 추가..." onkeydown="if(event.key==='Enter'){addSub('${item.id}');event.preventDefault()}">
        <button class="btn btn-o" style="padding:4px 9px;font-size:11px;flex-shrink:0" onclick="addSub('${item.id}')"><i class="ti ti-plus"></i></button>
      </div>
    </div>`
  }).join('')
}

  <td style="font-weight:500;white-space:nowrap">${m}</td>

window.toggleCkExp=id=>{expandCks[id]=expandCks[id]===false;render()}
window.toggleItem=async(id,checked)=>{
  const item=D.items.find(i=>i.id===id);if(!item)return
  const newStatus=checked?'완료':'할 일'
  if(checked)expandCks[id]=false  // 완료 시 세부항목 접기
  await sb.from('checklist_items').update({done:checked,status:newStatus,done_by:checked?curUser.name:null,updated_at:new Date().toISOString()}).eq('id',id)
  await logH(`항목 ${checked?'완료':'취소'}`,item.text,id);await loadAll()
}
window.updateItemField=async(id,field,val)=>{
  const upd={[field]:val,updated_at:new Date().toISOString()}
  if(field==='status'&&val==='검증완료'){upd.verified_by=curUser.name;upd.verified_at=new Date().toISOString()}
  await sb.from('checklist_items').update(upd).eq('id',id)
  const item=D.items.find(i=>i.id===id)
  const label=val==='검증완료'?`검증완료 (${curUser.name})`:`${field} 변경`
  await logH(label,item?.text||'',id);await loadAll()
}
window.toggleSub=async(sid,itemId,checked)=>{
  await sb.from('checklist_subs').update({done:checked,done_by:checked?curUser.name:null,verified:false}).eq('id',sid)
  const s=D.subs.find(s=>s.id===sid);const item=D.items.find(i=>i.id===itemId)
  await logH(`세부 ${checked?'완료':'취소'}`,`${item?.text||''} > ${s?.text||''}`);await loadAll()
}
window.verifySub=async(sid,itemId)=>{
  await sb.from('checklist_subs').update({verified:true,verified_by:curUser.name,verified_at:new Date().toISOString()}).eq('id',sid)
  toast('✓ 검증 완료');await loadAll()
}
window.addSub=async(itemId)=>{
  const inp=document.getElementById('ns-'+itemId);if(!inp?.value.trim())return
  await sb.from('checklist_subs').insert({item_id:itemId,text:inp.value.trim(),verifier:curUser.name})
  inp.value='';toast('추가됨');await loadAll()
}
window.deleteItem=async(id)=>{
  const item=D.items.find(i=>i.id===id);if(!item||!confirm(`"${item.text}" 삭제?`))return
  await sb.from('checklist_items').delete().eq('id',id);await logH('항목 삭제',item.text);await loadAll()
}
window.updAI=async(id,field,value)=>{
  const a=D.actionItems.find(a=>a.id===id);if(!a)return
  await sb.from('action_items').update({[field]:value,updated_at:new Date().toISOString()}).eq('id',id)
  await logH(`${field} →${value}`,a.text);await loadAll()
}
window.delAI=async(id)=>{
  const a=D.actionItems.find(a=>a.id===id);if(!a||!confirm(`"${a.text}" 삭제?`))return
  await sb.from('action_items').delete().eq('id',id);await logH('액션 삭제',a.text);await loadAll()
}
window.saveKPI=async(col,metric,value)=>{await sb.from('kpi_data').upsert({col,metric,value,updated_by:curUser.name},{onConflict:'col,metric'});toast('저장됨')}
window.delKPI=async(m)=>{if(!confirm(`"${m}" 삭제?`))return;await sb.from('kpi_data').delete().eq('metric',m);toast('삭제됨');await loadAll()}

window.addOwnerToForm=(prefix,name)=>{
  if(!name)return
  const inp=document.getElementById(prefix+'-owners');if(!inp)return
  const cur=inp.value?inp.value.split(',').filter(Boolean):[]
  if(cur.includes(name))return
  cur.push(name);inp.value=cur.join(',')
  const chips=document.getElementById(prefix+'-owner-chips');if(!chips)return
  // 플레이스홀더 제거
  const ph=chips.querySelector('span');if(ph)ph.remove()

function getThresh(){

    const dbRow=(D.appSettings||[]).find(r=>r.key==='kpi_thresh')
    if(dbRow?.value)return JSON.parse(dbRow.value)
    return getThresh()

function getKPIDef(){
  const defaults=[
    {id:'revenue',    label:'일평균 매출',    unit:'원', cat:'매출',  icon:'ti-chart-bar',       color:'#E8680A'},
    {id:'order_count',label:'일평균 주문수',  unit:'건', cat:'매출',  icon:'ti-shopping-cart',   color:'#B84E06'},
    {id:'aov',        label:'평균 주문액',    unit:'원', cat:'매출',  icon:'ti-receipt',         color:'#8B3A08'},
    {id:'cvr',        label:'전환율',         unit:'%',  cat:'전환',  icon:'ti-percentage',      color:'#185FA5'},
    {id:'cart_abandon',label:'장바구니 이탈률',unit:'%', cat:'전환',  icon:'ti-shopping-cart-off',color:'#A32D2D'},
    {id:'checkout_drop',label:'체크아웃 이탈률',unit:'%',cat:'전환', icon:'ti-logout',          color:'#C0392B'},
    {id:'pay_fail',   label:'결제 실패율',    unit:'%',  cat:'결제',  icon:'ti-credit-card-off', color:'#A32D2D'},
    {id:'err_404',    label:'404 오류 수',    unit:'건', cat:'운영',  icon:'ti-alert-triangle',  color:'#8B3A08'},
    {id:'supla_miss', label:'SUPLA 누락률',   unit:'%',  cat:'운영',  icon:'ti-alert-circle',    color:'#534AB7'},
    {id:'login_ok',   label:'로그인 성공률',  unit:'%',  cat:'운영',  icon:'ti-login',           color:'#3B6D11'},
    {id:'cs_count',   label:'CS 문의량',      unit:'건', cat:'운영',  icon:'ti-headset',         color:'#185FA5'},
    {id:'seo_index',  label:'검색 색인 수',   unit:'개', cat:'SEO',   icon:'ti-search',          color:'#185FA5'},
    {id:'organic',    label:'유기 검색 유입', unit:'명', cat:'SEO',   icon:'ti-brand-google',    color:'#3B6D11'},
  ]
  // DB 우선, 없으면 localStorage, 없으면 defaults
  try{
    const dbRow=(D.appSettings||[]).find(r=>r.key==='kpi_def')
    if(dbRow?.value) return JSON.parse(dbRow.value)
    const local=localStorage.getItem('ople-kpi-def')
    if(local){const parsed=JSON.parse(local);return parsed.length?parsed:defaults}
  }catch{}
  return defaults
}
async function saveKPIDef(defs){
  localStorage.setItem('ople-kpi-def',JSON.stringify(defs))
  const{error}=await sb.from('app_settings').upsert({key:'kpi_def',value:JSON.stringify(defs),updated_at:new Date().toISOString()},{onConflict:'key'})
  if(error){console.warn('app_settings 저장 실패(테이블 없음?):', error.message)}
  // D 캐시 즉시 업데이트
  const idx=(D.appSettings||[]).findIndex(r=>r.key==='kpi_def')
  if(idx>=0)D.appSettings[idx].value=JSON.stringify(defs)
  else D.appSettings=[...(D.appSettings||[]),{key:'kpi_def',value:JSON.stringify(defs)}]
}

function renderKPITab(){
  const DAYS=['월','화','수','목','금','토','일']
  const METRICS=[
    {id:'revenue',label:'매출',unit:'원',color:'#E8680A',icon:'ti-chart-bar'},
    {id:'orders', label:'주문건수',unit:'건',color:'#185FA5',icon:'ti-shopping-cart'},
    {id:'aov',    label:'AOV (평균주문액)',unit:'원',color:'#3B6D11',icon:'ti-receipt'},
  ]

  function getBaseline(){
    try{const row=(D.appSettings||[]).find(r=>r.key==='kpi_dow_baseline');return row?JSON.parse(row.value):{}}catch{return{}}
  }
  function getKpiNote(){
    try{const row=(D.appSettings||[]).find(r=>r.key==='kpi_note');return row?row.value:''}catch{return''}
  }
  function getKpiThreshPct(){
    try{const row=(D.appSettings||[]).find(r=>r.key==='kpi_alert_pct');return row?parseFloat(row.value):5}catch{return 5}
  }

  // 주 날짜 계산 - _kpiWeekOffset 기준 (0=이번주, -1=지난주 ...)
  function getWeekDates(offset){
    const today=new Date()
    const dow=today.getDay()===0?6:today.getDay()-1
    const monday=new Date(today)
    monday.setDate(today.getDate()-dow+(offset||0)*7)
    return DAYS.map((_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d.toISOString().slice(0,10)})
  }

  const offset=window._kpiWeekOffset||0
  const weekDates=getWeekDates(offset)
  const baseline=getBaseline()
  const daily=D.kpiDaily||[]
  const activeMetric=window._kpiMetric||'revenue'
  const metric=METRICS.find(m=>m.id===activeMetric)||METRICS[0]
  const alertPct=getKpiThreshPct()
  const kpiNote=getKpiNote()

  // 주 평균 자동 계산 (기준값 평균)
  function weekAvg(metricId){
    const base=baseline[metricId]||{}
    const vals=Object.values(base).map(Number).filter(v=>!isNaN(v))
    return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null
  }

  function buildChart(metricId,color){
    const base=baseline[metricId]||{}
    const W=560,H=160,PL=55,PR=20,PT=16,PB=40
    const cw=W-PL-PR,ch=H-PT-PB
    const vals=DAYS.map((_,i)=>{
      const row=daily.find(d=>d.metric===metricId&&d.record_date===weekDates[i])
      return row?Number(row.value):null
    })
    const bases=DAYS.map((_,i)=>base[i]!=null?Number(base[i]):null)
    const allVals=[...vals.filter(v=>v!==null),...bases.filter(v=>v!==null)]
    if(!allVals.length)return`<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">기준값을 먼저 설정하세요</div>`
    const maxV=Math.max(...allVals)*1.2||1
    const barW=cw/7*0.5,barGap=cw/7
    const bars=DAYS.map((d,i)=>{
      const v=vals[i],b=bases[i]
      const x=PL+i*barGap+barGap/2
      const dayLabel=`<text x="${x}" y="${H-PB+13}" text-anchor="middle" font-size="8" fill="var(--muted)">${d}</text><text x="${x}" y="${H-PB+22}" text-anchor="middle" font-size="8" fill="var(--muted)">${weekDates[i].slice(5)}</text>`
      if(v===null){
        const baseY=b!=null?PT+ch-(b/maxV)*ch:null
        return dayLabel+(baseY!=null?`<line x1="${x-barW/2-2}" y1="${baseY}" x2="${x+barW/2+2}" y2="${baseY}" stroke="${color}" stroke-width="2" stroke-dasharray="4,2"/>`:'')
      }
      const bh=Math.max((v/maxV)*ch,2),by=PT+ch-bh
      const pctDiff=b!=null?((v-b)/b*100):null
      const isCrit=pctDiff!=null&&pctDiff<-alertPct
      const isWarn=pctDiff!=null&&pctDiff<0&&!isCrit
      const fill=b==null?color:pctDiff>=0?'#3B6D11':isCrit?'#A32D2D':'var(--o)'
      const baseY=b!=null?PT+ch-(b/maxV)*ch:null
      const dispVal=v>=100000000?(v/100000000).toFixed(1)+'억':v>=10000?Math.round(v/10000)+'만':v
      return`<rect x="${x-barW/2}" y="${by}" width="${barW}" height="${bh}" fill="${fill}" rx="3" opacity="0.85"/>
        ${baseY!=null?`<line x1="${x-barW/2-4}" y1="${baseY}" x2="${x+barW/2+4}" y2="${baseY}" stroke="${color}" stroke-width="2" stroke-dasharray="4,2"/>`:''}
        ${isCrit?`<text x="${x}" y="${by-14}" text-anchor="middle" font-size="9" fill="#A32D2D" font-weight="600">⚠ 주의</text>`:''}
        <text x="${x}" y="${by-4}" text-anchor="middle" font-size="9" fill="${fill}">${dispVal}</text>
        ${dayLabel}`
    }).join('')
    const yTicks=[0,0.25,0.5,0.75,1].map(t=>{
      const val=Math.round(maxV*t),y=PT+ch*(1-t)
      const label=val>=100000000?(val/100000000).toFixed(1)+'억':val>=10000?Math.round(val/10000)+'만':val
      return`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="var(--bd)" stroke-width="0.5"/><text x="${PL-6}" y="${y+4}" text-anchor="end" font-size="9" fill="var(--muted)">${label}</text>`
    }).join('')
    return`<svg viewBox="0 0 ${W} ${H+10}" style="width:100%;height:auto;overflow:visible">${yTicks}${bars}</svg>`
  }

  // 주 이동 레이블
  const weekLabel=offset===0?'이번 주':offset===-1?'지난 주':`${Math.abs(offset)}주 전`

  return`
  <!-- 헤더 -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px">
    <div>
      <div style="font-size:16px;font-weight:500">KPI 대시보드</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--muted)">요일별 기준값 대비 실적 추적</span>
        <span style="font-size:12px;color:#A32D2D;font-weight:500;cursor:pointer;border-bottom:1px dashed #A32D2D" onclick="openKpiAlertEdit()" title="클릭해서 수정">-${alertPct}% 초과 시 즉시 대응 ⚠</span>
      </div>
    </div>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      <button class="btn" onclick="openDowBaselineEdit()"><i class="ti ti-adjustments"></i> 기준값 설정</button>
      <button class="btn btn-o" onclick="openKPIInput()"><i class="ti ti-pencil"></i> 수치 입력</button>
    </div>
  </div>

  <!-- 메모 입력칸 -->
  <div style="margin-bottom:14px">
    <div style="display:flex;gap:6px;align-items:flex-start">
      <textarea id="kpi-note-ta" class="inp" rows="2" style="margin:0;font-size:12px;resize:vertical;flex:1" placeholder="이번 주 컨텍스트, 특이사항, 분석 메모...">${kpiNote}</textarea>
      <button class="btn btn-o" style="padding:6px 14px;white-space:nowrap;flex-shrink:0" onclick="saveKpiNote(document.getElementById('kpi-note-ta').value)"><i class="ti ti-device-floppy"></i> 저장</button>
    </div>
  </div>

  <!-- 주 필터 + 지표 탭 -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
    <div style="display:flex;gap:8px">
      ${METRICS.map(m=>`<button onclick="window._kpiMetric='${m.id}';showTab('kpi')" style="padding:7px 16px;border-radius:20px;border:1.5px solid ${m.id===activeMetric?m.color:'var(--bd)'};background:${m.id===activeMetric?m.color:'var(--card)'};color:${m.id===activeMetric?'#fff':'var(--text)'};font-size:13px;cursor:pointer;font-weight:${m.id===activeMetric?'600':'400'};transition:all .15s"><i class="ti ${m.icon}"></i> ${m.label}</button>`).join('')}
    </div>
    <!-- 주 이동 -->
    <div style="display:flex;align-items:center;gap:6px">
      <button class="btn btn-g" style="padding:5px 10px" onclick="window._kpiWeekOffset=(window._kpiWeekOffset||0)-1;showTab('kpi')"><i class="ti ti-chevron-left"></i></button>
      <span style="font-size:13px;font-weight:500;min-width:60px;text-align:center">${weekLabel}</span>
      <button class="btn btn-g" style="padding:5px 10px" onclick="window._kpiWeekOffset=Math.min((window._kpiWeekOffset||0)+1,0);showTab('kpi')" ${offset===0?'disabled style="opacity:.4"':''}><i class="ti ti-chevron-right"></i></button>
      ${offset!==0?`<button class="btn btn-o" style="padding:5px 10px;font-size:11px" onclick="window._kpiWeekOffset=0;showTab('kpi')">이번 주</button>`:''}
    </div>
  </div>

  <!-- 주간 평균 요약 -->
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
    ${METRICS.map(m=>{
      const avg=weekAvg(m.id)
      const weekActual=DAYS.map((_,i)=>{const row=daily.find(d=>d.metric===m.id&&d.record_date===weekDates[i]);return row?Number(row.value):null}).filter(v=>v!==null)
      const weekActualAvg=weekActual.length?Math.round(weekActual.reduce((a,b)=>a+b,0)/weekActual.length):null
      const diff=weekActualAvg!=null&&avg!=null?((weekActualAvg-avg)/avg*100).toFixed(1):null
      const isCrit=diff!=null&&Number(diff)<-alertPct
      const isGood=diff==null||Number(diff)>=0
      return`<div class="card" style="padding:14px;border-left:3px solid ${isCrit?'#A32D2D':m.color}" onclick="window._kpiMetric='${m.id}';showTab('kpi')" style="cursor:pointer">
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px"><i class="ti ${m.icon}" style="color:${m.color}"></i> ${m.label}</div>
        <div style="font-size:20px;font-weight:700;color:${weekActualAvg!=null?m.color:'var(--muted)'}">${weekActualAvg!=null?Number(weekActualAvg).toLocaleString():'—'}<span style="font-size:10px;font-weight:400;margin-left:2px">${weekActualAvg!=null?m.unit+' 일평균':''}</span></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px">
          <span style="font-size:11px;color:var(--muted)">기준 평균 ${avg!=null?Number(avg).toLocaleString()+m.unit:'미설정'}</span>
          ${diff!=null?`<span style="font-size:11px;font-weight:600;color:${isGood?'#3B6D11':isCrit?'#A32D2D':'var(--o)'}">${isCrit?'⚠ ':isGood?'▲ ':'▼ '}${diff}%</span>`:''}
        </div>
      </div>`
    }).join('')}
  </div>

  <!-- 메인 그래프 -->
  <div class="card" style="padding:20px;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div>
        <div style="font-size:14px;font-weight:600;color:${metric.color}"><i class="ti ${metric.icon}"></i> ${metric.label} — ${weekLabel}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${weekDates[0]} ~ ${weekDates[6]}</div>
      </div>
      <div style="display:flex;gap:12px;font-size:11px;flex-wrap:wrap">
        <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:#3B6D11;border-radius:2px;display:inline-block"></span>기준 이상</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:var(--o);border-radius:2px;display:inline-block"></span>미달 (${alertPct}% 이내)</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:#A32D2D;border-radius:2px;display:inline-block"></span>⚠ 즉시대응 (-${alertPct}% 초과)</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="width:16px;border-top:2px dashed ${metric.color};display:inline-block"></span>기준선</span>
      </div>
    </div>
    ${buildChart(metric.id,metric.color)}
  </div>

  <!-- 상세 테이블 -->
  <div class="card">
    <div class="sh"><span class="st"><i class="ti ti-table oi"></i> ${weekLabel} 실적 vs 기준값</span></div>
    <div style="overflow-x:auto">
    <table class="kpi-tbl"><thead><tr>
      <th style="min-width:120px">지표</th>
      ${DAYS.map((d,i)=>`<th style="text-align:center;min-width:90px">${d}<div style="font-size:9px;font-weight:400;color:var(--muted)">${weekDates[i].slice(5)}</div></th>`).join('')}
      <th style="text-align:center;min-width:80px">주 평균</th>
    </tr></thead><tbody>
    ${METRICS.map(m=>{
      const base=baseline[m.id]||{}
      const avg=weekAvg(m.id)
      const weekVals=DAYS.map((_,i)=>{const row=daily.find(d=>d.metric===m.id&&d.record_date===weekDates[i]);return row?Number(row.value):null})
      const weekActualAvg=weekVals.filter(v=>v!==null).length?Math.round(weekVals.filter(v=>v!==null).reduce((a,b)=>a+b,0)/weekVals.filter(v=>v!==null).length):null
      const avgDiff=weekActualAvg!=null&&avg!=null?((weekActualAvg-avg)/avg*100).toFixed(1):null
      const avgCrit=avgDiff!=null&&Number(avgDiff)<-alertPct
      return`
      <tr style="background:var(--sf)">
        <td colspan="9" style="font-size:11px;font-weight:600;color:${m.color};padding:6px 12px"><i class="ti ${m.icon}"></i> ${m.label}</td>
      </tr>
      <tr>
        <td style="font-size:11px;color:var(--muted)">기준</td>
        ${DAYS.map((_,i)=>`<td style="text-align:center;font-size:12px;color:var(--muted)">${base[i]!=null?Number(base[i]).toLocaleString()+m.unit:'—'}</td>`).join('')}
        <td style="text-align:center;font-size:12px;color:var(--muted);font-weight:500">${avg!=null?Number(avg).toLocaleString()+m.unit:'—'}</td>
      </tr>
      <tr>
        <td style="font-size:11px;font-weight:500">실적</td>
        ${DAYS.map((_,i)=>{
          const v=weekVals[i],b=base[i]!=null?Number(base[i]):null
          const pct=v!=null&&b!=null?((v-b)/b*100):null
          const isCrit=pct!=null&&pct<-alertPct
          const isGood=pct==null||pct>=0
          return`<td style="text-align:center;font-size:12px;cursor:pointer;font-weight:500;background:${isCrit?'#FEF2F2':''}" onclick="openKPIInput('${weekDates[i]}')">
            ${v!=null?`<div style="color:${isGood?'#3B6D11':isCrit?'#A32D2D':'var(--o)'}">${Number(v).toLocaleString()}${m.unit}</div>${pct!=null?`<div style="font-size:9px;color:${isGood?'#3B6D11':isCrit?'#A32D2D':'var(--o)'}">${pct>0?'+':''}${pct.toFixed(1)}%${isCrit?' ⚠':''}</div>`:''}`:`<span style="color:var(--o);font-size:10px">입력</span>`}
          </td>`
        }).join('')}
        <td style="text-align:center;font-size:12px;font-weight:600;background:${avgCrit?'#FEF2F2':''}">
          ${weekActualAvg!=null?`<div style="color:${avgDiff!=null&&Number(avgDiff)>=0?'#3B6D11':avgCrit?'#A32D2D':'var(--o)'}">${Number(weekActualAvg).toLocaleString()}${m.unit}</div><div style="font-size:9px;color:${avgDiff!=null&&Number(avgDiff)>=0?'#3B6D11':avgCrit?'#A32D2D':'var(--o)'}">${avgDiff!=null?(Number(avgDiff)>0?'+':'')+avgDiff+'%'+(avgCrit?' ⚠':''):''}</div>`:'—'}
        </td>
      </tr>`
    }).join('')}
    </tbody></table>
    </div>
  </div>`
}

window.refreshKPICardVal=async(id,date)=>{
  const r=(D.kpiDaily||[]).find(d=>d.metric===id&&d.record_date===date)
  const inp=document.getElementById('kcc-val')

window.saveKPICard=async(id)=>{
  const date=document.getElementById('kcc-date')?.value
  const val=document.getElementById('kcc-val')?.value
  if(!date||val===''||val===null){toast('날짜와 값을 입력해주세요.',false);return}
  const {error}=await sb.from('kpi_daily').upsert({metric:id,record_date:date,value:parseFloat(val),updated_by:curUser.name,updated_at:new Date().toISOString()},{onConflict:'metric,record_date'})

  await logH('KPI 입력: '+id,date)
  document.getElementById('kpi-card-ov').remove()
  toast('저장됐어요 ✓')
  await loadAll()
}

window.deleteKPIRow=async(metric,date)=>{

  await sb.from('kpi_daily').delete().eq('metric',metric).eq('record_date',date)
  toast('삭제됨');await loadAll()

  document.getElementById('kpi-card-ov')?.remove()

      <span style="font-size:11px;color:var(--muted);white-space:nowrap">첫 번째 날짜 = 기준값</span>
    </div>
    <div style="background:var(--ol);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--od);margin-bottom:12px">
      <i class="ti ti-info-circle"></i> 전환 전 처음 입력한 날짜가 기준값(baseline)이 됩니다.
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px" id="kpi-input-grid">
    ${ids.map(id=>`<div>
      <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">${KPI_LABELS[id]} (${KPI_UNITS[id]})</label>
      <input class="inp" style="margin:0" id="ki-${id}" type="number" step="any" placeholder="—" value="${getCurVal(id)}">
    </div>`).join('')}
    </div>
  </div>
  <div class="mf">
    <button class="btn" onclick="document.getElementById('kpi-input-ov').remove()">취소</button>
    <button class="btn btn-o" onclick="saveKPIDaily()"><i class="ti ti-device-floppy"></i> 저장</button>
  </div>
  </div>`
  document.body.appendChild(w)
}

window.refreshKPIInputVals=()=>{
  const date=document.getElementById('kpi-date')?.value
  if(!date)return
  const ids=['revenue','orders','aov']
  ids.forEach(id=>{
    const r=(D.kpiDaily||[]).find(d=>d.metric===id&&d.record_date===date)
    const inp=document.getElementById('ki-'+id)
    if(inp)inp.value=r?.value??''
  })
}

window.saveKPIDaily=async()=>{
  const date=document.getElementById('kpi-date')?.value
  if(!date){toast('날짜를 선택해주세요.',false);return}
  const ids=['revenue','orders','aov']
  const rows=ids.map(id=>{
    const v=document.getElementById('ki-'+id)?.value
    if(v===''||v===null||v===undefined)return null
    return{metric:id,record_date:date,value:parseFloat(v),updated_by:curUser.name,updated_at:new Date().toISOString()}
  }).filter(Boolean)
  if(!rows.length){toast('입력값이 없어요.',false);return}
  const {error}=await sb.from('kpi_daily').upsert(rows,{onConflict:'metric,record_date'})
  if(error){toast('저장 실패: '+error.message,false);return}
  await logH('KPI 수치 입력',date)
  document.getElementById('kpi-input-ov').remove()
  toast('저장됐어요 ✓')
  await loadAll()
}

// ══════════════════════
// History Log
// ══════════════════════
function renderHistLog(){
  const selMember=window._histLogMember||''
  const selType=window._histLogType||''

  // 활동 데이터 수집
  const historyRows=(D.history||[]).map(h=>({
    type:'history',
    user:h.user_name,
    action:h.action,
    target:h.target||'',
    item_id:h.item_id,
    date:h.created_at,
    icon:'ti-activity',
    color:'var(--o)'
  }))
  const commentRows=(D.comments||[]).map(c=>{
    let txt=c.text||''
    try{const p=JSON.parse(c.text);txt=p.text||txt}catch{}
    return{
      type:'comment',
      user:c.user_name,
      action:'댓글 등록',
      target:txt.slice(0,60)+(txt.length>60?'...':''),
      item_id:c.item_id,
      date:c.created_at,
      icon:'ti-message',
      color:'#185FA5'
    }
  })

  let allRows=[...historyRows,...commentRows].sort((a,b)=>new Date(b.date)-new Date(a.date))

  // 필터
  if(selMember)allRows=allRows.filter(r=>r.user===selMember)
  if(selType==='history')allRows=allRows.filter(r=>r.type==='history')
  if(selType==='comment')allRows=allRows.filter(r=>r.type==='comment')

  // 페이지
  const PAGE=20
  const page=window._histLogPage||0
  const totalPages=Math.ceil(allRows.length/PAGE)
  const shown=allRows.slice(page*PAGE,(page+1)*PAGE)

  // 멤버별 통계
  const memberStats=MEMBERS.map(m=>{
    const mHist=(D.history||[]).filter(h=>h.user_name===m.name).length
    const mCmt=(D.comments||[]).filter(c=>c.user_name===m.name).length
    return{...m,total:mHist+mCmt,hist:mHist,cmt:mCmt}
  }).sort((a,b)=>b.total-a.total)

  return`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <div style="font-size:16px;font-weight:500"><i class="ti ti-history" style="color:var(--o)"></i> History Log</div>
    <div style="font-size:12px;color:var(--muted)">전체 ${allRows.length}건</div>
  </div>

  <!-- 멤버 카드 -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    <div onclick="window._histLogMember='';window._histLogPage=0;showTab('histlog')"
      style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:1.5px solid ${!selMember?'var(--o)':'var(--bd)'};background:${!selMember?'var(--ol)':'var(--card)'};cursor:pointer">
      <span style="font-size:12px;font-weight:${!selMember?'600':'400'}">전체</span>
      <span class="badge bgr">${historyRows.length+commentRows.length}</span>
    </div>
    ${memberStats.map(m=>`
    <div onclick="window._histLogMember='${m.name}';window._histLogPage=0;showTab('histlog')"
      style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:1.5px solid ${selMember===m.name?'var(--o)':'var(--bd)'};background:${selMember===m.name?'var(--ol)':'var(--card)'};cursor:pointer">
      ${avEl(m.name,24)}
      <div>
        <div style="font-size:12px;font-weight:${selMember===m.name?'600':'400'}">${m.name}</div>
        <div style="font-size:10px;color:var(--muted)">${m.hist}활동 · ${m.cmt}댓글</div>
      </div>
    </div>`).join('')}
  </div>

  <!-- 타입 필터 -->
  <div style="display:flex;gap:6px;margin-bottom:14px">
    ${[['','전체'],['history','활동'],['comment','댓글']].map(([v,l])=>`
    <button onclick="window._histLogType='${v}';window._histLogPage=0;showTab('histlog')"
      style="padding:5px 14px;border-radius:20px;border:1px solid ${selType===v?'var(--o)':'var(--bd)'};background:${selType===v?'var(--o)':'var(--card)'};color:${selType===v?'#fff':'var(--text)'};font-size:12px;cursor:pointer">${l}</button>
    `).join('')}
  </div>

  <!-- 로그 목록 -->
  <div class="card" style="padding:0;overflow:hidden">
    ${shown.length?shown.map((r,i)=>{
      const resolvedId=r.item_id||(r.target&&D.items.find(it=>it.text&&it.text.trim()===r.target.trim())?.id)||null
      const item=resolvedId?D.items.find(it=>it.id===resolvedId):null
      return`<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:0.5px solid var(--bd);cursor:${resolvedId?'pointer':'default'};transition:background .1s" ${resolvedId?`onclick="location.href='detail.html?type=item&id=${resolvedId}'"`:''} onmouseover="this.style.background='var(--sf)'" onmouseout="this.style.background=''">
        <div style="width:32px;height:32px;border-radius:50%;background:${r.color}1a;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px">
          <i class="ti ${r.icon}" style="color:${r.color};font-size:14px"></i>
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px">
            ${avEl(r.user,20)}
            <span style="font-size:12px;font-weight:500">${r.user}</span>
            <span class="badge ${r.type==='comment'?'bb':'bgr'}" style="font-size:9px">${r.type==='comment'?'댓글':'활동'}</span>
            <span style="font-size:11px;font-weight:500;color:var(--text)">${r.action}</span>
          </div>
          ${r.target?`<div style="font-size:12px;color:var(--muted);margin-left:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:500px">${r.target}</div>`:''}
          ${item?`<div style="font-size:11px;color:var(--o);margin-left:28px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><i class="ti ti-file-text" style="font-size:10px"></i> ${item.text}</div>`:''}
        </div>
        <div style="font-size:10px;color:var(--muted);white-space:nowrap;flex-shrink:0">
          ${new Date(r.date).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
          ${resolvedId?'<i class="ti ti-chevron-right" style="margin-left:4px"></i>':''}
        </div>
      </div>`
    }).join(''):`<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">활동 내역이 없어요</div>`}
  </div>

  <!-- 페이지네이션 -->
  ${totalPages>1?`<div style="display:flex;align-items:center;gap:4px;margin-top:12px;justify-content:center;flex-wrap:wrap">
    <button onclick="window._histLogPage=Math.max(0,(window._histLogPage||0)-1);showTab('histlog')" style="padding:4px 10px;border:0.5px solid var(--bd);border-radius:6px;background:var(--sf);font-size:12px;cursor:pointer" ${page===0?'disabled':''}><i class="ti ti-chevron-left"></i></button>
    ${[...Array(totalPages).keys()].map(p=>`<button onclick="window._histLogPage=${p};showTab('histlog')" style="padding:4px 10px;border:1px solid ${p===page?'var(--o)':'var(--bd)'};border-radius:6px;background:${p===page?'var(--o)':'var(--sf)'};color:${p===page?'#fff':'var(--text)'};font-size:12px;cursor:pointer;min-width:32px">${p+1}</button>`).join('')}
    <button onclick="window._histLogPage=Math.min(${totalPages-1},(window._histLogPage||0)+1);showTab('histlog')" style="padding:4px 10px;border:0.5px solid var(--bd);border-radius:6px;background:var(--sf);font-size:12px;cursor:pointer" ${page===totalPages-1?'disabled':''}><i class="ti ti-chevron-right"></i></button>
  </div>`:''}
  `
}

// ══════════════════════
// 파일 보관함
// ══════════════════════
function renderFiles(){
  // 댓글에서 파일 첨부된 것 추출
  const allComments=D.comments||[]
  const files=[]

  allComments.forEach(c=>{
    try{
      const parsed=JSON.parse(c.text)
      if(parsed.file){
        const item=D.items.find(i=>i.id===c.item_id)
        const cat=D.cats.find(cat=>cat.id===item?.category_id)
        files.push({
          ...parsed.file,
          comment_text:parsed.text||'',
          link:parsed.link||null,
          item_id:c.item_id,
          item_text:item?.text||'삭제된 항목',
          cat_label:cat?.label||'',
          cat_color:cat?.color||'#888',
          user:c.user_name,
          created_at:c.created_at
        })
      }
    }catch{}
  })

  // 회의록 원문도 포함 (텍스트지만 참고용)
  const fileTypes={
    image:files.filter(f=>f.type?.startsWith('image/')),
    doc:files.filter(f=>!f.type?.startsWith('image/'))
  }

  return`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div>
      <div style="font-size:16px;font-weight:500">파일 보관함</div>
      <div style="font-size:12px;color:var(--muted);margin-top:3px">체크리스트 댓글에 첨부된 파일 모음 — 총 ${files.length}개</div>
    </div>
  </div>

  ${files.length===0?`<div style="text-align:center;padding:60px;color:var(--muted)">
    <div style="font-size:48px;margin-bottom:12px">📎</div>
    <div style="font-size:15px;font-weight:500;margin-bottom:8px">첨부파일이 없어요</div>
    <div style="font-size:13px">체크리스트 상세 페이지에서 댓글 작성 시 파일을 첨부해주세요</div>
  </div>`:`

  <!-- 이미지 파일 -->
  ${fileTypes.image.length?`<div class="card" style="margin-bottom:16px">
    <div class="sh"><span class="st"><i class="ti ti-photo oi"></i> 이미지 (${fileTypes.image.length}개)</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">
    ${fileTypes.image.map(f=>`<div style="border:0.5px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer" onclick="location.href='detail.html?type=item&id=${f.item_id}'">
      <img src="${f.data}" style="width:100%;height:120px;object-fit:cover;display:block">
      <div style="padding:8px">
        <div style="font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px">${f.name}</div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px">${f.user} · ${new Date(f.created_at).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'})}</div>
        <div style="display:flex;gap:4px;align-items:center">
          <span style="font-size:9px;padding:1px 6px;border-radius:4px;background:${f.cat_color}22;color:${f.cat_color}">${f.cat_label}</span>
          <button onclick="event.stopPropagation();downloadFileGlobal('${f.name}','${f.data}')" style="font-size:10px;padding:2px 7px;border:0.5px solid var(--bd);border-radius:5px;background:var(--sf);cursor:pointer;margin-left:auto"><i class="ti ti-download"></i></button>
        </div>
      </div>
    </div>`).join('')}
    </div>
  </div>`:''}

  <!-- 문서 파일 -->
  ${fileTypes.doc.length?`<div class="card">
    <div class="sh"><span class="st"><i class="ti ti-files oi"></i> 문서 & 기타 (${fileTypes.doc.length}개)</span></div>
    ${fileTypes.doc.map(f=>`<div style="display:flex;align-items:center;gap:12px;padding:10px;border:0.5px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer" onclick="location.href='detail.html?type=item&id=${f.item_id}'">
      <div style="width:40px;height:40px;border-radius:8px;background:var(--ol);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="ti ti-file" style="color:var(--o);font-size:20px"></i>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${f.user} · ${new Date(f.created_at).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'})} · ${(f.size/1024).toFixed(1)}KB</div>
        <div style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">📌 ${f.item_text}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <span style="font-size:10px;padding:2px 7px;border-radius:5px;background:${f.cat_color}22;color:${f.cat_color}">${f.cat_label}</span>
        <button onclick="event.stopPropagation();downloadFileGlobal('${f.name}','${f.data}')" style="font-size:11px;padding:4px 10px;border:0.5px solid var(--bd);border-radius:7px;background:var(--sf);cursor:pointer"><i class="ti ti-download"></i> 다운로드</button>
      </div>
    </div>`).join('')}
  </div>`:''}
  `}
`
}

window.downloadFileGlobal=(name,dataUrl)=>{
  const a=document.createElement('a');a.href=dataUrl;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a)
}

      ${(m.actions||[]).map(a=>`<div style="padding:6px 10px;margin-bottom:3px;background:var(--ol);border-radius:8px;font-size:13px;color:var(--od)">${a}</div>`).join('')}
      ${m.full_text?`<div style="margin-top:14px;border-top:0.5px solid var(--bd);padding-top:12px"><div style="font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px"><i class="ti ti-file-text"></i> 전체 원문</div><div style="background:var(--sf);border-radius:9px;padding:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;max-height:250px;overflow-y:auto">${m.full_text}</div></div>`:''}

window.saveMtgEdit=async(id)=>{
  const sp=elId=>document.getElementById(elId)?.value.split('\n').map(s=>s.trim()).filter(Boolean)
