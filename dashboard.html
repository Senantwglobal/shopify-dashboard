<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPLE Shopify 전환 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--o:#E8680A;--ol:#FEF0E6;--od:#B84E06;--ob:#F5C49A;--bg:#f8f7f5;--card:#fff;--bd:#e5e3dc;--text:#1a1a1a;--muted:#888;--surface:#f3f2ef}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
.hdr{background:var(--card);border-bottom:0.5px solid var(--bd);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.logo{background:var(--o);color:#fff;font-size:13px;font-weight:600;padding:4px 10px;border-radius:6px}
.dday-badge{background:var(--ol);color:var(--od);font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;border:0.5px solid var(--ob);cursor:pointer}
.dday-badge:hover{background:#fde8d4}
.uinfo{display:flex;align-items:center;gap:8px;font-size:13px}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;position:relative}
.notif-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#E24B4A;border:1.5px solid #fff;display:none}
.notif-dot.show{display:block}
.logout-btn{font-size:12px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--bd);background:none;color:var(--muted);cursor:pointer}
.nav{display:flex;padding:0 16px;background:var(--card);border-bottom:0.5px solid var(--bd);overflow-x:auto}
.nb{padding:9px 12px;font-size:12px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:4px}
.nb.active{color:var(--o);border-bottom-color:var(--o);font-weight:500}
.nb:hover:not(.active){color:var(--text)}
.nbadge{background:#E24B4A;color:#fff;border-radius:8px;padding:0 5px;font-size:10px;margin-left:2px}
.cnt{padding:16px 20px;max-width:1100px;margin:0 auto}
.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:10px;border:0.5px solid var(--bd);padding:12px;text-align:center;cursor:default}
.kn{font-size:22px;font-weight:500;margin-bottom:2px}
.kl{font-size:10px;color:var(--muted)}
.sec{background:var(--card);border:0.5px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.sec-o{border-color:var(--ob)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.st{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.oi{color:var(--o)}
.btn{font-size:12px;padding:5px 10px;border-radius:8px;border:0.5px solid var(--bd);background:none;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:var(--surface)}
.btn-o{background:var(--o);color:#fff;border-color:var(--o)}
.btn-o:hover{background:var(--od);color:#fff}
.btn-g{border-color:transparent;color:var(--muted)}
.btn-g:hover{background:var(--surface);color:var(--text)}
.btn-red{color:#A32D2D;border-color:#F09595}
.btn-red:hover{background:#FCEBEB}
.badge{font-size:10px;padding:2px 6px;border-radius:9px;font-weight:500;white-space:nowrap}
.bo{background:var(--ol);color:var(--od)}
.bb{background:#E6F1FB;color:#185FA5}
.br{background:#FCEBEB;color:#A32D2D}
.bg{background:#EAF3DE;color:#3B6D11}
.bgr{background:#F1EFE8;color:#5F5E5A}
.bp{background:#EEEDFE;color:#534AB7}
.bpur{background:#FBEAF0;color:#993556}
.inp{width:100%;padding:8px 10px;border:0.5px solid var(--bd);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text);margin-bottom:8px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--o)}
textarea.inp{resize:vertical;min-height:64px}
select.inp{cursor:pointer}
.pgb{height:4px;border-radius:2px;background:var(--surface);overflow:hidden;margin-top:4px}
.pgf{height:100%;border-radius:2px;transition:width .4s}
.dl-chip{font-size:10px;font-weight:500;padding:2px 6px;border-radius:9px;white-space:nowrap}
.dl-ok{background:#EAF3DE;color:#3B6D11}
.dl-w{background:var(--ol);color:var(--od)}
.dl-c{background:#FCEBEB;color:#A32D2D}
.dl-d{background:#F1EFE8;color:#5F5E5A}
.ck-row{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:8px;margin-bottom:2px}
.ck-row:hover{background:var(--surface)}
.ck-row input[type=checkbox]{accent-color:var(--o);margin-top:3px;flex-shrink:0;width:15px;height:15px}
.sub-wrap{padding:3px 0 3px 26px;display:none}
.sub-wrap.open{display:block}
.sub-row{display:flex;align-items:flex-start;gap:7px;padding:5px 8px;border-radius:8px;margin-bottom:1px;cursor:pointer}
.sub-row:hover{background:var(--surface)}
.sub-row input[type=checkbox]{accent-color:var(--o);margin-top:2px;flex-shrink:0;width:13px;height:13px}
.vbadge{font-size:9px;padding:1px 5px;border-radius:6px;background:#EEEDFE;color:#534AB7;white-space:nowrap}
.vbadge.ok{background:#EAF3DE;color:#3B6D11}
.comment{background:var(--surface);border-radius:8px;padding:9px;margin-bottom:6px;border-left:3px solid var(--o)}
.cauth{font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px;margin-bottom:3px}
.ctime{font-size:10px;color:var(--muted);font-weight:400}
.ctext{font-size:13px;color:#444;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.gng-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:7px;margin-bottom:10px}
.gng-c{border-radius:9px;padding:9px 11px;border:0.5px solid var(--bd);display:flex;align-items:flex-start;gap:8px;background:var(--card)}
.gng-l{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.lg-r{background:#E24B4A}.lg-o{background:var(--o)}.lg-g{background:#639922}
.mtg-card{padding:11px;border:0.5px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.mtg-card:hover{border-color:var(--ob)}
.ai-row{display:flex;align-items:flex-start;gap:8px;padding:9px;border-radius:9px;border:0.5px solid var(--bd);margin-bottom:6px;background:var(--card)}
.ai-row:hover{border-color:var(--ob)}
.editable{cursor:pointer;border-radius:4px;padding:1px 3px}
.editable:hover{background:var(--ol);outline:1px dashed var(--ob)}
.edit-inp{font-size:inherit;padding:2px 6px;border:1.5px solid var(--o);border-radius:4px;background:#fff;color:var(--text);outline:none}
.kpi-tbl{width:100%;border-collapse:collapse;font-size:12px}
.kpi-tbl th{background:var(--surface);padding:8px;text-align:left;font-weight:500;font-size:11px;color:var(--muted);border-bottom:0.5px solid var(--bd);white-space:nowrap}
.kpi-tbl td{padding:7px 8px;border-bottom:0.5px solid var(--bd);vertical-align:middle}
.kpi-tbl tr:last-child td{border-bottom:none}
.kpi-cell{width:100%;min-width:70px;padding:4px 6px;border:0.5px solid var(--bd);border-radius:5px;font-size:12px;background:var(--surface);color:var(--text);outline:none}
.kpi-cell:focus{border-color:var(--o)}
.hist-r{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--bd);font-size:12px}
.toast{position:fixed;bottom:20px;right:20px;background:#2d6a27;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.rdot{width:7px;height:7px;border-radius:50%;background:#639922;display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding-top:28px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;border:0.5px solid var(--bd);border-top:3px solid var(--o);width:580px;max-width:95%;max-height:90vh;overflow-y:auto}
.modal-h{padding:13px 16px;border-bottom:0.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal-b{padding:16px}
.modal-f{padding:12px 16px;border-top:0.5px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
/* 캘린더 */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-title{font-size:15px;font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dh{text-align:center;font-size:11px;color:var(--muted);padding:4px;font-weight:500}
.cal-cell{min-height:64px;border-radius:8px;padding:4px 5px;border:0.5px solid transparent;background:var(--surface);position:relative;cursor:pointer;transition:border-color .1s}
.cal-cell:hover{border-color:var(--o)}
.cal-cell.today{border-color:var(--o);border-width:1.5px}
.cal-cell.empty{background:transparent;border:none;cursor:default}
.cal-cell.wknd{opacity:.6}
.cal-num{font-size:11px;font-weight:500;margin-bottom:2px}
.cal-cell.today .cal-num{color:var(--o)}
.cal-ev{font-size:9px;padding:2px 4px;border-radius:3px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.cal-ev:hover{opacity:.8}
.cal-add{position:absolute;bottom:3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--o);color:#fff;font-size:12px;line-height:16px;text-align:center;display:none;border:none;cursor:pointer}
.cal-cell:hover .cal-add{display:block}
/* 담당자 칩 */
.owner-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.ochip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;color:#fff}
.ochip-del{cursor:pointer;opacity:.7;font-size:10px}
.ochip-del:hover{opacity:1}
/* 상태 뱃지 */
.status-sel{font-size:11px;padding:2px 6px;border:0.5px solid var(--bd);border-radius:6px;background:var(--surface);cursor:pointer;color:var(--text);outline:none}
.status-sel:focus{border-color:var(--o)}
/* UX 항목 */
.ux-item{padding:10px;border:0.5px solid var(--bd);border-radius:9px;margin-bottom:8px;background:var(--card);cursor:pointer}
.ux-item:hover{border-color:var(--ob)}
/* KPI 분석 카드 */
.analysis-card{background:var(--surface);border-radius:9px;padding:12px;margin-bottom:8px}
@media(max-width:600px){.two{grid-template-columns:1fr}.three{grid-template-columns:1fr}.cnt{padding:12px}}
</style>
</head>
<body>
<div class="hdr">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span class="logo">OPLE</span>
    <span style="font-size:14px;font-weight:500">Shopify 전환 프로젝트</span>
    <span class="dday-badge" id="dday-c" onclick="openDdayEdit()" title="클릭해서 D-day 수정">D-? · 7/14</span>
    <span style="font-size:11px;color:var(--muted)"><span class="rdot"></span>실시간</span>
  </div>
  <div class="uinfo">
    <div class="av" id="user-av" style="background:var(--o)">
      <span>?</span>
      <div class="notif-dot" id="notif-dot"></div>
    </div>
    <span id="user-name" style="font-size:13px;color:var(--muted)">로딩중</span>
    <button class="logout-btn" onclick="logout()">로그아웃</button>
  </div>
</div>
<div class="nav">
  <button class="nb active" onclick="showTab('dash')" id="tab-dash"><i class="ti ti-layout-dashboard"></i>대시보드</button>
  <button class="nb" onclick="showTab('cal')" id="tab-cal"><i class="ti ti-calendar"></i>캘린더</button>
  <button class="nb" onclick="showTab('ck')" id="tab-ck"><i class="ti ti-checklist"></i>체크리스트</button>
  <button class="nb" onclick="showTab('kpi')" id="tab-kpi"><i class="ti ti-chart-line"></i>KPI</button>
  <button class="nb" onclick="showTab('ux')" id="tab-ux"><i class="ti ti-device-mobile"></i>UX 베타</button>
  <button class="nb" onclick="showTab('ai')" id="tab-ai"><i class="ti ti-list-check"></i>액션아이템<span class="nbadge" id="ai-badge" style="display:none"></span></button>
  <button class="nb" onclick="showTab('mtg')" id="tab-mtg"><i class="ti ti-notes"></i>회의록</button>
  <button class="nb" onclick="showTab('hist')" id="tab-hist"><i class="ti ti-history"></i>변경이력</button>
</div>
<div class="cnt" id="mc"><div style="text-align:center;padding:60px;color:var(--muted)">로딩중...</div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const sb = createClient('https://btutlgcidpjgedpypzri.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0dXRsZ2NpZHBqZ2VkcHlwenJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NTE0MjQsImV4cCI6MjA5ODAyNzQyNH0.qZp04DhOmm4oSho3Qsfz8UWEeY-eNhGcIydyVNejqBc')

// ─── 상태 ───
let curUser=null, curEmail=null, activeTab='dash'
let expandCats={}, expandCks={}
let calYear=2026, calMonth=6
let D={cats:[],items:[],subs:[],comments:[],kpiRows:[],kpiAnalysis:{sales_analysis:'',recovery_plan:'',loss_estimate:''},uxItems:[],uxSettings:{success_criteria:'',result_link:'',notes:''},actionItems:[],meetings:[],history:[]}
let MEMBERS=[]
const MEMBER_COLORS=['#E8680A','#534AB7','#0F6E56','#A32D2D','#185FA5','#854F0B','#993556','#5F5E5A']

// 설정값 (localStorage)
function getDday(){return localStorage.getItem('ople-dday')||'2026-07-14'}
function setDday(d){localStorage.setItem('ople-dday',d)}
function getMembers(){try{const s=localStorage.getItem('ople-members');return s?JSON.parse(s):[{name:'한덕희',email:'handeokhee@ople.co'},{name:'박영환',email:'younghwan@ople.co'},{name:'천세나',email:'sena@ople.co'},{name:'권현정',email:'hyunjeong@ople.co'},{name:'김현수',email:'hyunsu@ople.co'}]}catch{return[]}}
function saveMembers(m){localStorage.setItem('ople-members',JSON.stringify(m))}

// 유틸
const TODAY=new Date()
function ddu(ds){if(!ds)return 999;return Math.ceil((new Date(ds)-TODAY)/864e5)}
function calcDD(){return Math.max(0,Math.ceil((new Date(getDday())-TODAY)/864e5))}
function ts(){return new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function fmtDate(d){if(!d)return '—';return new Date(d).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'})}
function dlc(dl,done){
  if(done)return`<span class="dl-chip dl-d">완료</span>`
  const d=ddu(dl)
  if(d<0)return`<span class="dl-chip dl-c">D+${Math.abs(d)}초과</span>`
  if(d===0)return`<span class="dl-chip dl-c">오늘</span>`
  if(d<=3)return`<span class="dl-chip dl-c">D-${d}</span>`
  if(d<=7)return`<span class="dl-chip dl-w">D-${d}</span>`
  return`<span class="dl-chip dl-ok">D-${d}</span>`
}
function pb(p){return{critical:'<span class="badge br">긴급</span>',high:'<span class="badge bo">중요</span>',medium:'<span class="badge bg">보통</span>'}[p]||''}
function sb2(s){const m={'완료':'bg','진행중':'bb','진행전':'bgr','보류':'br','이슈':'br'};return`<span class="badge ${m[s]||'bgr'}">${s||'진행전'}</span>`}
function avEl(name,sz=22){
  const m=MEMBERS.find(m=>m.name===name)
  const c=m?m.color:'#888'
  const s=name?name[0]:'?'
  return`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${c};display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.42)}px;font-weight:600;color:#fff;flex-shrink:0" title="${name}">${s}</div>`
}
function toast(msg,ok=true){const t=document.getElementById('toast');t.textContent=msg;t.style.background=ok?'#2d6a27':'#A32D2D';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function mkOverlay(id){const old=document.getElementById(id);if(old)old.remove();const w=document.createElement('div');w.id=id;w.className='overlay';w.onclick=e=>{if(e.target===w)w.remove()};return w}

// ─── 인증 ───
const {data:{session}}=await sb.auth.getSession()
if(!session){location.href='index.html';throw new Error('no session')}
curEmail=session.user.email
MEMBERS=getMembers().map((m,i)=>({...m,color:MEMBER_COLORS[i%MEMBER_COLORS.length]}))
const found=MEMBERS.find(m=>m.email===curEmail)
curUser=found||{name:curEmail.split('@')[0],color:'#888'}
document.getElementById('user-av').querySelector('span').textContent=curUser.name[0]
document.getElementById('user-av').style.background=curUser.color
document.getElementById('user-name').textContent=curUser.name
window.logout=async()=>{await sb.auth.signOut();location.href='index.html'}

// ─── 데이터 로드 ───
async function loadAll(){
  const [catsR,itemsR,subsR,cmtsR,kpiR,kpiAR,uxR,uxSR,aiR,mtgR,histR]=await Promise.all([
    sb.from('checklist_categories').select('*').order('sort_order'),
    sb.from('checklist_items').select('*').order('sort_order'),
    sb.from('checklist_subs').select('*').order('sort_order'),
    sb.from('checklist_comments').select('*').order('created_at'),
    sb.from('kpi_data').select('*'),
    sb.from('kpi_analysis').select('*').eq('id','main').single(),
    sb.from('ux_testers').select('*').order('sort_order'),
    sb.from('ux_settings').select('*').eq('id','main').single(),
    sb.from('action_items').select('*').order('created_at'),
    sb.from('meetings').select('*').order('date',{ascending:false}),
    sb.from('history').select('*').order('created_at',{ascending:false}).limit(150),
  ])
  D.cats=catsR.data||[]
  D.items=itemsR.data||[]
  D.subs=subsR.data||[]
  D.comments=cmtsR.data||[]
  D.kpiRows=kpiR.data||[]
  D.kpiAnalysis=kpiAR.data||{sales_analysis:'',recovery_plan:'',loss_estimate:''}
  D.uxItems=uxR.data||[]
  D.uxSettings=uxSR.data||{}
  D.actionItems=aiR.data||[]
  D.meetings=mtgR.data||[]
  D.history=histR.data||[]
  checkMyNotifs()
  render()
}

// 알림 체크 (내가 담당자인 미완료 항목)
function checkMyNotifs(){
  const myItems=D.actionItems.filter(a=>{
    if(a.status==='완료')return false
    const owners=Array.isArray(a.owners)?a.owners:(a.owner?[a.owner]:[])
    return owners.includes(curUser.name)
  })
  document.getElementById('notif-dot').classList.toggle('show', myItems.length>0)
}

// 실시간
sb.channel('ople-rt')
  .on('postgres_changes',{event:'*',schema:'public',table:'checklist_items'},()=>loadAll())
  .on('postgres_changes',{event:'*',schema:'public',table:'checklist_subs'},()=>loadAll())
  .on('postgres_changes',{event:'*',schema:'public',table:'checklist_comments'},()=>loadAll())
  .on('postgres_changes',{event:'*',schema:'public',table:'action_items'},()=>loadAll())
  .on('postgres_changes',{event:'*',schema:'public',table:'kpi_data'},()=>loadAll())
  .on('postgres_changes',{event:'*',schema:'public',table:'meetings'},()=>loadAll())
  .on('postgres_changes',{event:'*',schema:'public',table:'history'},()=>loadAll())
  .subscribe()

async function logH(action,target){await sb.from('history').insert({user_name:curUser.name,action,target})}

// ─── 탭 ───
window.showTab=t=>{
  activeTab=t
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'))
  document.getElementById('tab-'+t).classList.add('active')
  render()
}
function render(){
  document.getElementById('dday-c').textContent=`D-${calcDD()} · ${getDday().slice(5).replace('-','/')}`
  const pd=D.actionItems.filter(a=>a.status!=='완료').length
  const ab=document.getElementById('ai-badge')
  ab.textContent=pd;ab.style.display=pd>0?'':'none'
  const mc=document.getElementById('mc')
  if(activeTab==='dash')mc.innerHTML=renderDash()
  else if(activeTab==='cal')mc.innerHTML=renderCal()
  else if(activeTab==='ck')mc.innerHTML=renderCK()
  else if(activeTab==='kpi')mc.innerHTML=renderKPI()
  else if(activeTab==='ux')mc.innerHTML=renderUX()
  else if(activeTab==='ai')mc.innerHTML=renderAI()
  else if(activeTab==='mtg')mc.innerHTML=renderMTG()
  else mc.innerHTML=renderHist()
}

// ─── 대시보드 ───
function renderDash(){
  let tot=0,dn=0
  D.items.forEach(i=>{tot++;if(i.done)dn++;D.subs.filter(s=>s.item_id===i.id).forEach(s=>{tot++;if(s.done)dn++;})})
  const prog=tot?Math.round(dn/tot*100):0
  const aiDone=D.actionItems.filter(a=>a.status==='완료').length
  const aiPend=D.actionItems.filter(a=>a.status!=='완료').length
  const myTasks=D.actionItems.filter(a=>{
    if(a.status==='완료')return false
    const owners=Array.isArray(a.owners)?a.owners:(a.owner?[a.owner]:[])
    return owners.includes(curUser.name)
  })
  const urgent=D.items.filter(i=>!i.done&&ddu(i.deadline)<=3).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).slice(0,6)

  const catProg=D.cats.map(cat=>{
    const its=D.items.filter(i=>i.category_id===cat.id)
    const t=its.reduce((s,i)=>s+1+D.subs.filter(s=>s.item_id===i.id).length,0)
    const d=its.reduce((s,i)=>s+(i.done?1:0)+D.subs.filter(s=>s.item_id===i.id&&s.done).length,0)
    return{...cat,t,d,pct:t?Math.round(d/t*100):0}
  })

  return`
<div class="krow">
  <div class="kpi"><div class="kn" style="color:var(--o)">${calcDD()}</div><div class="kl">D-day까지</div></div>
  <div class="kpi"><div class="kn" style="color:${prog>=70?'#3B6D11':'var(--text)'}">${prog}%</div><div class="kl">전체 진행률</div></div>
  <div class="kpi"><div class="kn">${aiDone}/${D.actionItems.length}</div><div class="kl">액션 완료</div></div>
  <div class="kpi"><div class="kn" style="color:var(--o)">${D.actionItems.filter(a=>a.status==='진행중').length}</div><div class="kl">진행중</div></div>
  <div class="kpi"><div class="kn" style="color:#A32D2D">${aiPend}</div><div class="kl">미완료</div></div>
</div>

${myTasks.length?`<div class="sec sec-o">
  <div class="sh"><span class="st"><i class="ti ti-bell oi"></i> ${curUser.name}님 담당 미완료 항목 (${myTasks.length}건)</span></div>
  ${myTasks.slice(0,4).map(a=>`<div class="ai-row" onclick="showTab('ai')" style="cursor:pointer">
  <div style="flex:1;min-width:0"><div style="font-size:13px">${a.text}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${a.cat}</div></div>
  ${dlc(a.deadline,false)}
  </div>`).join('')}
</div>`:''}

<div class="two">
<div class="sec sec-o">
  <div class="sh"><span class="st"><i class="ti ti-list-check oi"></i> 카테고리별 진행률</span><button class="btn" onclick="showTab('ck')">전체 보기</button></div>
  ${catProg.map(cat=>`<div style="margin-bottom:9px">
  <div style="display:flex;justify-content:space-between;margin-bottom:3px">
    <div style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:${cat.color};display:inline-block"></span><span style="font-size:12px">${cat.label}</span></div>
    <span style="font-size:11px;color:var(--muted)">${cat.d}/${cat.t}</span>
  </div>
  <div class="pgb"><div class="pgf" style="width:${cat.pct}%;background:${cat.pct===100?'#639922':cat.color}"></div></div>
  </div>`).join('')}
</div>
<div>
  <div class="sec">
    <div class="sh"><span class="st"><i class="ti ti-alarm oi"></i> 마감 임박 (3일 이내)</span></div>
    ${urgent.length?urgent.map(i=>`<div style="display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:0.5px solid var(--bd);cursor:pointer" onclick="showTab('ck')">
    <div style="flex:1;min-width:0"><div style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.text}</div><div style="font-size:10px;color:var(--muted)">${i.owner||''}</div></div>
    ${dlc(i.deadline,i.done)}</div>`).join(''):'<div style="font-size:13px;color:var(--muted)">없음</div>'}
  </div>
  <div class="sec">
    <div class="sh"><span class="st"><i class="ti ti-notes oi"></i> 최근 회의</span><button class="btn" onclick="showTab('mtg')">전체</button></div>
    ${D.meetings.slice(0,2).map(m=>`<div class="mtg-card" onclick="openMtg('${m.id}')">
    <div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:12px;font-weight:500">${m.title}</span><span style="font-size:10px;color:var(--muted)">${m.date}</span></div>
    <div style="font-size:11px;color:var(--muted)">결정 ${(m.decisions||[]).length}건 · 미확인 ${(m.pending||[]).length}건</div>
    </div>`).join('')||'<div style="font-size:13px;color:var(--muted)">회의록 없음</div>'}
  </div>
</div>
</div>`
}

// ─── 캘린더 ───
function renderCal(){
  const yr=calYear, mo=calMonth
  const mLabel=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월']
  const first=new Date(yr,mo,1).getDay()
  const last=new Date(yr,mo+1,0).getDate()
  const days=['일','월','화','수','목','금','토']

  // 날짜별 항목 모으기
  function eventsOnDay(d){
    const key=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    return D.items.filter(i=>i.deadline===key)
  }

  let cells=''
  for(let i=0;i<first;i++)cells+=`<div class="cal-cell empty"></div>`
  for(let d=1;d<=last;d++){
    const dateStr=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const evs=eventsOnDay(d)
    const wk=(d+first-1)%7
    const isWknd=wk===0||wk===6
    const isToday=dateStr===new Date().toISOString().slice(0,10)
    cells+=`<div class="cal-cell${isWknd?' wknd':''}${isToday?' today':''}" onclick="calDayClick('${dateStr}')">
    <div class="cal-num">${d}</div>
    ${evs.slice(0,3).map(e=>`<div class="cal-ev" style="background:${getCatColor(e.category_id)}22;color:${getCatColor(e.category_id)};border-left:2px solid ${getCatColor(e.category_id)}" onclick="event.stopPropagation();openCkDetail('${e.id}')">${e.text}</div>`).join('')}
    ${evs.length>3?`<div style="font-size:9px;color:var(--muted)">+${evs.length-3}개</div>`:''}
    <button class="cal-add" onclick="event.stopPropagation();openAddItemWithDate('${dateStr}')">+</button>
    </div>`
  }

  return`<div class="sec">
  <div class="cal-nav">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn btn-g" onclick="calNav(-1)"><i class="ti ti-chevron-left"></i></button>
      <span class="cal-title">${yr}년 ${mLabel[mo]}</span>
      <button class="btn btn-g" onclick="calNav(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <button class="btn btn-o" onclick="openAddItemWithDate('')"><i class="ti ti-plus"></i> 일정 추가</button>
  </div>
  <div class="cal-grid">
    ${days.map(d=>`<div class="cal-dh">${d}</div>`).join('')}
    ${cells}
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)">
    ${D.cats.map(c=>`<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:3px"></span>${c.label}</span>`).join('')}
  </div>
  </div>

  <div class="sec">
  <div class="sh"><span class="st"><i class="ti ti-list oi"></i> 이번 달 마감 항목</span></div>
  ${D.items.filter(i=>{
    if(!i.deadline)return false
    const d=new Date(i.deadline)
    return d.getFullYear()===yr&&d.getMonth()===mo
  }).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).map(i=>`
  <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--bd);cursor:pointer" onclick="openCkDetail('${i.id}')">
    <span style="width:8px;height:8px;border-radius:50%;background:${getCatColor(i.category_id)};flex-shrink:0"></span>
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;${i.done?'text-decoration:line-through;color:var(--muted)':''}">${i.text}</div>
      <div style="font-size:11px;color:var(--muted)">${i.owner||''}</div>
    </div>
    <span style="font-size:11px;color:var(--muted)">${fmtDate(i.deadline)}</span>
    ${dlc(i.deadline,i.done)}
  </div>`).join('')||'<div style="font-size:13px;color:var(--muted)">이번 달 마감 항목 없음</div>'}
  </div>`
}

function getCatColor(catId){const c=D.cats.find(c=>c.id===catId);return c?c.color:'#888'}
window.calNav=(dir)=>{calMonth+=dir;if(calMonth>11){calMonth=0;calYear++}if(calMonth<0){calMonth=11;calYear--};render()}
window.calDayClick=(dateStr)=>{

      <i class="ti ti-chevron-${isOpen?'up':'down'}" style="color:var(--muted)"></i>
    </div>
    ${isOpen?its.map(item=>{
      const subs=D.subs.filter(s=>s.item_id===item.id)
      const cmts=D.comments.filter(c=>c.item_id===item.id)
      const sdone=subs.filter(s=>s.done).length
      const isExp=expandCks[item.id]!==false
      return`<div style="margin:8px 0">
      <div class="ck-row" onclick="toggleCkExp('${item.id}')">
        <input type="checkbox" ${item.done?'checked':''} onclick="event.stopPropagation()" onchange="toggleItem('${item.id}',this.checked)">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;${item.done?'text-decoration:line-through;color:var(--muted)':''}">${item.text}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;align-items:center">
            ${pb(item.priority)}${sb2(item.status)}
            <span style="font-size:11px;color:var(--muted)">${item.owner||''}</span>
            ${item.deadline?`<span style="font-size:11px;color:var(--muted)">${fmtDate(item.deadline)}</span>`:''}
            ${dlc(item.deadline,item.done)}
            ${subs.length?`<span style="font-size:10px;color:var(--muted)">${sdone}/${subs.length}</span>`:''}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:5px;flex-shrink:0">
          <button class="btn btn-g" style="padding:2px 7px;font-size:11px" onclick="event.stopPropagation();openCkDetail('${item.id}')">
            <i class="ti ti-pencil"></i>${cmts.length>0?' '+cmts.length:''}
          </button>
          <button class="btn btn-g btn-red" style="padding:2px 6px;font-size:11px" onclick="event.stopPropagation();deleteItem('${item.id}')"><i class="ti ti-trash"></i></button>
          <i class="ti ti-chevron-${isExp?'up':'down'}" style="font-size:13px;color:var(--muted)"></i>
        </div>
      </div>
      <div class="sub-wrap ${isExp?'open':''}" id="sub-${item.id}">
        ${subs.map(s=>`<div class="sub-row" onclick="openSubDetail('${s.id}','${item.id}')">
        <input type="checkbox" ${s.done?'checked':''} onclick="event.stopPropagation()" onchange="toggleSub('${s.id}','${item.id}',this.checked)">
        <span style="${s.done?'text-decoration:line-through;color:var(--muted);':''}flex:1;font-size:12px">${s.text}</span>
        <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
          ${s.deadline?dlc(s.deadline,s.done):''}
          <span class="vbadge ${s.verified?'ok':''}">${s.verified?'✓검증':'미검증'}</span>
          ${s.done&&!s.verified?`<button class="btn btn-o" style="font-size:10px;padding:1px 5px" onclick="event.stopPropagation();verifySub('${s.id}','${item.id}')">검증</button>`:''}
        </div>
        </div>`).join('')}
        <div style="display:flex;gap:5px;padding:4px 8px;margin-top:3px">
          <input id="ns-${item.id}" style="flex:1;font-size:12px;padding:5px 8px;border:0.5px solid var(--bd);border-radius:7px;background:var(--surface);color:var(--text);outline:none" placeholder="세부 항목 추가..." onkeydown="if(event.key==='Enter'){addSub('${item.id}');event.preventDefault()}">
          <button class="btn btn-o" style="padding:4px 9px;font-size:11px;flex-shrink:0" onclick="addSub('${item.id}')"><i class="ti ti-plus"></i></button>
        </div>
      </div>
      </div>`
    }).join(''):''}
    </div>`
  }).join('')}`
}

  return`

    <td style="color:#A32D2D;white-space:nowrap">-20% 즉시</td>
    <td><button class="btn btn-g btn-red" style="padding:1px 5px;font-size:11px" onclick="deleteKPIMetric('${m}')"><i class="ti ti-x"></i></button></td>

</div>

// ─── 액션아이템 ───
function renderAI(){
  const cats=[...new Set(D.actionItems.map(a=>a.cat))]
  const done=D.actionItems.filter(a=>a.status==='완료').length
  const inprog=D.actionItems.filter(a=>a.status==='진행중').length
  const wait=D.actionItems.filter(a=>a.status==='진행전'||a.status==='대기').length

  return`
<div class="krow" style="grid-template-columns:repeat(3,1fr)">
  <div class="kpi"><div class="kn" style="color:#3B6D11">${done}</div><div class="kl">완료</div></div>
  <div class="kpi"><div class="kn" style="color:#185FA5">${inprog}</div><div class="kl">진행중</div></div>
  <div class="kpi"><div class="kn" style="color:var(--muted)">${wait}</div><div class="kl">진행전</div></div>
</div>
<div style="display:flex;justify-content:flex-end;margin-bottom:8px">
  <button class="btn btn-o" onclick="openAddAI()"><i class="ti ti-plus"></i> 액션 추가</button>
</div>
<div class="sec">
${cats.map(cat=>{
  const its=D.actionItems.filter(a=>a.cat===cat).sort((a,b)=>{const o={'완료':3,'진행중':1,'진행전':0,'대기':0,'보류':2};return(o[a.status]||0)-(o[b.status]||0)})
  return`<div style="margin-bottom:14px">
  <div style="font-size:11px;font-weight:500;color:var(--muted);margin-bottom:5px;padding:4px 8px;background:var(--surface);border-radius:7px">${cat}</div>
  ${its.map(a=>{
    const owners=Array.isArray(a.owners)?a.owners:(a.owner?[a.owner]:[])
    const isMyTask=owners.includes(curUser.name)&&a.status!=='완료'
    return`<div class="ai-row" style="${isMyTask?'border-color:var(--ob);background:var(--ol)':''}">
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;${a.status==='완료'?'text-decoration:line-through;color:var(--muted)':''}">${a.text}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;align-items:center">
        <select class="status-sel" onchange="updateAI('${a.id}','status',this.value)">
          ${['진행전','진행중','완료','보류','이슈'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        ${owners.map(o=>`${avEl(o,18)}`).join('')}
        ${a.deadline?`<span style="font-size:10px;color:var(--muted)">${fmtDate(a.deadline)}</span>`:''}
        ${dlc(a.deadline,a.status==='완료')}
        ${a.note?`<span style="font-size:11px;color:var(--muted)">${a.note}</span>`:''}
      </div>
      ${a.last_comment?`<div style="font-size:11px;color:var(--muted);margin-top:3px;padding:3px 6px;background:var(--surface);border-radius:5px;border-left:2px solid var(--ob)"><span style="font-weight:500">${a.last_comment_by}</span>: ${a.last_comment}</div>`:''}
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
      <button class="btn btn-g" style="padding:2px 7px;font-size:11px" onclick="openAIDetail('${a.id}')"><i class="ti ti-pencil"></i></button>
      <button class="btn btn-g btn-red" style="padding:2px 6px;font-size:11px" onclick="deleteAI('${a.id}')"><i class="ti ti-trash"></i></button>
    </div>
    </div>`
  }).join('')}
  </div>`
}).join('')}
</div>`
}

window.addAIOwner=async(id,name)=>{
  if(!name)return
  const a=D.actionItems.find(a=>a.id===id);if(!a)return
  const owners=Array.isArray(a.owners)?[...a.owners]:(a.owner?[a.owner]:[])
  if(!owners.includes(name))owners.push(name)
  await sb.from('action_items').update({owners,owner:owners[0],updated_at:new Date().toISOString()}).eq('id',id)
  await logH(`담당자 추가: ${name}`,a.text)
  await loadAll()
  openAIDetail(id)
}
window.removeAIOwner=async(id,name)=>{
  const a=D.actionItems.find(a=>a.id===id);if(!a)return
  let owners=Array.isArray(a.owners)?[...a.owners]:(a.owner?[a.owner]:[])
  owners=owners.filter(o=>o!==name)
  await sb.from('action_items').update({owners,owner:owners[0]||null,updated_at:new Date().toISOString()}).eq('id',id)
  await logH(`담당자 제거: ${name}`,a.text)
  await loadAll()
  openAIDetail(id)
}
window.saveAICmt=async(id)=>{
  const txt=document.getElementById('ai-cmt-inp')?.value.trim();if(!txt)return
  const a=D.actionItems.find(a=>a.id===id);if(!a)return
  const comments=[...(a.comments||[]),{user:curUser.name,text:txt,time:ts()}]
  await sb.from('action_items').update({comments,last_comment:txt,last_comment_by:curUser.name,updated_at:new Date().toISOString()}).eq('id',id)
  await logH(`댓글: ${txt.slice(0,20)}`,a.text)
  document.getElementById('ai-det-ov').remove()
  toast('댓글 등록됨');await loadAll()
}
window.updateAI=async(id,field,value)=>{
  const a=D.actionItems.find(a=>a.id===id);if(!a)return
  await sb.from('action_items').update({[field]:value||null,updated_at:new Date().toISOString()}).eq('id',id)
  await logH(`${field} 변경 →${value}`,a.text)
  await loadAll()
}
window.deleteAI=async(id)=>{
  const a=D.actionItems.find(a=>a.id===id);if(!a||!confirm(`"${a.text}" 삭제?`))return
  await sb.from('action_items').delete().eq('id',id)
  await logH('액션 삭제',a.text);await loadAll()
}

  w.innerHTML=`<div class="modal" style="width:440px">

  const m=MEMBERS.find(m=>m.name===name)
  chips.innerHTML=window._naiOwners.map(o=>`<div class="ochip" style="background:${MEMBERS.find(m=>m.name===o)?.color||'#888'}">${o}<span class="ochip-del" onclick="window._naiOwners=window._naiOwners.filter(n=>n!=='${o}');addNAIOwner('')">✕</span></div>`).join('')

  const w=mkOverlay('add-mtg-ov')
  w.innerHTML=`<div class="modal">
  <div class="modal-h"><span style="font-weight:500">회의록 추가</span><button class="btn btn-g" onclick="document.getElementById('add-mtg-ov').remove()"><i class="ti ti-x"></i></button></div>
  <div class="modal-b">
    <input class="inp" type="date" id="am-date" value="${new Date().toISOString().slice(0,10)}">
    <input class="inp" id="am-title" placeholder="회의 제목">
    <input class="inp" id="am-att" placeholder="참석자 (쉼표 구분)">
    <textarea class="inp" id="am-dec" placeholder="결정사항 (줄 구분)"></textarea>
    <textarea class="inp" id="am-pend" placeholder="미확인/후속 (줄 구분)"></textarea>
    <textarea class="inp" id="am-act" placeholder="다음 액션 (줄 구분)"></textarea>
  </div>
  <div class="modal-f">
    <button class="btn" onclick="document.getElementById('add-mtg-ov').remove()">취소</button>
    <button class="btn btn-o" onclick="saveMtg()">저장</button>
  </div></div>`
  document.body.appendChild(w)
}
window.saveMtg=async()=>{
  const title=document.getElementById('am-title')?.value.trim();if(!title)return
  const sp=id=>document.getElementById(id).value.split('\n').map(s=>s.trim()).filter(Boolean)
  await sb.from('meetings').insert({date:document.getElementById('am-date').value,title,attendees:document.getElementById('am-att').value.split(',').map(s=>s.trim()).filter(Boolean),decisions:sp('am-dec'),pending:sp('am-pend'),actions:sp('am-act'),created_by:curUser.name})
  await logH('회의록 등록',title)
  document.getElementById('add-mtg-ov').remove()
  toast('저장됨');await loadAll()
}

// ─── 변경이력 ───
function renderHist(){
  return`<div class="sec">
  <div class="sh"><span class="st"><i class="ti ti-history oi"></i> 변경이력 (${D.history.length}건)</span></div>
  ${D.history.map(h=>`<div class="hist-r">
  ${avEl(h.user_name,20)}
  <div style="flex:1"><span style="font-weight:500">${h.user_name}</span> · ${h.action}${h.target?` <span style="color:var(--muted)">(${h.target})</span>`:''}</div>
  <div style="color:var(--muted);white-space:nowrap;font-size:10px">${new Date(h.created_at).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
  </div>`).join('')}
  </div>`
}

// ─── 시작 ───
await loadAll()
</script>
