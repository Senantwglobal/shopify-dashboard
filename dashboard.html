<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPLE Shopify 전환 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--o:#E8680A;--ol:#FEF0E6;--od:#B84E06;--ob:#F5C49A;--bg:#f8f7f5;--card:#fff;--bd:#e5e3dc;--text:#1a1a1a;--muted:#888;--sf:#f3f2ef}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
.hdr{background:var(--card);border-bottom:0.5px solid var(--bd);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.logo{background:var(--o);color:#fff;font-size:13px;font-weight:600;padding:4px 10px;border-radius:6px}
.dday-b{background:var(--ol);color:var(--od);font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;border:0.5px solid var(--ob);cursor:pointer}
.uinfo{display:flex;align-items:center;gap:8px;position:relative}
.av-wrap{position:relative;cursor:pointer}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;flex-shrink:0}
.notif-btn{position:relative;background:none;border:none;cursor:pointer;padding:0}
.notif-badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:#E24B4A;color:#fff;font-size:10px;font-weight:600;display:none;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid var(--card)}
.notif-badge.show{display:flex}
.notif-panel{position:absolute;top:36px;right:0;width:300px;background:var(--card);border:0.5px solid var(--bd);border-radius:12px;z-index:100;display:none;overflow:hidden}
.notif-panel.open{display:block}
.notif-item{padding:10px 14px;border-bottom:0.5px solid var(--bd);cursor:pointer;font-size:13px}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:var(--ol)}
.notif-item-title{font-weight:500;margin-bottom:2px}
.notif-item-meta{font-size:11px;color:var(--muted)}
.logout-btn{font-size:12px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--bd);background:none;color:var(--muted);cursor:pointer}
.nav{display:flex;padding:0 16px;background:var(--card);border-bottom:0.5px solid var(--bd);overflow-x:auto}
.nb{padding:9px 12px;font-size:12px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:4px}
.nb.active{color:var(--o);border-bottom-color:var(--o);font-weight:500}
.nb:hover:not(.active){color:var(--text)}
.nbadge{background:#E24B4A;color:#fff;border-radius:8px;padding:0 5px;font-size:10px;margin-left:2px}
.cnt{padding:16px 20px;max-width:1100px;margin:0 auto}
.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:10px;border:0.5px solid var(--bd);padding:12px;text-align:center}
.kn{font-size:22px;font-weight:500;margin-bottom:2px}
.kl{font-size:10px;color:var(--muted)}
.sec{background:var(--card);border:0.5px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.sec-o{border-color:var(--ob)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.st{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.oi{color:var(--o)}
.btn{font-size:12px;padding:5px 10px;border-radius:8px;border:0.5px solid var(--bd);background:none;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.btn:hover{background:var(--sf)}
.btn-o{background:var(--o);color:#fff;border-color:var(--o)}
.btn-o:hover{background:var(--od);color:#fff}
.btn-g{border-color:transparent;color:var(--muted)}
.btn-g:hover{color:var(--text);background:var(--sf)}
.btn-red{color:#A32D2D;border-color:#F09595}
.btn-red:hover{background:#FCEBEB}
.badge{font-size:10px;padding:2px 6px;border-radius:9px;font-weight:500;white-space:nowrap}
.bo{background:var(--ol);color:var(--od)}
.bb{background:#E6F1FB;color:#185FA5}
.br{background:#FCEBEB;color:#A32D2D}
.bg{background:#EAF3DE;color:#3B6D11}
.bgr{background:#F1EFE8;color:#5F5E5A}
.inp{width:100%;padding:8px 10px;border:0.5px solid var(--bd);border-radius:8px;font-size:13px;background:var(--sf);color:var(--text);margin-bottom:8px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--o)}
textarea.inp{resize:vertical;min-height:64px}
select.inp{cursor:pointer}
.pgb{height:4px;border-radius:2px;background:var(--sf);overflow:hidden;margin-top:3px}
.pgf{height:100%;border-radius:2px;transition:width .4s}
.dlc{font-size:10px;font-weight:500;padding:2px 6px;border-radius:9px;white-space:nowrap}
.dl-ok{background:#EAF3DE;color:#3B6D11}
.dl-w{background:var(--ol);color:var(--od)}
.dl-c{background:#FCEBEB;color:#A32D2D}
.dl-d{background:#F1EFE8;color:#5F5E5A}
.ck-row{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:8px;margin-bottom:2px}
.ck-row:hover{background:var(--sf)}
.ck-row input[type=checkbox]{accent-color:var(--o);margin-top:3px;flex-shrink:0;width:15px;height:15px}
.sub-wrap{padding:3px 0 3px 26px;display:none}
.sub-wrap.open{display:block}
.sub-row{display:flex;align-items:flex-start;gap:7px;padding:5px 8px;border-radius:8px;margin-bottom:1px;cursor:pointer}
.sub-row:hover{background:var(--sf)}
.sub-row input[type=checkbox]{accent-color:var(--o);margin-top:2px;flex-shrink:0;width:13px;height:13px}
.vbadge{font-size:9px;padding:1px 5px;border-radius:6px;background:#EEEDFE;color:#534AB7}
.vbadge.ok{background:#EAF3DE;color:#3B6D11}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mtg-card{padding:11px;border:0.5px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.mtg-card:hover{border-color:var(--ob)}
.ai-row{display:flex;align-items:flex-start;gap:8px;padding:9px;border-radius:9px;border:0.5px solid var(--bd);margin-bottom:6px;background:var(--card)}
.ai-row:hover{border-color:var(--ob)}
.kpi-tbl{width:100%;border-collapse:collapse;font-size:12px}
.kpi-tbl th{background:var(--sf);padding:8px;text-align:left;font-weight:500;font-size:11px;color:var(--muted);border-bottom:0.5px solid var(--bd);white-space:nowrap}
.kpi-tbl td{padding:7px 8px;border-bottom:0.5px solid var(--bd)}
.kpi-tbl tr:last-child td{border-bottom:none}
.kpi-cell{width:100%;min-width:70px;padding:4px 6px;border:0.5px solid var(--bd);border-radius:5px;font-size:12px;background:var(--sf);color:var(--text);outline:none}
.kpi-cell:focus{border-color:var(--o)}
.hist-r{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--bd);font-size:12px}
.toast{position:fixed;bottom:20px;right:20px;background:#2d6a27;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.rdot{width:7px;height:7px;border-radius:50%;background:#639922;display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding-top:28px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;border:0.5px solid var(--bd);border-top:3px solid var(--o);width:560px;max-width:95%;max-height:90vh;overflow-y:auto}
.mh{padding:13px 16px;border-bottom:0.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px}
.mb{padding:16px}
.mf{padding:12px 16px;border-top:0.5px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dh{text-align:center;font-size:11px;color:var(--muted);padding:4px;font-weight:500}
.cal-cell{min-height:68px;border-radius:8px;padding:4px 5px;border:0.5px solid transparent;background:var(--sf);position:relative;cursor:pointer;transition:border-color .1s}
.cal-cell:hover{border-color:var(--o)}
.cal-cell.today{border-color:var(--o);border-width:1.5px}
.cal-cell.empty{background:transparent;border:none;cursor:default}
.cal-cell.wknd{opacity:.65}
.cal-num{font-size:11px;font-weight:500;margin-bottom:2px}
.cal-cell.today .cal-num{color:var(--o)}
.cal-ev{font-size:9px;padding:2px 4px;border-radius:3px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-cell.drag-over{border-color:var(--o);background:var(--ol);border-style:dashed}
.cal-ev[draggable]{user-select:none}
.cal-ev.dragging{opacity:.4}
.cal-add{position:absolute;bottom:3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--o);color:#fff;font-size:12px;line-height:16px;text-align:center;display:none;border:none;cursor:pointer}
.cal-cell:hover .cal-add{display:block}
.owner-chips{display:flex;flex-wrap:wrap;gap:4px;min-height:28px;padding:4px;border:0.5px solid var(--bd);border-radius:8px;background:var(--sf);margin-bottom:8px}
.ochip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;color:#fff}
.ochip-x{cursor:pointer;opacity:.7;font-size:10px;margin-left:1px}
.ochip-x:hover{opacity:1}
.status-sel{font-size:11px;padding:2px 6px;border:0.5px solid var(--bd);border-radius:6px;background:var(--sf);cursor:pointer;color:var(--text);outline:none}
.ux-item{padding:10px;border:0.5px solid var(--bd);border-radius:9px;margin-bottom:8px;background:var(--card);cursor:pointer;display:flex;align-items:flex-start;gap:8px}
.ux-item:hover{border-color:var(--ob)}
/* 대시보드 위젯 */
.dash-widget{background:var(--card);border:0.5px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer;transition:border-color .15s}
.dash-widget:hover{border-color:var(--ob)}
.dash-widget-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dash-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--bd);font-size:13px}
.dash-row:last-child{border-bottom:none}
.analysis-area{background:var(--sf);border-radius:9px;padding:12px;font-size:13px;color:#444;line-height:1.6;min-height:60px;white-space:pre-wrap}
@media(max-width:600px){.two{grid-template-columns:1fr}.three{grid-template-columns:1fr}.cnt{padding:12px}}
</style>
</head>
<body>
<div class="hdr">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span class="logo">OPLE</span>
    <span style="font-size:14px;font-weight:500">Shopify 전환 프로젝트</span>
    <span class="dday-b" id="dday-c" onclick="openDdayEdit()">D-? · ?</span>
    <span style="font-size:11px;color:var(--muted)"><span class="rdot"></span>실시간</span>
  </div>
  <div class="uinfo">
    <div class="notif-btn" onclick="toggleNotif()">
      <div class="av" id="user-av" style="width:30px;height:30px;font-size:12px;background:var(--o)">?</div>
      <div class="notif-badge" id="notif-badge"></div>
    </div>
    <span id="user-name" style="font-size:13px;color:var(--muted)">로딩중</span>
    <div class="notif-panel" id="notif-panel">
      <div style="padding:10px 14px;font-size:12px;font-weight:500;color:var(--muted);border-bottom:0.5px solid var(--bd)">내 담당 항목</div>
      <div id="notif-list"></div>
    </div>
    <button class="logout-btn" onclick="logout()">로그아웃</button>
  </div>
</div>
<div class="nav">
  <button class="nb active" onclick="showTab('dash')" id="tab-dash"><i class="ti ti-layout-dashboard"></i>대시보드</button>
  <button class="nb" onclick="showTab('cal')" id="tab-cal"><i class="ti ti-calendar"></i>캘린더</button>
  <button class="nb" onclick="showTab('ck')" id="tab-ck"><i class="ti ti-checklist"></i>체크리스트</button>
  <button class="nb" onclick="showTab('kpi')" id="tab-kpi"><i class="ti ti-chart-line"></i>KPI</button>
  <button class="nb" onclick="showTab('ux')" id="tab-ux"><i class="ti ti-device-mobile"></i>UX 베타</button>
  <button class="nb" onclick="showTab('ai')" id="tab-ai"><i class="ti ti-list-check"></i>액션아이템<span class="nbadge" id="ai-badge" style="display:none"></span></button>
  <button class="nb" onclick="showTab('mtg')" id="tab-mtg"><i class="ti ti-notes"></i>회의록</button>
  <button class="nb" onclick="showTab('hist')" id="tab-hist"><i class="ti ti-history"></i>변경이력</button>
</div>
<div class="cnt" id="mc"><div style="text-align:center;padding:60px;color:var(--muted)">로딩중...</div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const sb=createClient('https://btutlgcidpjgedpypzri.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0dXRsZ2NpZHBqZ2VkcHlwenJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NTE0MjQsImV4cCI6MjA5ODAyNzQyNH0.qZp04DhOmm4oSho3Qsfz8UWEeY-eNhGcIydyVNejqBc')

const MC=['#E8680A','#534AB7','#0F6E56','#A32D2D','#185FA5','#854F0B','#993556','#5F5E5A']
function getMembers(){try{const s=localStorage.getItem('ople-members');return(s?JSON.parse(s):[{name:'한덕희',email:'handeokhee@ople.co'},{name:'박영환',email:'younghwan@ople.co'},{name:'천세나',email:'sena@ople.co'},{name:'권현정',email:'hyunjeong@ople.co'},{name:'김현수',email:'hyunsu@ople.co'}]).map((m,i)=>({...m,color:MC[i%MC.length]}))}catch{return[]}}

let MEMBERS=[], curUser=null, curEmail=null, activeTab='dash'
let expandCats={}, expandCks={}, calYear=2026, calMonth=6
let D={cats:[],items:[],subs:[],comments:[],kpiRows:[],kpiAnalysis:{},uxItems:[],uxSettings:{},actionItems:[],meetings:[],history:[]}
let notifOpen=false

const {data:{session}}=await sb.auth.getSession()
if(!session){location.href='index.html';throw new Error()}
curEmail=session.user.email
MEMBERS=getMembers()
curUser=MEMBERS.find(m=>m.email===curEmail)||{name:curEmail.split('@')[0],color:'#888'}
document.getElementById('user-av').textContent=curUser.name[0]
document.getElementById('user-av').style.background=curUser.color
document.getElementById('user-name').textContent=curUser.name
window.logout=async()=>{await sb.auth.signOut();location.href='index.html'}

const TODAY=new Date()
function ddu(ds){if(!ds)return 999;return Math.ceil((new Date(ds)-TODAY)/864e5)}
function calcDD(){return Math.max(0,Math.ceil((new Date(getDday())-TODAY)/864e5))}
function getDday(){return localStorage.getItem('ople-dday')||'2026-07-14'}
function setDday(d){localStorage.setItem('ople-dday',d)}
function fmtDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'})}
function ts(){return new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function dlc(dl,done){
  if(done)return`<span class="dlc dl-d">완료</span>`
  if(!dl)return''
  const d=ddu(dl)
  if(d<0)return`<span class="dlc dl-c">D+${Math.abs(d)}초과</span>`
  if(d===0)return`<span class="dlc dl-c">오늘</span>`
  if(d<=3)return`<span class="dlc dl-c">D-${d}</span>`
  if(d<=7)return`<span class="dlc dl-w">D-${d}</span>`
  return`<span class="dlc dl-ok">D-${d}</span>`
}
function pb(p){return{critical:'<span class="badge br">긴급</span>',high:'<span class="badge bo">중요</span>',medium:'<span class="badge bg">보통</span>'}[p]||''}
function sb2(s){const m={'완료':'bg','진행중':'bb','진행전':'bgr','보류':'br','이슈':'br'};return`<span class="badge ${m[s]||'bgr'}">${s||'진행전'}</span>`}
function avEl(name,sz=22){const m=MEMBERS.find(m=>m.name===name);const c=m?m.color:'#888';return`<div class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px;background:${c}" title="${name}">${name?name[0]:'?'}</div>`}
function ownersEl(owners,sz=20){return(Array.isArray(owners)?owners:[owners||'']).filter(Boolean).map(o=>avEl(o,sz)).join('')}
function getCatColor(id){const c=D.cats.find(c=>c.id===id);return c?c.color:'#888'}
function getOwners(a){return Array.isArray(a.owners)&&a.owners.length?a.owners:a.owner?[a.owner]:[]}
function toast(msg,ok=true){const t=document.getElementById('toast');t.textContent=msg;t.style.background=ok?'#2d6a27':'#A32D2D';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function mkOv(id){const old=document.getElementById(id);if(old)old.remove();const w=document.createElement('div');w.id=id;w.className='overlay';w.onclick=e=>{if(e.target===w)w.remove()};return w}
async function logH(action,target){await sb.from('history').insert({user_name:curUser.name,action,target})}

// 알림 패널
window.toggleNotif=()=>{
  notifOpen=!notifOpen
  document.getElementById('notif-panel').classList.toggle('open',notifOpen)
  if(notifOpen)document.addEventListener('click',closeNotifOutside,{once:true})
}
function closeNotifOutside(e){
  if(!document.getElementById('notif-panel').contains(e.target)){notifOpen=false;document.getElementById('notif-panel').classList.remove('open')}
}
function updateNotif(){
  const myItems=D.actionItems.filter(a=>{if(a.status==='완료')return false;const o=getOwners(a);return o.includes(curUser.name)})
  const badge=document.getElementById('notif-badge')
  badge.textContent=myItems.length
  badge.classList.toggle('show',myItems.length>0)
  const list=document.getElementById('notif-list')
  if(!myItems.length){list.innerHTML=`<div style="padding:14px;font-size:13px;color:var(--muted);text-align:center">담당 항목 없음</div>`;return}
  list.innerHTML=myItems.slice(0,8).map(a=>`<div class="notif-item" onclick="showTab('ai');document.getElementById('notif-panel').classList.remove('open');notifOpen=false">
    <div class="notif-item-title">${a.text}</div>
    <div class="notif-item-meta">${a.cat||''} · ${sb2(a.status)} ${dlc(a.deadline,false)}</div>
  </div>`).join('')+(myItems.length>8?`<div style="padding:10px;text-align:center;font-size:12px;color:var(--muted)">+${myItems.length-8}개 더</div>`:'')
}

// 담당자 선택 컴포넌트
function ownerSelectHTML(selectedOwners,inputId){
  const chips=selectedOwners.map(o=>`<div class="ochip" style="background:${MEMBERS.find(m=>m.name===o)?.color||'#888'}">${o}<span class="ochip-x" onclick="removeOwnerChip('${inputId}','${o}')">✕</span></div>`).join('')
  return`<div class="owner-chips" id="chips-${inputId}">${chips}<span style="font-size:11px;color:var(--muted);align-self:center;padding:2px 4px">담당자 선택 →</span></div>
  <select class="inp" style="margin-bottom:8px" onchange="addOwnerChip('${inputId}',this.value);this.value=''">
    <option value="">+ 담당자 추가</option>
    ${MEMBERS.map(m=>`<option value="${m.name}">${m.name}</option>`).join('')}
  </select>
  <input type="hidden" id="${inputId}" value="${selectedOwners.join(',')}">`
}
window._ownerData={}
window.addOwnerChip=(inputId,name)=>{
  if(!name)return
  const inp=document.getElementById(inputId);if(!inp)return
  const cur=inp.value?inp.value.split(',').filter(Boolean):[]
  if(cur.includes(name))return
  cur.push(name)
  inp.value=cur.join(',')
  const chips=document.getElementById('chips-'+inputId)
  if(chips){const c=document.createElement('div');c.className='ochip';c.style.background=MEMBERS.find(m=>m.name===name)?.color||'#888';c.innerHTML=`${name}<span class="ochip-x" onclick="removeOwnerChip('${inputId}','${name}')">✕</span>`;chips.insertBefore(c,chips.lastElementChild)}
}
window.removeOwnerChip=(inputId,name)=>{
  const inp=document.getElementById(inputId);if(!inp)return
  const cur=inp.value?inp.value.split(',').filter(Boolean):[]
  inp.value=cur.filter(o=>o!==name).join(',')
  const chips=document.getElementById('chips-'+inputId)
  if(chips){chips.querySelectorAll('.ochip').forEach(c=>{if(c.textContent.trim().startsWith(name))c.remove()})}
}

function renderCal(){
  const yr=calYear,mo=calMonth
  const ML=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월']
  const first=new Date(yr,mo,1).getDay(),last=new Date(yr,mo+1,0).getDate()
  const days=['일','월','화','수','목','금','토']
  function evsOn(d){
    const k=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    return D.items.filter(i=>i.deadline===k||i.start_date===k)
  }
  let cells=''
  for(let i=0;i<first;i++)cells+=`<div class="cal-cell empty"></div>`
  for(let d=1;d<=last;d++){
    const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const evs=evsOn(d),wk=(d+first-1)%7
    const isToday=ds===TODAY.toISOString().slice(0,10)
    cells+=`<div class="cal-cell${wk===0||wk===6?' wknd':''}${isToday?' today':''}"
      onclick="calClick('${ds}')"
      ondragover="event.preventDefault();this.classList.add('drag-over')"
      ondragleave="this.classList.remove('drag-over')"
      ondrop="event.preventDefault();this.classList.remove('drag-over');calDrop('${ds}',event)">
    <div class="cal-num">${d}</div>
    ${evs.slice(0,3).map(e=>`<div class="cal-ev"
      draggable="true"
      style="background:${getCatColor(e.category_id)}22;color:${getCatColor(e.category_id)};border-left:2px solid ${getCatColor(e.category_id)};cursor:grab"
      onclick="event.stopPropagation();location.href='detail.html?type=item&id=${e.id}'"
      ondragstart="event.stopPropagation();calDragStart('${e.id}',event)"
      ondragend="calDragEnd(event)"
      >${e.text}</div>`).join('')}
    ${evs.length>3?`<div style="font-size:9px;color:var(--muted)">+${evs.length-3}</div>`:''}
    <button class="cal-add" onclick="event.stopPropagation();openAddItemModal('${ds}')">+</button>
    </div>`
  }
  return`<div class="sec">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn btn-g" onclick="calNav(-1)"><i class="ti ti-chevron-left"></i></button>
      <span style="font-size:15px;font-weight:500">${yr}년 ${ML[mo]}</span>
      <button class="btn btn-g" onclick="calNav(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <button class="btn btn-o" onclick="openAddItemModal('')"><i class="ti ti-plus"></i> 일정 추가</button>
  </div>
  <div class="cal-grid">
    ${days.map(d=>`<div class="cal-dh">${d}</div>`).join('')}${cells}
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)">
    ${D.cats.map(c=>`<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:3px"></span>${c.label}</span>`).join('')}
  </div>
  </div>
  <div class="sec">
  <div class="sh"><span class="st"><i class="ti ti-list oi"></i> 이번 달 항목</span></div>
  ${D.items.filter(i=>{if(!i.deadline)return false;const d=new Date(i.deadline);return d.getFullYear()===yr&&d.getMonth()===mo}).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).map(i=>`
  <div class="dash-row" style="cursor:pointer" onclick="location.href='detail.html?type=item&id=${i.id}'">
    <span style="width:8px;height:8px;border-radius:50%;background:${getCatColor(i.category_id)};flex-shrink:0"></span>
    <div style="flex:1;min-width:0"><div style="font-size:13px;${i.done?'text-decoration:line-through;color:var(--muted)':''};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.text}</div>
    <div style="font-size:11px;color:var(--muted);display:flex;gap:6px;margin-top:2px">${i.owner||''}${ownersEl(i.owners||[],16)}</div></div>
    <span style="font-size:11px;color:var(--muted);white-space:nowrap">${fmtDate(i.deadline)}</span>
    ${dlc(i.deadline,i.done)}
  </div>`).join('')||'<div style="font-size:13px;color:var(--muted)">이번 달 항목 없음</div>'}
  </div>`
}
let _dragItemId=null

window.calDragStart=(itemId,event)=>{
  _dragItemId=itemId
  event.target.classList.add('dragging')
  event.dataTransfer.effectAllowed='move'
  event.dataTransfer.setData('text/plain',itemId)
}

window.calDragEnd=(event)=>{
  event.target.classList.remove('dragging')
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'))
}

window.calDrop=async(newDate,event)=>{
  const itemId=event.dataTransfer.getData('text/plain')||_dragItemId
  if(!itemId||!newDate)return
  const item=D.items.find(i=>i.id===itemId)
  if(!item)return
  const oldDate=item.deadline
  if(oldDate===newDate)return
  await sb.from('checklist_items').update({deadline:newDate,updated_at:new Date().toISOString()}).eq('id',itemId)
  await logH(`마감일 변경 (드래그)`,`${item.text}: ${oldDate||'없음'} → ${newDate}`)
  toast(`${item.text.slice(0,20)}... → ${newDate}`)
  _dragItemId=null
  await loadAll()
}

window.calNav=(dir)=>{calMonth+=dir;if(calMonth>11){calMonth=0;calYear++}if(calMonth<0){calMonth=11;calYear--};render()}
window.calClick=(ds)=>{const evs=D.items.filter(i=>i.deadline===ds);if(evs.length===1)location.href=`detail.html?type=item&id=${evs[0].id}`;else if(evs.length===0)openAddItemModal(ds)}

window.addNiSub=()=>{

window.saveNewItem=async()=>{
  const text=document.getElementById('ni-text')?.value.trim();if(!text)return
  const ownersRaw=document.getElementById('ni-owners')?.value||''
  const owners=ownersRaw.split(',').filter(Boolean)
  const {data:ni}=await sb.from('checklist_items').insert({
    category_id:document.getElementById('ni-cat').value,text,
    owner:owners[0]||null,owners,
    start_date:document.getElementById('ni-start').value||null,
    deadline:document.getElementById('ni-dl').value||null,
    priority:document.getElementById('ni-pri').value,
    status:document.getElementById('ni-st').value,
    created_by:curUser.name
  }).select().single()
  if(ni&&window._niSubs?.length)await sb.from('checklist_subs').insert(window._niSubs.map((t,i)=>({item_id:ni.id,text:t,verifier:curUser.name,sort_order:i})))
  await logH('항목 추가',text)
  document.getElementById('add-item-ov').remove()
  toast('추가됨');await loadAll()
}

function renderCK(){
  return`<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px">

    return`<div class="sec" style="border-left:3px solid ${cat.color}">

      <i class="ti ti-chevron-${isOpen?'up':'down'}" style="color:var(--muted)"></i>
    </div>

      const sdone=subs.filter(s=>s.done).length
      const isExp=expandCks[item.id]!==false
      const owners=item.owners?.length?item.owners:item.owner?[item.owner]:[]
      return`<div style="margin:8px 0">
      <div class="ck-row" onclick="toggleCkExp('${item.id}')">
        <input type="checkbox" ${item.done?'checked':''} onclick="event.stopPropagation()" onchange="toggleItem('${item.id}',this.checked)">

          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;align-items:center">
            ${pb(item.priority)}${sb2(item.status)}
            ${ownersEl(owners,18)}
            ${item.start_date?`<span style="font-size:11px;color:var(--muted)">${fmtDate(item.start_date)}~</span>`:''}
            ${item.deadline?`<span style="font-size:11px;color:var(--muted)">${fmtDate(item.deadline)}</span>`:''}
            ${dlc(item.deadline,item.done)}
            ${subs.length?`<span style="font-size:10px;color:var(--muted)">${sdone}/${subs.length}</span>`:''}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:5px;flex-shrink:0">
          <button class="btn btn-g" style="padding:2px 7px;font-size:11px" onclick="event.stopPropagation();location.href='detail.html?type=item&id=${item.id}'">
            <i class="ti ti-pencil"></i>${cmts.length?' '+cmts.length:''}
          </button>
          <button class="btn btn-g btn-red" style="padding:2px 6px;font-size:11px" onclick="event.stopPropagation();deleteItem('${item.id}')"><i class="ti ti-trash"></i></button>
          <i class="ti ti-chevron-${isExp?'up':'down'}" style="font-size:13px;color:var(--muted)"></i>
        </div>
      </div>
      <div class="sub-wrap ${isExp?'open':''}" id="sub-${item.id}">
        ${subs.map(s=>`<div class="sub-row" onclick="location.href='detail.html?type=item&id=${item.id}'">
        <input type="checkbox" ${s.done?'checked':''} onclick="event.stopPropagation()" onchange="toggleSub('${s.id}','${item.id}',this.checked)">
        <span style="${s.done?'text-decoration:line-through;color:var(--muted);':''}flex:1;font-size:12px">${s.text}</span>
        <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
          ${s.deadline?dlc(s.deadline,s.done):''}
          <span class="vbadge ${s.verified?'ok':''}">${s.verified?'✓검증':'미검증'}</span>
          ${s.done&&!s.verified?`<button class="btn btn-o" style="font-size:10px;padding:1px 5px" onclick="event.stopPropagation();verifySub('${s.id}','${item.id}')">검증</button>`:''}
        </div>
        </div>`).join('')}
        <div style="display:flex;gap:5px;padding:4px 8px;margin-top:3px">
          <input id="ns-${item.id}" style="flex:1;font-size:12px;padding:5px 8px;border:0.5px solid var(--bd);border-radius:7px;background:var(--sf);color:var(--text);outline:none" placeholder="세부 항목 추가..." onkeydown="if(event.key==='Enter'){addSub('${item.id}');event.preventDefault()}">

        </div>
      </div>
      </div>`
    }).join(''):''}
    </div>`
  }).join('')}`
}

}

function renderKPI(){

let aiStatusFilter='', aiCatFilter=''
function renderAI(){
  const cats=[...new Set(D.actionItems.map(a=>a.cat))]

  const wait=D.actionItems.filter(a=>['진행전','대기'].includes(a.status)).length
  const issue=D.actionItems.filter(a=>a.status==='이슈').length

  const statusBtns=[
    {label:'전체',val:'',count:D.actionItems.length,color:'var(--text)'},
    {label:'완료',val:'완료',count:done,color:'#3B6D11'},
    {label:'진행중',val:'진행중',count:inprog,color:'#185FA5'},
    {label:'진행전',val:'진행전',count:wait,color:'var(--muted)'},
    {label:'이슈',val:'이슈',count:issue,color:'#A32D2D'},

  return`
  <!-- 상태 필터 버튼 -->
  <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">
    ${statusBtns.map(s=>`<button onclick="aiStatusFilter='${s.val}';aiCatFilter='';render()" style="padding:7px 14px;border-radius:20px;border:1.5px solid ${aiStatusFilter===s.val?s.color:'var(--bd)'};background:${aiStatusFilter===s.val?s.color+'18':'var(--card)'};color:${s.color};font-size:12px;font-weight:${aiStatusFilter===s.val?'600':'400'};cursor:pointer;display:flex;align-items:center;gap:5px">
      ${s.label} <span style="background:${aiStatusFilter===s.val?s.color:'var(--sf)'};color:${aiStatusFilter===s.val?'#fff':s.color};border-radius:10px;padding:0 6px;font-size:11px">${s.count}</span>
    </button>`).join('')}
    <button class="btn btn-o" style="margin-left:auto" onclick="openAddAI()"><i class="ti ti-plus"></i> 액션 추가</button>
  </div>

  <!-- 카테고리 빠른 필터 -->
  <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;padding:8px 10px;background:var(--sf);border-radius:9px">
    <span style="font-size:11px;color:var(--muted);align-self:center;margin-right:4px">카테고리:</span>
    <button onclick="aiCatFilter='';render()" style="padding:3px 10px;border-radius:20px;border:1px solid ${aiCatFilter===''?'var(--o)':'var(--bd)'};background:${aiCatFilter===''?'var(--ol)':'var(--card)'};color:${aiCatFilter===''?'var(--o)':'var(--muted)'};font-size:11px;cursor:pointer">전체</button>
    ${cats.map(cat=>`<button onclick="aiCatFilter='${cat}';render()" style="padding:3px 10px;border-radius:20px;border:1px solid ${aiCatFilter===cat?'var(--o)':'var(--bd)'};background:${aiCatFilter===cat?'var(--ol)':'var(--card)'};color:${aiCatFilter===cat?'var(--o)':'var(--muted)'};font-size:11px;cursor:pointer">${cat}</button>`).join('')}
  </div>
  <div class="sec">
  ${(aiCatFilter?[aiCatFilter]:cats).map(cat=>{
    let its=D.actionItems.filter(a=>a.cat===cat)
    if(aiStatusFilter)its=its.filter(a=>a.status===aiStatusFilter)
    if(!its.length)return''
    its=its.sort((a,b)=>{const o={'완료':3,'진행중':1,'진행전':0,'대기':0,'보류':2,'이슈':1};return(o[a.status]||0)-(o[b.status]||0)})
    return`<div style="margin-bottom:14px">
    <div style="font-size:11px;font-weight:500;color:var(--muted);margin-bottom:5px;padding:4px 8px;background:var(--sf);border-radius:7px">${cat} <span style="float:right">${its.length}건</span></div>
    ${its.map(a=>{
      const owners=getOwners(a)
      const isMyTask=owners.includes(curUser.name)&&a.status!=='완료'
      return`<div class="ai-row" style="${isMyTask?'border-color:var(--ob);background:var(--ol)':''}">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;${a.status==='완료'?'text-decoration:line-through;color:var(--muted)':''}">${a.text}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;align-items:center">

      </div>
      </div>`
    }).join('')}
    </div>`
  }).join('')}
  </div>`
}

window.runAIMtg=async()=>{
  const raw=document.getElementById('aim-raw')?.value.trim()
  if(!raw){toast('회의록 내용을 입력해주세요.',false);return}
  document.getElementById('aim-loading').style.display='block'
  document.getElementById('aim-result').style.display='none'
  const btn=document.getElementById('aim-btn');btn.disabled=true
  try{
    const resp=await fetch('/api/summarize',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:raw})
    })
    if(!resp.ok)throw new Error('서버 오류 '+resp.status)
    const parsed=await resp.json()
    if(parsed.error)throw new Error(parsed.error)
    window._parsedMtg={...parsed,
      title:document.getElementById('aim-title')?.value.trim()||'AI 회의록',
      date:document.getElementById('aim-date')?.value,
      attendees:document.getElementById('aim-att')?.value.split(',').map(s=>s.trim()).filter(Boolean),
      raw
    }
    document.getElementById('aim-loading').style.display='none'
    document.getElementById('aim-result').style.display='block'
    const p=window._parsedMtg
    document.getElementById('aim-summary-box').innerHTML=
      '<strong>핵심 요약</strong>\n'+( p.summary||'')+
      '\n\n<strong style="color:#3B6D11">✅ 결정사항 ('+( p.decisions||[]).length+'건)</strong>\n'+((p.decisions||[]).map((d,i)=>(i+1)+'. '+d).join('\n')||'없음')+
      '\n\n<strong style="color:#A32D2D">❓ 미확인 사항</strong>\n'+((p.pending||[]).map(p=>'• '+p).join('\n')||'없음')+
      '\n\n<strong style="color:var(--o)">📌 액션아이템 ('+( p.actions||[]).length+'건)</strong>\n'+((p.actions||[]).map((a,i)=>(i+1)+'. '+a).join('\n')||'없음')
  }catch(e){
    document.getElementById('aim-loading').style.display='none'
    toast('AI 분석 실패: '+e.message,false)
  }
  btn.disabled=false
}

window.saveParsedMtg=async()=>{
  const p=window._parsedMtg;if(!p)return
  await sb.from('meetings').insert({date:p.date,title:p.title,attendees:p.attendees,decisions:p.decisions||[],pending:p.pending||[],actions:p.actions||[],full_text:p.raw||null,created_by:curUser.name})
  await logH('AI 회의록 저장',p.title)
  document.getElementById('ai-mtg-ov').remove()
  toast('회의록 저장됨');await loadAll();showTab('mtg')
}

window.addParsedActions=async()=>{
  const p=window._parsedMtg;if(!p||!p.actions?.length)return
  for(const a of p.actions){
    await sb.from('action_items').insert({cat:'회의록',text:a,owner:null,owners:[],status:'진행전',comments:[],created_by:curUser.name})

  await logH('회의록에서 액션 '+p.actions.length+'건 추가',p.title)
  toast('액션아이템 '+p.actions.length+'건 추가됨')
  document.getElementById('ai-mtg-ov').remove()
  await loadAll();showTab('ai')
}

  const w=mkOv('mtg-ov')
  const dec=(m.decisions||[]).join('\n')
  const pend=(m.pending||[]).join('\n')
  const acts=(m.actions||[]).join('\n')
  const att=(m.attendees||[]).join(',')

  if(editMode){
    w.innerHTML=`<div class="modal">
    <div class="mh">
      <span style="font-weight:500"><i class="ti ti-pencil" style="color:var(--o)"></i> 회의록 수정</span>
      <button class="btn btn-g" onclick="document.getElementById('mtg-ov').remove()"><i class="ti ti-x"></i></button>
    </div>
    <div class="mb">
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">날짜</label>
      <input class="inp" type="date" id="em-date" value="${m.date}">
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">제목</label>
      <input class="inp" id="em-title" value="${m.title}">
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">참석자 (쉼표 구분)</label>
      <input class="inp" id="em-att" value="${att}">
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">결정사항 (줄 구분)</label>
      <textarea class="inp" id="em-dec" style="min-height:90px">${dec}</textarea>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">미확인 사항 (줄 구분)</label>
      <textarea class="inp" id="em-pend" style="min-height:70px">${pend}</textarea>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">다음 액션 (줄 구분)</label>
      <textarea class="inp" id="em-act" style="min-height:70px">${acts}</textarea>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">전체 회의록 원문 (선택)</label>
      <textarea class="inp" id="em-fulltext" style="min-height:100px">${m.full_text||''}</textarea>
    </div>
    <div class="mf" style="justify-content:space-between">
      <button class="btn btn-red" onclick="deleteMtg('${m.id}')"><i class="ti ti-trash"></i> 삭제</button>
      <div style="display:flex;gap:6px">
        <button class="btn" onclick="openMtg('${m.id}',false)">취소</button>
        <button class="btn btn-o" onclick="saveMtgEdit('${m.id}')"><i class="ti ti-check"></i> 저장</button>
      </div>
    </div>
    </div>`
  } else {
    w.innerHTML=`<div class="modal">
    <div class="mh">
      <div><div style="font-weight:500">${m.title}</div><div style="font-size:11px;color:var(--muted)">${m.date}</div></div>
      <div style="display:flex;gap:6px">
        <button class="btn" onclick="openMtg('${m.id}',true)"><i class="ti ti-pencil"></i> 수정</button>
        <button class="btn btn-g" onclick="document.getElementById('mtg-ov').remove()"><i class="ti ti-x"></i></button>
      </div>
    </div>
    <div class="mb">
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">${(m.attendees||[]).map(a=>`<div style="display:flex;align-items:center;gap:4px">${avEl(a,20)}<span style="font-size:12px">${a}</span></div>`).join('')}</div>
      <div style="font-size:12px;font-weight:500;color:#3B6D11;margin-bottom:5px"><i class="ti ti-check"></i> 결정사항 (${(m.decisions||[]).length}건)</div>
      ${(m.decisions||[]).map(d=>`<div style="padding:5px 8px;margin-bottom:2px;background:#EAF3DE;border-radius:7px;font-size:12px;color:#27500A">${d}</div>`).join('')}
      <div style="font-size:12px;font-weight:500;color:#A32D2D;margin:10px 0 5px"><i class="ti ti-question-mark"></i> 미확인 사항 (${(m.pending||[]).length}건)</div>
      ${(m.pending||[]).map(p=>`<div style="padding:5px 8px;margin-bottom:2px;background:#FCEBEB;border-radius:7px;font-size:12px;color:#791F1F">${p}</div>`).join('')}
      <div style="font-size:12px;font-weight:500;color:var(--o);margin:10px 0 5px"><i class="ti ti-arrow-right"></i> 다음 액션 (${(m.actions||[]).length}건)</div>
      ${(m.actions||[]).map(a=>`<div style="padding:5px 8px;margin-bottom:2px;background:var(--ol);border-radius:7px;font-size:12px;color:var(--od)">${a}</div>`).join('')}
      ${m.full_text?`<div style="margin-top:14px;border-top:0.5px solid var(--bd);padding-top:12px">
        <div style="font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px"><i class="ti ti-file-text"></i> 전체 회의록 원문</div>
        <div style="background:var(--sf);border-radius:9px;padding:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;max-height:300px;overflow-y:auto">${m.full_text}</div>
      </div>`:''}
    </div></div>`
  }
  document.body.appendChild(w)
}

window.saveMtgEdit=async(id)=>{
  const sp=elId=>document.getElementById(elId)?.value.split('\n').map(s=>s.trim()).filter(Boolean)
  const emFullText=document.getElementById('em-fulltext')?.value.trim()
  await sb.from('meetings').update({
    date:document.getElementById('em-date')?.value,
    title:document.getElementById('em-title')?.value.trim(),
    attendees:document.getElementById('em-att')?.value.split(',').map(s=>s.trim()).filter(Boolean),
    decisions:sp('em-dec'),
    pending:sp('em-pend'),
    actions:sp('em-act'),
    full_text:emFullText||null,
  }).eq('id',id)
  await logH('회의록 수정',document.getElementById('em-title')?.value.trim())
  document.getElementById('mtg-ov').remove()
  toast('회의록 수정됨');await loadAll()
}

window.deleteMtg=async(id)=>{
  const m=D.meetings.find(m=>m.id===id)
  if(!m||!confirm(`"${m.title}" 회의록을 삭제할까요?`))return
  await sb.from('meetings').delete().eq('id',id)
  await logH('회의록 삭제',m.title)
  document.getElementById('mtg-ov').remove()
  toast('삭제됨');await loadAll()
}
window.openAddMtg=()=>{
  const w=mkOv('add-mtg-ov')
  w.innerHTML=`<div class="modal"><div class="mh"><span style="font-weight:500">회의록 추가</span><button class="btn btn-g" onclick="document.getElementById('add-mtg-ov').remove()"><i class="ti ti-x"></i></button></div>
  <div class="mb">
    <input class="inp" type="date" id="am-date" value="${new Date().toISOString().slice(0,10)}">
    <input class="inp" id="am-title" placeholder="회의 제목">
    <input class="inp" id="am-att" placeholder="참석자 (쉼표 구분)">
    <textarea class="inp" id="am-dec" placeholder="결정사항 (줄 구분)"></textarea>
    <textarea class="inp" id="am-pend" placeholder="미확인/후속 (줄 구분)"></textarea>
    <textarea class="inp" id="am-act" placeholder="다음 액션 (줄 구분)"></textarea>
  </div>
  <div class="mf"><button class="btn" onclick="document.getElementById('add-mtg-ov').remove()">취소</button><button class="btn btn-o" onclick="saveMtg()">저장</button></div>
  </div>`
  document.body.appendChild(w)
}
window.saveMtg=async()=>{
  const title=document.getElementById('am-title')?.value.trim();if(!title)return
  const sp=id=>document.getElementById(id).value.split('\n').map(s=>s.trim()).filter(Boolean)
  await sb.from('meetings').insert({date:document.getElementById('am-date').value,title,attendees:document.getElementById('am-att').value.split(',').map(s=>s.trim()).filter(Boolean),decisions:sp('am-dec'),pending:sp('am-pend'),actions:sp('am-act'),created_by:curUser.name})
  await logH('회의록 등록',title);document.getElementById('add-mtg-ov').remove();toast('저장됨');await loadAll()
}

// 변경이력

function renderHist(){
  return`<div class="sec"><div class="sh"><span class="st"><i class="ti ti-history oi"></i> 변경이력 (${D.history.length}건)</span></div>
  ${D.history.map(h=>`<div class="hist-r">${avEl(h.user_name,20)}
  <div style="flex:1"><span style="font-weight:500">${h.user_name}</span> · ${h.action}${h.target?` <span style="color:var(--muted)">(${h.target})</span>`:''}</div>
  <div style="color:var(--muted);white-space:nowrap;font-size:10px">${new Date(h.created_at).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
  </div>`).join('')}
  </div>`
}

// D-day 편집

window.renderDashFilter=(owner)=>{dashOwnerFilter=owner;render()}
window.openDdayEdit=()=>{
  const w=mkOv('dday-ov')
  w.innerHTML=`<div class="modal" style="width:320px"><div class="mh"><span style="font-weight:500">D-Day 날짜 설정</span><button class="btn btn-g" onclick="document.getElementById('dday-ov').remove()"><i class="ti ti-x"></i></button></div>
  <div class="mb"><input class="inp" type="date" id="dday-inp" value="${getDday()}"></div>
  <div class="mf"><button class="btn btn-o" onclick="const v=document.getElementById('dday-inp').value;if(v){setDday(v);document.getElementById('dday-ov').remove();render();toast('D-Day 설정됨')}">저장</button></div>
  </div>`
  document.body.appendChild(w)
}

try{await sb.from('checklist_items').select('start_date').limit(1)}catch{}

await loadAll()
</script>
