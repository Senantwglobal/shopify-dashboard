<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPLE Shopify 전환 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--o:#E8680A;--ol:#FEF0E6;--od:#B84E06;--ob:#F5C49A;--bg:#f8f7f5;--card:#fff;--bd:#e5e3dc;--text:#1a1a1a;--muted:#888;--sf:#f3f2ef}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
/* 헤더 */
.hdr{background:var(--card);border-bottom:0.5px solid var(--bd);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.logo{background:var(--o);color:#fff;font-size:13px;font-weight:600;padding:4px 10px;border-radius:6px}
.dday-b{background:var(--ol);color:var(--od);font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;border:0.5px solid var(--ob);cursor:pointer}
.uinfo{display:flex;align-items:center;gap:8px;position:relative}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;flex-shrink:0}
.notif-btn{position:relative;background:none;border:none;cursor:pointer;padding:0}
.notif-badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:#E24B4A;color:#fff;font-size:10px;font-weight:600;display:none;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid var(--card)}
.notif-badge.show{display:flex}
.notif-panel{position:absolute;top:38px;right:0;width:300px;background:var(--card);border:0.5px solid var(--bd);border-radius:12px;z-index:100;display:none;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.notif-panel.open{display:block}
.notif-item{padding:10px 14px;border-bottom:0.5px solid var(--bd);cursor:pointer;font-size:13px}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:var(--ol)}
.logout-btn{font-size:12px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--bd);background:none;color:var(--muted);cursor:pointer}
/* 네비 */
.nav{display:flex;padding:0 16px;background:var(--card);border-bottom:0.5px solid var(--bd);overflow-x:auto;position:sticky;top:51px;z-index:49}
.nb{padding:10px 14px;font-size:13px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:5px;font-weight:400}
.nb.active{color:var(--o);border-bottom-color:var(--o);font-weight:500}
.nb:hover:not(.active){color:var(--text)}
/* 레이아웃 */
.cnt{padding:20px;max-width:1200px;margin:0 auto}
/* 카드/섹션 */
.card{background:var(--card);border:0.5px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.card-o{border-color:var(--ob)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.st{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.oi{color:var(--o)}
/* 버튼 */
.btn{font-size:12px;padding:6px 12px;border-radius:8px;border:0.5px solid var(--bd);background:none;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.btn:hover{background:var(--sf)}
.btn-o{background:var(--o);color:#fff;border-color:var(--o)}
.btn-o:hover{background:var(--od);color:#fff}
.btn-g{border-color:transparent;color:var(--muted)}
.btn-g:hover{color:var(--text);background:var(--sf)}
.btn-red{color:#A32D2D;border-color:#F09595}
.btn-red:hover{background:#FCEBEB}
/* 뱃지 */
.badge{font-size:10px;padding:2px 7px;border-radius:9px;font-weight:500;white-space:nowrap}
.bo{background:var(--ol);color:var(--od)}
.bb{background:#E6F1FB;color:#185FA5}
.br{background:#FCEBEB;color:#A32D2D}
.bg{background:#EAF3DE;color:#3B6D11}
.bgr{background:#F1EFE8;color:#5F5E5A}
.bp{background:#EEEDFE;color:#534AB7}
/* 입력 */
.inp{width:100%;padding:8px 11px;border:0.5px solid var(--bd);border-radius:8px;font-size:13px;background:var(--sf);color:var(--text);margin-bottom:8px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--o)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.5}
select.inp{cursor:pointer}
/* 그리드 */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:12px;border:0.5px solid var(--bd);padding:14px;text-align:center;transition:border-color .15s,transform .1s}.kpi[onclick]:hover{border-color:var(--ob);transform:translateY(-1px)}
.kn{font-size:24px;font-weight:500;margin-bottom:3px}
.kl{font-size:11px;color:var(--muted)}
/* 진행률 바 */
.pgb{height:5px;border-radius:3px;background:var(--sf);overflow:hidden;margin-top:4px}
.pgf{height:100%;border-radius:3px;transition:width .4s}
/* D-day 칩 */
.dlc{font-size:10px;font-weight:500;padding:2px 7px;border-radius:9px;white-space:nowrap}
.dl-ok{background:#EAF3DE;color:#3B6D11}
.dl-w{background:var(--ol);color:var(--od)}
.dl-c{background:#FCEBEB;color:#A32D2D}
.dl-d{background:#F1EFE8;color:#5F5E5A}
/* Go/No-Go */
.gng-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.gng-c{border-radius:9px;padding:10px 12px;border:0.5px solid var(--bd);display:flex;align-items:flex-start;gap:8px;background:var(--card)}
.gng-l{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.lg-r{background:#E24B4A}.lg-o{background:var(--o)}.lg-g{background:#639922}
/* 체크리스트 */
.cat-tabs{display:flex;gap:0;border-bottom:0.5px solid var(--bd);margin-bottom:16px;overflow-x:auto;padding-bottom:0}
.cat-tab{padding:8px 14px;font-size:12px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.cat-tab.active{color:var(--o);border-bottom-color:var(--o);font-weight:500}
.cat-tab:hover:not(.active){color:var(--text)}
.ck-item{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:10px;border:0.5px solid var(--bd);margin-bottom:6px;background:var(--card);cursor:pointer;transition:border-color .15s}
.ck-item:hover{border-color:var(--ob)}
.ck-item.done-item{opacity:.6;cursor:pointer}
.ck-cb{accent-color:var(--o);width:16px;height:16px;margin-top:2px;flex-shrink:0;cursor:pointer}
.ck-body{flex:1;min-width:0}
.ck-title{font-size:13px;font-weight:500;margin-bottom:4px;line-height:1.4}
.ck-title.done{text-decoration:line-through;color:var(--muted)}
.ck-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.ck-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sub-wrap{display:none;padding:2px 0 2px 26px}
.sub-wrap.open{display:block}
.sub-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-size:12px;cursor:pointer}
.sub-row:hover{background:var(--sf)}
.sub-row input{accent-color:var(--o);width:13px;height:13px;flex-shrink:0}
.vbadge{font-size:9px;padding:1px 5px;border-radius:6px;background:#EEEDFE;color:#534AB7}
.vbadge.ok{background:#EAF3DE;color:#3B6D11}
/* 상태 셀렉트 */
.st-sel{font-size:11px;padding:2px 6px;border:0.5px solid var(--bd);border-radius:6px;background:var(--sf);cursor:pointer;color:var(--text);outline:none}
.st-sel:focus{border-color:var(--o)}
/* 담당자 칩 */
.owner-chips{display:flex;flex-wrap:wrap;gap:4px;min-height:30px;padding:4px 6px;border:0.5px solid var(--bd);border-radius:8px;background:var(--sf);margin-bottom:8px;align-items:center}
.ochip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;color:#fff}
.ochip-x{cursor:pointer;opacity:.7;font-size:10px}
.ochip-x:hover{opacity:1}
/* 캘린더 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dh{text-align:center;font-size:11px;color:var(--muted);padding:5px;font-weight:500}
.cal-cell{min-height:72px;border-radius:8px;padding:5px;border:0.5px solid transparent;background:var(--sf);position:relative;cursor:pointer;transition:border-color .12s;overflow:hidden}
.cal-cell:hover{border-color:var(--o)}
.cal-cell.today{border-color:var(--o);border-width:1.5px}
.cal-cell.empty{background:transparent;border:none;cursor:default}
.cal-cell.wknd{opacity:.6}
.cal-cell.drag-over{border-color:var(--o);background:var(--ol);border-style:dashed}
.cal-num{font-size:11px;font-weight:500;margin-bottom:2px}
.cal-cell.today .cal-num{color:var(--o)}
.cal-ev{font-size:9px;padding:2px 5px;border-radius:3px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab;max-width:100%;display:block}
.cal-ev.dragging{opacity:.4}
.cal-add{position:absolute;bottom:3px;right:3px;width:17px;height:17px;border-radius:50%;background:var(--o);color:#fff;font-size:13px;line-height:17px;text-align:center;display:none;border:none;cursor:pointer}
.cal-cell:hover .cal-add{display:block}
/* 회의록 */
.mtg-card{padding:14px;border:0.5px solid var(--bd);border-radius:10px;margin-bottom:10px;cursor:pointer;background:var(--card);transition:border-color .15s}
.mtg-card:hover{border-color:var(--ob)}
/* 댓글 */
.comment{background:var(--sf);border-radius:10px;padding:12px;margin-bottom:8px;border-left:3px solid var(--o)}
.cauth{font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;margin-bottom:5px}
.ctime{font-size:10px;color:var(--muted);font-weight:400}
.ctext{font-size:13px;color:#333;line-height:1.6;white-space:pre-wrap}
/* 모달/오버레이 */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding-top:28px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;border:0.5px solid var(--bd);border-top:3px solid var(--o);width:580px;max-width:95%;max-height:90vh;overflow-y:auto}
.mh{padding:14px 18px;border-bottom:0.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px}
.mb{padding:18px}
.mf{padding:12px 18px;border-top:0.5px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
/* 토스트 */
.toast{position:fixed;bottom:20px;right:20px;background:#2d6a27;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
/* 기타 */
.rdot{width:7px;height:7px;border-radius:50%;background:#639922;display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
.hist-r{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--bd);font-size:12px}
.kpi-tbl{width:100%;border-collapse:collapse;font-size:12px}
.kpi-tbl th{background:var(--sf);padding:8px;text-align:left;font-weight:500;font-size:11px;color:var(--muted);border-bottom:0.5px solid var(--bd);white-space:nowrap}
.kpi-tbl td{padding:7px 8px;border-bottom:0.5px solid var(--bd)}
.kpi-cell{width:100%;min-width:70px;padding:4px 7px;border:0.5px solid var(--bd);border-radius:5px;font-size:12px;background:var(--sf);color:var(--text);outline:none}
.kpi-cell:focus{border-color:var(--o)}
.dash-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--bd);font-size:13px}
.dash-row:last-child{border-bottom:none}
@media(max-width:640px){.two{grid-template-columns:1fr}.three{grid-template-columns:1fr}.cnt{padding:12px}}
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span class="logo">OPLE</span>
    <span style="font-size:14px;font-weight:500">Shopify 전환 프로젝트</span>
    <span class="dday-b" id="dday-c" onclick="openDdayEdit()">D-? · ?</span>
    <span style="font-size:11px;color:var(--muted)"><span class="rdot"></span>실시간</span>
  </div>
  <div class="uinfo">
    <button class="notif-btn" onclick="toggleNotif()">
      <div class="av" id="user-av" style="width:30px;height:30px;font-size:12px;background:var(--o)">?</div>
      <div class="notif-badge" id="notif-badge"></div>
    </button>
    <span id="user-name" style="font-size:13px;color:var(--muted)"></span>
    <div class="notif-panel" id="notif-panel">
      <div style="padding:10px 14px;font-size:12px;font-weight:500;color:var(--muted);border-bottom:0.5px solid var(--bd)">내 담당 항목</div>
      <div id="notif-list"></div>
    </div>
    <button class="logout-btn" onclick="logout()">로그아웃</button>
  </div>
</div>

<div class="nav">
  <button class="nb active" onclick="showTab('dash')" id="tab-dash"><i class="ti ti-layout-dashboard"></i>대시보드</button>
  <button class="nb" onclick="showTab('cal')" id="tab-cal"><i class="ti ti-calendar"></i>캘린더</button>
  <button class="nb" onclick="showTab('ck')" id="tab-ck"><i class="ti ti-checklist"></i>체크리스트</button>
  <button class="nb" onclick="showTab('kpi')" id="tab-kpi"><i class="ti ti-chart-line"></i>KPI</button>
  <button class="nb" onclick="showTab('mtg')" id="tab-mtg"><i class="ti ti-notes"></i>회의록</button>
  <button class="nb" onclick="showTab('files')" id="tab-files"><i class="ti ti-paperclip"></i>파일 보관함</button>
</div>

<div class="cnt" id="mc"><div style="text-align:center;padding:60px;color:var(--muted)">로딩중...</div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const sb=createClient('https://btutlgcidpjgedpypzri.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0dXRsZ2NpZHBqZ2VkcHlwenJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NTE0MjQsImV4cCI6MjA5ODAyNzQyNH0.qZp04DhOmm4oSho3Qsfz8UWEeY-eNhGcIydyVNejqBc')

// ── 상수 ──
const MC=['#E8680A','#534AB7','#0F6E56','#A32D2D','#185FA5','#854F0B','#993556','#5F5E5A']
const STATUS_LIST=['할 일','진행중','검증대기','완료']
const STATUS_NEXT={'할 일':'진행중','진행중':'검증대기','검증대기':'완료','완료':'완료'}
const TODAY=new Date()

function getMembers(){
  try{const s=localStorage.getItem('ople-members');return(s?JSON.parse(s):[{name:'한덕희',email:'handeokhee@ople.co'},{name:'박영환',email:'younghwan@ople.co'},{name:'천세나',email:'sena@ople.co'},{name:'권현정',email:'hyunjeong@ople.co'},{name:'김현수',email:'hyunsu@ople.co'}]).map((m,i)=>({...m,color:MC[i%MC.length]}))}catch{return[]}
}

// ── 상태 ──
let MEMBERS=[], curUser=null, activeTab='dash'
let expandCks={}
window.activeCat='전체'
window.setCat=(id)=>{window.activeCat=id;render()}
let calYear=2026, calMonth=6
let notifOpen=false
let D={cats:[],items:[],subs:[],comments:[],kpiRows:[],kpiAnalysis:{},actionItems:[],meetings:[],history:[]}

// ── 인증 ──
const {data:{session}}=await sb.auth.getSession()
if(!session){location.href='index.html';throw new Error()}
const curEmail=session.user.email
MEMBERS=getMembers()
curUser=MEMBERS.find(m=>m.email===curEmail)||{name:curEmail.split('@')[0],color:'#888'}
document.getElementById('user-av').textContent=curUser.name[0]
document.getElementById('user-av').style.background=curUser.color
document.getElementById('user-name').textContent=curUser.name
window.logout=async()=>{await sb.auth.signOut();location.href='index.html'}

// ── 유틸 ──
function ddu(ds){if(!ds)return 999;return Math.ceil((new Date(ds)-TODAY)/864e5)}
function calcDD(){return Math.max(0,Math.ceil((new Date(getDday())-TODAY)/864e5))}
function getDday(){return localStorage.getItem('ople-dday')||'2026-07-14'}
function setDday(d){localStorage.setItem('ople-dday',d)}
function fmtDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'})}
function ts(){return new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function dlc(dl,done){
  if(done)return`<span class="dlc dl-d">완료</span>`
  if(!dl)return''
  const d=ddu(dl)
  if(d<0)return`<span class="dlc dl-c">D+${Math.abs(d)}초과</span>`
  if(d===0)return`<span class="dlc dl-c">오늘</span>`
  if(d<=3)return`<span class="dlc dl-c">D-${d}</span>`
  if(d<=7)return`<span class="dlc dl-w">D-${d}</span>`
  return`<span class="dlc dl-ok">D-${d}</span>`
}
function stBadge(s){
  const m={'할 일':'bgr','진행중':'bb','검증대기':'bo','완료':'bg'}
  return`<span class="badge ${m[s]||'bgr'}">${s||'할 일'}</span>`
}
function prBadge(p){return{critical:'<span class="badge br">긴급</span>',high:'<span class="badge bo">중요</span>',medium:'<span class="badge bg">보통</span>'}[p]||''}
function avEl(name,sz=22){
  const m=MEMBERS.find(m=>m.name===name)
  let c=m?m.color:'#888'
  if(!m&&name){
    // 이름 기반 일관된 색상 생성
    const colors=['#185FA5','#3B6D11','#534AB7','#0F6E56','#854F0B','#993556','#5F5E5A','#A32D2D']
    let hash=0;for(let i=0;i<name.length;i++)hash=(hash*31+name.charCodeAt(i))&0xfffffff
    c=colors[hash%colors.length]
  }
  return`<div class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px;background:${c}" title="${name}">${name?name[0]:'?'}</div>`
}
function ownersEl(owners,sz=20){return(Array.isArray(owners)?owners:[owners||'']).filter(Boolean).map(o=>avEl(o,sz)).join('')}
function getCatColor(id){const c=D.cats.find(c=>c.id===id);return c?c.color:'#888'}
function getOwners(a){return Array.isArray(a.owners)&&a.owners.length?a.owners:a.owner?[a.owner]:[]}
function toast(msg,ok=true){const t=document.getElementById('toast');t.textContent=msg;t.style.background=ok?'#2d6a27':'#A32D2D';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function mkOv(id){const old=document.getElementById(id);if(old)old.remove();const w=document.createElement('div');w.id=id;w.className='overlay';w.onclick=e=>{if(e.target===w)w.remove()};return w}
async function logH(action,target,itemId=null){await sb.from('history').insert({user_name:curUser.name,action,target,item_id:itemId||null})}

// ── 알림 ──
window.goNotifItem=(id,catId)=>{
  document.getElementById('notif-panel').classList.remove('open')
  notifOpen=false
  if(catId){
    location.href='detail.html?type=item&id='+id
  } else {
    openAIDetail(id)
  }
}

window.toggleNotif=()=>{
  notifOpen=!notifOpen
  document.getElementById('notif-panel').classList.toggle('open',notifOpen)
  if(notifOpen)setTimeout(()=>document.addEventListener('click',()=>{notifOpen=false;document.getElementById('notif-panel').classList.remove('open')},{once:true}),100)
}
function updateNotif(){
  const myItems=[...D.items,...D.actionItems].filter(a=>{
    if(a.done||a.status==='완료')return false
    const o=getOwners(a)||[]
    return o.includes(curUser.name)||a.owner===curUser.name
  })
  const badge=document.getElementById('notif-badge')
  badge.textContent=myItems.length;badge.classList.toggle('show',myItems.length>0)
  const list=document.getElementById('notif-list')
  list.innerHTML=myItems.length
    ?myItems.slice(0,6).map(a=>`<div class="notif-item" onclick="goNotifItem('${a.id}','${a.category_id||''}')"><div style="font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.text}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${dlc(a.deadline,false)}</div></div>`).join('')+(myItems.length>6?`<div style="padding:8px 14px;font-size:11px;color:var(--muted)">+${myItems.length-6}건 더</div>`:'')
    :`<div style="padding:14px;font-size:13px;color:var(--muted);text-align:center">담당 항목 없음</div>`
}

async function loadAll(){
  const [cR,iR,sR,cmR,kR,kaR,aR,mR,hR,kdR]=await Promise.all([
    sb.from('checklist_categories').select('*').order('sort_order'),
    sb.from('checklist_items').select('*').order('sort_order'),
    sb.from('checklist_subs').select('*').order('sort_order'),
    sb.from('checklist_comments').select('*').order('created_at'),
    sb.from('kpi_data').select('*'),
    sb.from('kpi_analysis').select('*').eq('id','main').single(),
    sb.from('action_items').select('*').order('created_at'),
    sb.from('meetings').select('*').order('date',{ascending:false}),
    sb.from('history').select('*').order('created_at',{ascending:false}).limit(100),
    sb.from('kpi_daily').select('*').order('record_date'),
  ])
  D={cats:cR.data||[],items:iR.data||[],subs:sR.data||[],comments:cmR.data||[],kpiRows:kR.data||[],kpiAnalysis:kaR.data||{},actionItems:aR.data||[],meetings:mR.data||[],history:hR.data||[],kpiDaily:kdR.data||[]}
  updateNotif();render()
}

  .on('postgres_changes',{event:'*',schema:'public',table:'action_items'},()=>loadAll())

function renderCal(){
  const ML=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월']
  const yr=calYear,mo=calMonth
  const first=new Date(yr,mo,1).getDay(),last=new Date(yr,mo+1,0).getDate()
  const days=['일','월','화','수','목','금','토']
  // 모든 항목 (체크리스트 + 액션)
  const allItems=[...D.items,...D.actionItems]
  function evsOn(d){
    const k=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    return allItems.filter(i=>i.deadline===k)
  }
  let cells=''
  for(let i=0;i<first;i++)cells+=`<div class="cal-cell empty"></div>`
  for(let d=1;d<=last;d++){
    const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const evs=evsOn(d),wk=(d+first-1)%7
    const isToday=ds===TODAY.toISOString().slice(0,10)
    cells+=`<div class="cal-cell${wk===0||wk===6?' wknd':''}${isToday?' today':''}" onclick="calClick('${ds}')" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="event.preventDefault();this.classList.remove('drag-over');calDrop('${ds}',event)">
    <div class="cal-num">${d}</div>
    ${evs.slice(0,2).map(e=>{
      const color=e.category_id?getCatColor(e.category_id):'var(--o)'
      const isDone=e.done||e.status==='완료'
      return`<div class="cal-ev" draggable="true" style="background:${color}22;color:${color};border-left:2px solid ${color};${isDone?'text-decoration:line-through;opacity:.5':''}" onclick="event.stopPropagation();${e.category_id?`location.href='detail.html?type=item&id=${e.id}'`:`openAIDetail('${e.id}')`}" ondragstart="event.stopPropagation();calDragStart('${e.id}','${e.category_id?'item':'action'}',event)" ondragend="event.target.classList.remove('dragging')">${e.text}</div>`
    }).join('')}
    ${evs.length>2?`<div style="font-size:9px;color:var(--muted);padding:1px 2px">+${evs.length-2}개 더</div>`:''}
    <button class="cal-add" onclick="event.stopPropagation();openAddItem('','${ds}')">+</button>
    </div>`
  }
  // 이번 달 전체 목록
  const monthItems=allItems.filter(i=>{if(!i.deadline)return false;const d=new Date(i.deadline);return d.getFullYear()===yr&&d.getMonth()===mo}).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline))

  return`<div class="card">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn btn-g" onclick="calNav(-1)"><i class="ti ti-chevron-left"></i></button>
      <span style="font-size:15px;font-weight:500">${yr}년 ${ML[mo]}</span>
      <button class="btn btn-g" onclick="calNav(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <button class="btn btn-o" onclick="openAddItem('','')"><i class="ti ti-plus"></i> 항목 추가</button>
  </div>
  <div class="cal-grid">${days.map(d=>`<div class="cal-dh">${d}</div>`).join('')}${cells}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)">
    ${D.cats.map(c=>`<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:3px"></span>${c.label}</span>`).join('')}
  </div>
  </div>
  <div class="card">
  <div class="sh"><span class="st"><i class="ti ti-list oi"></i> ${ML[mo]} 마감 항목 (${monthItems.length}건)</span></div>
  ${monthItems.map(i=>{
    const color=i.category_id?getCatColor(i.category_id):'var(--o)'
    const isDone=i.done||i.status==='완료'
    return`<div class="dash-row" style="cursor:pointer" onclick="${i.category_id?`location.href='detail.html?type=item&id=${i.id}'`:`openAIDetail('${i.id}')`}">
    <span style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0"></span>
    <div style="flex:1;min-width:0"><div style="font-size:13px;${isDone?'text-decoration:line-through;color:var(--muted)':''};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.text}</div>
    <div style="font-size:11px;color:var(--muted)">${i.owner||ownersEl(i.owners||[],14)}</div></div>
    <span style="font-size:11px;color:var(--muted);white-space:nowrap">${fmtDate(i.deadline)}</span>
    ${dlc(i.deadline,isDone)}
    </div>`
  }).join('')||'<div style="font-size:13px;color:var(--muted)">이번 달 마감 항목 없음</div>'}
  </div>`
}
let _dragId=null,_dragType=null
window.calDragStart=(id,type,event)=>{_dragId=id;_dragType=type;event.target.classList.add('dragging');event.dataTransfer.setData('text/plain',id)}
window.calDrop=async(newDate,event)=>{
  const id=_dragId||event.dataTransfer.getData('text/plain');if(!id||!newDate)return
  if(_dragType==='item'||D.items.find(i=>i.id===id)){
    const item=D.items.find(i=>i.id===id);if(!item||item.deadline===newDate)return
    await sb.from('checklist_items').update({deadline:newDate,updated_at:new Date().toISOString()}).eq('id',id)
    await logH('마감일 변경 (드래그)',`${item.text}: →${newDate}`)
  } else {
    const a=D.actionItems.find(a=>a.id===id);if(!a||a.deadline===newDate)return
    await sb.from('action_items').update({deadline:newDate,updated_at:new Date().toISOString()}).eq('id',id)
    await logH('마감일 변경 (드래그)',`${a.text}: →${newDate}`)
  }
  toast('마감일 변경됨');_dragId=null;await loadAll()
}

// ══════════════════════
// 체크리스트 (통합)
// ══════════════════════
function renderCK(){
  const allCats=[{id:"전체",label:"전체",color:"#888"},...D.cats,{id:"회의록액션",label:"회의록 액션",color:"#E8680A"}]
  const getItems=()=>{
    if(window.activeCat==="전체")return D.items
    if(window.activeCat==="회의록액션")return D.actionItems
    return D.items.filter(i=>i.category_id===window.activeCat)
  }
  const items=getItems()
  const total=items.length
  const done=items.filter(i=>i.done||i.status==="완료").length
  // 완료 항목 기본 접힘
  items.forEach(i=>{if((i.done||i.status==="완료")&&expandCks[i.id]===undefined)expandCks[i.id]=false})

  function catDone(id){
    if(id==="전체")return D.items.filter(i=>i.done).length
    if(id==="회의록액션")return D.actionItems.filter(a=>a.status==="완료").length
    return D.items.filter(i=>i.category_id===id&&i.done).length
  }
  function catTotal(id){
    if(id==="전체")return D.items.length
    if(id==="회의록액션")return D.actionItems.length
    return D.items.filter(i=>i.category_id===id).length
  }

  const sidebarItems = allCats.map(cat=>{
    const t=catTotal(cat.id), d=catDone(cat.id)
    const isActive=window.activeCat===cat.id
    const pct=t?Math.round(d/t*100):0
    const activeStyle=isActive?"background:var(--ol);color:var(--o);font-weight:600;border-left:3px solid var(--o)":"background:none;color:var(--text);font-weight:400;border-left:3px solid transparent"
    const countBadge=t>0?`<span style="font-size:10px;color:${isActive?"var(--o)":"var(--muted)"};flex-shrink:0">${d}/${t}</span>`:""
    const progressBar=t>0?`<div style="margin:0 14px 4px;height:2px;background:var(--sf);border-radius:1px"><div style="width:${pct}%;height:100%;background:${pct===100?"#639922":cat.color};border-radius:1px"></div></div>`:""
    return `<button onclick="setCat('` + cat.id + `')" style="width:100%;padding:9px 14px;border:none;${activeStyle};font-size:12px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;transition:all .15s"><span style="width:8px;height:8px;border-radius:50%;background:${cat.color};flex-shrink:0"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cat.label}</span>${countBadge}</button>${progressBar}`
  }).join("")

  const catLabel = allCats.find(c=>c.id===window.activeCat)?.label||"전체"
  const addCatId = (window.activeCat==="전체"||window.activeCat==="회의록액션")?"":window.activeCat
  const progPct = total?Math.round(done/total*100):0
  const progBar = total?`<div class="pgb" style="width:120px;display:inline-block;vertical-align:middle"><div class="pgf" style="width:${progPct}%;background:${done===total?"#639922":"var(--o)"}"></div></div>`:""
  const kpiNote = window.activeCat==="kpicat"?`<div style="background:var(--ol);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--od);margin-bottom:12px">KPI 수치는 <span style="font-weight:600;cursor:pointer;text-decoration:underline" onclick="showTab('kpi')">KPI 탭</span>에서 입력하세요.</div>`:""

  return `<div style="display:flex;gap:0;min-height:calc(100vh - 140px)">
  <div style="width:200px;flex-shrink:0;background:var(--card);border:0.5px solid var(--bd);border-radius:12px;padding:10px 0;margin-right:14px;height:fit-content;position:sticky;top:80px">
    ${sidebarItems}
    <div style="border-top:0.5px solid var(--bd);margin:8px 10px;padding-top:8px">
      <button class="btn" style="width:100%;justify-content:center;font-size:11px" onclick="openAddCat()"><i class="ti ti-folder-plus"></i> 카테고리 추가</button>
    </div>
  </div>
  <div style="flex:1;min-width:0">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:15px;font-weight:500">${catLabel}</span>
        <span style="font-size:13px;color:var(--muted)">${done}/${total} 완료</span>
        ${progBar}
      </div>
      <button class="btn btn-o" onclick="openAddItem('${addCatId}','')"><i class="ti ti-plus"></i> 항목 추가</button>
    </div>
    ${kpiNote}
    ${window.activeCat==="회의록액션"?renderActionItems():renderCheckItems(items)}
  </div>
  </div>`
}

function renderCheckItems(items){
  if(!items.length)return`<div style="text-align:center;padding:40px;color:var(--muted);font-size:14px">항목이 없어요.<br><span style="color:var(--o);cursor:pointer" onclick="openAddItem('${activeCat}','')">+ 추가하기</span></div>`
  return items.map(item=>{
    const subs=D.subs.filter(s=>s.item_id===item.id)
    const cmts=D.comments.filter(c=>c.item_id===item.id)
    const sdone=subs.filter(s=>s.done).length
    const isExp=expandCks[item.id]!==false
    const owners=item.owners?.length?item.owners:item.owner?[item.owner]:[]
    return`<div class="ck-item ${item.done?'done-item':''}" onclick="location.href='detail.html?type=item&id=${item.id}'">
    <input class="ck-cb" type="checkbox" ${item.done?'checked':''} onclick="event.stopPropagation()" onchange="toggleItem('${item.id}',this.checked)">
    <div class="ck-body" style="cursor:pointer">
      <div class="ck-title ${item.done?'done':''}">${item.text}</div>
      <div class="ck-meta">
        ${prBadge(item.priority)}
        <select class="st-sel" onclick="event.stopPropagation()" onchange="updateItemField('${item.id}','status',this.value)">
          ${STATUS_LIST.map(s=>`<option ${(item.status||'할 일')===s?'selected':''}>${s}</option>`).join('')}
        </select>
        ${ownersEl(owners,18)}
        ${item.deadline?`<span>${fmtDate(item.deadline)}</span>`:''}
        ${dlc(item.deadline,item.done)}
        ${subs.length?`<span>${sdone}/${subs.length} 세부</span>`:''}
      </div>
    </div>
    <div class="ck-right" onclick="event.stopPropagation()">
      <button class="btn btn-g" style="padding:3px 8px;font-size:11px" onclick="location.href='detail.html?type=item&id=${item.id}'">
        <i class="ti ti-pencil"></i>${cmts.length?' '+cmts.length:''}
      </button>
      <button class="btn btn-g" style="padding:3px 6px;font-size:11px;color:#A32D2D" onclick="deleteItem('${item.id}')"><i class="ti ti-trash"></i></button>
    </div>
    </div>
    <div class="sub-wrap ${isExp?'open':''}" id="sub-${item.id}">
      ${subs.map(s=>`<div class="sub-row" onclick="location.href='detail.html?type=item&id=${item.id}'">
      <input type="checkbox" ${s.done?'checked':''} onclick="event.stopPropagation()" onchange="toggleSub('${s.id}','${item.id}',this.checked)" style="accent-color:var(--o);width:13px;height:13px;flex-shrink:0">
      <span style="${s.done?'text-decoration:line-through;color:var(--muted);':''}flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.text}</span>
      <span class="vbadge ${s.verified?'ok':''}">${s.verified?'✓검증':'미검증'}</span>
      ${s.done&&!s.verified?`<button class="btn btn-o" style="font-size:10px;padding:1px 6px" onclick="event.stopPropagation();verifySub('${s.id}','${item.id}')">검증</button>`:''}
      </div>`).join('')}
      <div style="display:flex;gap:5px;padding:2px 8px;margin-top:0">
        <input id="ns-${item.id}" style="flex:1;font-size:12px;padding:5px 8px;border:0.5px solid var(--bd);border-radius:7px;background:var(--sf);color:var(--text);outline:none" placeholder="세부 항목 추가..." onkeydown="if(event.key==='Enter'){addSub('${item.id}');event.preventDefault()}">
        <button class="btn btn-o" style="padding:4px 9px;font-size:11px;flex-shrink:0" onclick="addSub('${item.id}')"><i class="ti ti-plus"></i></button>
      </div>
    </div>`
  }).join('')
}

function renderActionItems(){
  const items=D.actionItems
  if(!items.length)return`<div style="text-align:center;padding:40px;color:var(--muted);font-size:14px">회의록에서 추가된 액션아이템이 없어요.</div>`
  const cats=[...new Set(items.map(a=>a.cat))]
  return cats.map(cat=>{
    const its=items.filter(a=>a.cat===cat).sort((a,b)=>{const o={'완료':3,'검증대기':2,'진행중':1,'할 일':0};return(o[a.status]||0)-(o[b.status]||0)})
    return`<div style="margin-bottom:16px">
    <div style="font-size:11px;font-weight:500;color:var(--muted);padding:4px 8px;background:var(--sf);border-radius:7px;margin-bottom:6px">${cat}</div>
    ${its.map(a=>{
      const owners=getOwners(a)
      return`<div class="ck-item">
      <input class="ck-cb" type="checkbox" ${a.status==='완료'?'checked':''} onclick="event.stopPropagation()" onchange="updAI('${a.id}','status',this.checked?'완료':'할 일')">
      <div class="ck-body">
        <div class="ck-title ${a.status==='완료'?'done':''}">${a.text}</div>
        <div class="ck-meta">
          <select class="st-sel" onclick="event.stopPropagation()" onchange="updAI('${a.id}','status',this.value)">
            ${STATUS_LIST.map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
          ${ownersEl(owners,18)}
          ${a.deadline?`<span>${fmtDate(a.deadline)}</span>`:''}
          ${dlc(a.deadline,a.status==='완료')}
          ${a.note?`<span style="color:var(--muted)">${a.note}</span>`:''}
        </div>
        ${(a.comments||[]).length?`<div style="font-size:11px;color:var(--muted);margin-top:3px;padding:3px 6px;background:var(--sf);border-radius:5px;border-left:2px solid var(--ob)"><span style="font-weight:500">${a.last_comment_by}</span>: ${a.last_comment}</div>`:''}
      </div>
      <div class="ck-right" onclick="event.stopPropagation()">
        <button class="btn btn-g" style="padding:3px 8px;font-size:11px" onclick="openAIDetail('${a.id}')"><i class="ti ti-pencil"></i>${(a.comments||[]).length?' '+(a.comments||[]).length:''}</button>
        <button class="btn btn-g" style="padding:3px 6px;font-size:11px;color:#A32D2D" onclick="delAI('${a.id}')"><i class="ti ti-trash"></i></button>
      </div>
      </div>`
    }).join('')}
    </div>`
  }).join('')
}

function renderKPIInline(){
  const metrics=D.kpiRows.length?[...new Set(D.kpiRows.map(r=>r.metric))]:['일매출','주문수','전환율','결제실패율','404오류','SUPLA누락']
  const cols=[{k:'baseline',l:'전환 전'},{k:'d1',l:'D+1'},{k:'d3',l:'D+3'},{k:'d7',l:'D+7'},{k:'d14',l:'D+14'}]

  <div class="sh"><span class="st"><i class="ti ti-chart-line oi"></i> KPI 추적표</span><button class="btn btn-o" onclick="openAddKPI()"><i class="ti ti-plus"></i> 지표 추가</button></div>
  <div style="overflow-x:auto"><table class="kpi-tbl">
  <thead><tr><th>지표</th>${cols.map(c=>`<th>${c.l}</th>`).join('')}<th>허용</th><th>임계</th><th></th></tr></thead>
  <tbody>${metrics.map(m=>`<tr>
  <td style="font-weight:500;white-space:nowrap">${m}</td>
  ${cols.map(c=>`<td><input class="kpi-cell" value="${gv(c.k,m)}" placeholder="—" onchange="saveKPI('${c.k}','${m}',this.value)"></td>`).join('')}
  <td style="color:var(--o);white-space:nowrap">-15%</td><td style="color:#A32D2D;white-space:nowrap">-20%</td>
  <td><button class="btn btn-g btn-red" style="padding:1px 5px;font-size:10px" onclick="delKPI('${m}')"><i class="ti ti-x"></i></button></td>
  </tr>`).join('')}</tbody></table></div>
  <div class="two" style="margin-top:12px">
    <div><div style="font-size:11px;color:var(--muted);margin-bottom:4px">매출 하락 분석</div><textarea class="inp" style="min-height:80px;margin:0" placeholder="원인·기간·영역..." onchange="saveKA('sales_analysis',this.value)">${D.kpiAnalysis?.sales_analysis||''}</textarea></div>
    <div><div style="font-size:11px;color:var(--muted);margin-bottom:4px">손실 산정 & 회복 계획</div><textarea class="inp" style="min-height:80px;margin:0" placeholder="일매출 ___원 × ___% × ___일..." onchange="saveKA('recovery_plan',this.value)">${D.kpiAnalysis?.recovery_plan||''}</textarea></div>
  </div>
  </div>`
}

window.toggleCkExp=id=>{expandCks[id]=expandCks[id]===false;render()}
window.toggleItem=async(id,checked)=>{
  const item=D.items.find(i=>i.id===id);if(!item)return
  const newStatus=checked?'완료':'할 일'
  if(checked)expandCks[id]=false  // 완료 시 세부항목 접기
  await sb.from('checklist_items').update({done:checked,status:newStatus,done_by:checked?curUser.name:null,updated_at:new Date().toISOString()}).eq('id',id)
  await logH(`항목 ${checked?'완료':'취소'}`,item.text,id);await loadAll()
}
window.updateItemField=async(id,field,val)=>{
  await sb.from('checklist_items').update({[field]:val,updated_at:new Date().toISOString()}).eq('id',id)
  const item=D.items.find(i=>i.id===id);await logH(`${field} 변경`,item?.text||'',id);await loadAll()
}
window.toggleSub=async(sid,itemId,checked)=>{
  await sb.from('checklist_subs').update({done:checked,done_by:checked?curUser.name:null,verified:false}).eq('id',sid)
  const s=D.subs.find(s=>s.id===sid);const item=D.items.find(i=>i.id===itemId)
  await logH(`세부 ${checked?'완료':'취소'}`,`${item?.text||''} > ${s?.text||''}`);await loadAll()
}
window.verifySub=async(sid,itemId)=>{
  await sb.from('checklist_subs').update({verified:true,verified_by:curUser.name,verified_at:new Date().toISOString()}).eq('id',sid)
  toast('✓ 검증 완료');await loadAll()
}
window.addSub=async(itemId)=>{
  const inp=document.getElementById('ns-'+itemId);if(!inp?.value.trim())return
  await sb.from('checklist_subs').insert({item_id:itemId,text:inp.value.trim(),verifier:curUser.name})
  inp.value='';toast('추가됨');await loadAll()
}
window.deleteItem=async(id)=>{
  const item=D.items.find(i=>i.id===id);if(!item||!confirm(`"${item.text}" 삭제?`))return
  await sb.from('checklist_items').delete().eq('id',id);await logH('항목 삭제',item.text);await loadAll()
}
window.updAI=async(id,field,value)=>{
  const a=D.actionItems.find(a=>a.id===id);if(!a)return
  await sb.from('action_items').update({[field]:value,updated_at:new Date().toISOString()}).eq('id',id)
  await logH(`${field} →${value}`,a.text);await loadAll()
}
window.delAI=async(id)=>{
  const a=D.actionItems.find(a=>a.id===id);if(!a||!confirm(`"${a.text}" 삭제?`))return
  await sb.from('action_items').delete().eq('id',id);await logH('액션 삭제',a.text);await loadAll()
}
window.saveKPI=async(col,metric,value)=>{await sb.from('kpi_data').upsert({col,metric,value,updated_by:curUser.name},{onConflict:'col,metric'});toast('저장됨')}
window.delKPI=async(m)=>{if(!confirm(`"${m}" 삭제?`))return;await sb.from('kpi_data').delete().eq('metric',m);toast('삭제됨');await loadAll()}
window.saveKA=async(field,value)=>{await sb.from('kpi_analysis').update({[field]:value,updated_by:curUser.name}).eq('id','main');toast('저장됨')}
window.openAddKPI=()=>{const w=mkOv('add-kpi-ov');w.innerHTML=`<div class="modal" style="width:340px"><div class="mh"><span style="font-weight:500">KPI 지표 추가</span><button class="btn btn-g" onclick="document.getElementById('add-kpi-ov').remove()"><i class="ti ti-x"></i></button></div><div class="mb"><input class="inp" id="kpi-m" placeholder="예: 신규 회원수"></div><div class="mf"><button class="btn btn-o" onclick="saveKPI('baseline',document.getElementById('kpi-m').value,'');document.getElementById('add-kpi-ov').remove();toast('추가됨');loadAll()">추가</button></div></div>`;document.body.appendChild(w)}

window.addOwnerToForm=(prefix,name)=>{
  if(!name)return
  const inp=document.getElementById(prefix+'-owners');if(!inp)return
  const cur=inp.value?inp.value.split(',').filter(Boolean):[]
  if(cur.includes(name))return
  cur.push(name);inp.value=cur.join(',')
  const chips=document.getElementById(prefix+'-owner-chips');if(!chips)return
  // 플레이스홀더 제거
  const ph=chips.querySelector('span');if(ph)ph.remove()
  const c=document.createElement('div');c.className='ochip';c.style.background=MEMBERS.find(m=>m.name===name)?.color||'#888'
  c.innerHTML=`${name}<span class="ochip-x" onclick="removeOwnerFromForm('${prefix}','${name}',this.parentElement)">✕</span>`
  chips.appendChild(c)
}
window.removeOwnerFromForm=(prefix,name,el)=>{
  const inp=document.getElementById(prefix+'-owners');if(!inp)return
  inp.value=inp.value.split(',').filter(o=>o!==name).join(',')
  el.remove()
  const chips=document.getElementById(prefix+'-owner-chips')
  if(chips&&chips.querySelectorAll('.ochip').length===0){
    const ph=document.createElement('span')
    ph.style.cssText='font-size:11px;color:var(--muted);align-self:center'
    ph.textContent='담당자 선택 →'
    chips.appendChild(ph)
  }
}
window.addNiSub=()=>{
  const inp=document.getElementById('ni-sub-inp');if(!inp?.value.trim())return
  window._niSubs=window._niSubs||[];window._niSubs.push(inp.value.trim());inp.value=''
  document.getElementById('ni-subs-list').innerHTML=window._niSubs.map((t,i)=>`<div style="display:flex;align-items:center;gap:5px;padding:3px 7px;margin-bottom:2px;background:var(--ol);border-radius:7px;font-size:12px"><span style="flex:1">${t}</span><button class="btn btn-g" style="padding:0 4px" onclick="window._niSubs.splice(${i},1);addNiSub()"><i class="ti ti-x"></i></button></div>`).join('')
}
window.saveNewItem=async()=>{
  const text=document.getElementById('ni-text')?.value.trim();if(!text)return
  const owners=(document.getElementById('ni-owners')?.value||'').split(',').filter(Boolean)
  const {data:ni}=await sb.from('checklist_items').insert({
    category_id:document.getElementById('ni-cat').value,text,

  await logH('항목 추가',text);document.getElementById('add-item-ov').remove();toast('추가됨');await loadAll()
}

function getKPIDef(){
  // localStorage에 저장된 커스텀 KPI 목록 반환
  const defaults=[
    {id:'revenue',     label:'일평균 매출',    unit:'원', cat:'매출',   icon:'ti-coin',            color:'#3B6D11'},
    {id:'order_count', label:'일평균 주문수',   unit:'건', cat:'매출',   icon:'ti-shopping-cart',   color:'#185FA5'},
    {id:'aov',         label:'평균 주문액(AOV)',unit:'원', cat:'매출',   icon:'ti-receipt',         color:'#0F6E56'},
    {id:'cvr',         label:'전환율(CVR)',    unit:'%',  cat:'전환',   icon:'ti-arrows-right',    color:'#534AB7'},
    {id:'cart_abandon',label:'장바구니 이탈률', unit:'%',  cat:'전환',   icon:'ti-shopping-cart-off',color:'#854F0B'},
    {id:'checkout_drop',label:'체크아웃 이탈률',unit:'%', cat:'전환',   icon:'ti-door-exit',       color:'#A32D2D'},
    {id:'pay_fail',    label:'결제 실패율',    unit:'%',  cat:'결제·기술',icon:'ti-credit-card-off',color:'#A32D2D'},
    {id:'err_404',     label:'404 오류 수',   unit:'건', cat:'결제·기술',icon:'ti-error-404',      color:'#993556'},
    {id:'supla_miss',  label:'SUPLA 누락률',  unit:'%',  cat:'결제·기술',icon:'ti-package-off',    color:'#854F0B'},
    {id:'login_ok',    label:'로그인 성공률',  unit:'%',  cat:'회원·CS', icon:'ti-user-check',     color:'#0F6E56'},
    {id:'cs_count',    label:'CS 문의량',     unit:'건', cat:'회원·CS', icon:'ti-headset',        color:'#993556'},
    {id:'seo_index',   label:'검색 색인 수',  unit:'개', cat:'SEO',    icon:'ti-search',          color:'#185FA5'},
    {id:'organic',     label:'유기 검색 유입', unit:'명', cat:'SEO',    icon:'ti-brand-google',    color:'#3B6D11'},
  ]
  try{
    const custom=JSON.parse(localStorage.getItem('ople-kpi-def')||'[]')
    return custom.length?custom:defaults
  }catch{return defaults}
}
function saveKPIDef(defs){localStorage.setItem('ople-kpi-def',JSON.stringify(defs))}

function renderKPITab(){
  const KPI_DEF=getKPIDef()
  const IS_LOW_BETTER=['pay_fail','cart_abandon','checkout_drop','err_404','supla_miss','cs_count']
  const catGroups=[...new Set(KPI_DEF.map(k=>k.cat))]
  const daily=D.kpiDaily||[]
  const dates=[...new Set(daily.map(d=>d.record_date))].sort()
  const baselineDate=dates[0]||null

  function getVal(id,date){return daily.find(d=>d.metric===id&&d.record_date===date)?.value??null}
  function getLatest(id){const rows=daily.filter(d=>d.metric===id).sort((a,b)=>b.record_date.localeCompare(a.record_date));return rows[0]?.value??null}
  function getBaseline(id){return baselineDate?getVal(id,baselineDate):null}
  function calcChange(id){
    const base=getBaseline(id),cur=getLatest(id)
    if(base===null||cur===null||base===0)return null
    const pct=parseFloat(((cur-base)/Math.abs(base)*100).toFixed(1))
    const isLowBetter=IS_LOW_BETTER.includes(id)
    const isGood=isLowBetter?pct<=0:pct>=0
    return{pct,isGood,isCrit:!isGood&&Math.abs(pct)>=20,isWarn:!isGood&&Math.abs(pct)>=15}
  }
  function miniChart(id,color){
    const rows=daily.filter(d=>d.metric===id).sort((a,b)=>a.record_date.localeCompare(b.record_date))
    if(rows.length<2)return''
    const vals=rows.map(r=>Number(r.value))
    const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1
    const W=140,H=36,p=4
    const pts=vals.map((v,i)=>`${p+i*(W-p*2)/(vals.length-1)},${H-p-(v-min)/range*(H-p*2)}`).join(' ')
    return`<svg width="${W}" height="${H}" style="overflow:visible;display:block;margin-top:6px"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`
  }

  return`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <div>
      <div style="font-size:16px;font-weight:500">KPI 대시보드</div>
      <div style="font-size:12px;color:var(--muted);margin-top:3px">전환 전 기준값 대비 실시간 추적 — <span style="color:#A32D2D;font-weight:500">-20% 초과 시 즉시 대응</span></div>
    </div>
    <div style="display:flex;gap:7px">
      <button class="btn" onclick="openAddKPIItem()"><i class="ti ti-plus"></i> 지표 추가</button>
      <button class="btn btn-o" onclick="openKPIInput()"><i class="ti ti-pencil"></i> 수치 입력</button>
    </div>
  </div>

  ${catGroups.map(cat=>{
    const kpis=KPI_DEF.filter(k=>k.cat===cat)
    return`<div style="margin-bottom:20px">
    <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:0.5px solid var(--bd)">${cat}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px">
    ${kpis.map(k=>{
      const base=getBaseline(k.id),cur=getLatest(k.id),ch=calcChange(k.id)
      const dispVal=cur??base
      return`<div class="card" style="padding:14px;border-left:3px solid ${k.color};position:relative;cursor:pointer" onclick="openKPICardInput('${k.id}','${k.label}','${k.unit}')">
        <!-- 삭제 버튼 -->
        <button onclick="event.stopPropagation();deleteKPIItem('${k.id}')" style="position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;border:none;background:var(--sf);color:var(--muted);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s" class="kpi-del-btn">✕</button>
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:4px">
          <i class="ti ${k.icon}" style="color:${k.color}"></i>${k.label}
        </div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between">
          <div>
            <div style="font-size:26px;font-weight:600;color:${dispVal!==null?k.color:'var(--muted)'};line-height:1.1">${dispVal!==null?Number(dispVal).toLocaleString():'—'}</div>
            <div style="font-size:11px;color:var(--muted)">${dispVal!==null?k.unit+' '+(base!==null&&cur!==null&&cur!==base?`(기준 ${Number(base).toLocaleString()})`:base!==null?'기준값':''):''}</div>
          </div>
          ${ch?`<div style="text-align:right;flex-shrink:0;margin-left:8px">
            <div style="font-size:15px;font-weight:700;color:${ch.isGood?'#3B6D11':ch.isCrit?'#A32D2D':'var(--o)'}">${ch.pct>0?'+':''}${ch.pct}%</div>
            <div style="font-size:9px;color:${ch.isCrit?'#A32D2D':ch.isWarn?'var(--o)':'var(--muted)'}">${ch.isCrit?'⚠ 즉시대응':ch.isWarn?'△ 주의':'정상'}</div>
          </div>`:''}
        </div>
        ${base!==null?`<div class="pgb" style="height:3px;margin-top:8px"><div class="pgf" style="width:${ch?Math.min(Math.abs(ch.pct)/20*100,100):0}%;background:${ch&&!ch.isGood?(ch.isCrit?'#A32D2D':ch.isWarn?'var(--o)':'#639922'):'#639922'}"></div></div>`:``}
        ${miniChart(k.id,k.color)}
        ${base===null?`<div style="font-size:11px;color:var(--o);margin-top:8px"><i class="ti ti-pencil"></i> 클릭해서 기준값 입력</div>`:''}
      </div>`
    }).join('')}
    </div></div>`
  }).join('')}

  <style>.card:hover .kpi-del-btn{opacity:1!important}</style>

  <!-- 추적표 -->
  <div class="card" style="margin-top:8px">
    <div class="sh"><span class="st"><i class="ti ti-table oi"></i> 날짜별 추적표</span>
      ${baselineDate?`<span style="font-size:11px;color:var(--muted)">기준일: ${baselineDate}</span>`:''}
    </div>
    ${dates.length?`<div style="overflow-x:auto"><table class="kpi-tbl"><thead><tr>
      <th style="min-width:130px">지표</th>
      ${dates.map(d=>`<th style="text-align:center;min-width:85px">${d.slice(5)}<div style="font-size:9px;font-weight:400;color:var(--muted)">${d===baselineDate?'기준':''}</div></th>`).join('')}
      <th style="text-align:center">변화율</th><th style="text-align:center">상태</th>
    </tr></thead><tbody>
    ${KPI_DEF.map(k=>{
      const ch=calcChange(k.id)
      return`<tr style="${ch?.isCrit?'background:#FEF2F2':ch?.isWarn?'background:#FFFBEB':''}">
      <td style="font-weight:500;white-space:nowrap;font-size:12px"><i class="ti ${k.icon}" style="color:${k.color};font-size:10px"></i> ${k.label}</td>
      ${dates.map(d=>{const v=getVal(k.id,d);return`<td style="text-align:center;font-size:12px;cursor:pointer" onclick="openKPICardInput('${k.id}','${k.label}','${k.unit}','${d}')">${v!==null?Number(v).toLocaleString()+k.unit:'<span style="color:var(--muted)">—</span>'}</td>`}).join('')}
      <td style="text-align:center;font-weight:700;font-size:12px;color:${ch?(ch.isGood?'#3B6D11':ch.isCrit?'#A32D2D':'var(--o)'):'var(--muted)'}">${ch?`${ch.pct>0?'+':''}${ch.pct}%`:'—'}</td>

// 카드 클릭 → 개별 지표 입력
window.openKPICardInput=(id,label,unit,preDate)=>{
  const todayStr=new Date().toISOString().slice(0,10)
  const date=preDate||todayStr
  const existing=(D.kpiDaily||[]).filter(d=>d.metric===id).sort((a,b)=>b.record_date.localeCompare(a.record_date))
  const curVal=(D.kpiDaily||[]).find(d=>d.metric===id&&d.record_date===date)?.value??''
  const w=mkOv('kpi-card-ov')
  w.innerHTML=`<div class="modal" style="width:360px">
  <div class="mh"><span style="font-weight:500">${label} 입력</span><button class="btn btn-g" onclick="document.getElementById('kpi-card-ov').remove()"><i class="ti ti-x"></i></button></div>
  <div class="mb">
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">날짜</label>
    <input type="date" class="inp" id="kcc-date" value="${date}" onchange="refreshKPICardVal('${id}',this.value)">
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;margin-top:10px">값 (${unit})</label>
    <input type="number" step="any" class="inp" id="kcc-val" value="${curVal}" placeholder="예: 5200000" style="font-size:18px;font-weight:600">
    ${existing.length?`<div style="margin-top:12px;border-top:0.5px solid var(--bd);padding-top:10px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px">기존 입력 내역</div>
      ${existing.slice(0,5).map(r=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:0.5px solid var(--sf)"><span style="color:var(--muted)">${r.record_date}</span><span style="font-weight:500">${Number(r.value).toLocaleString()}${unit}</span><button onclick="deleteKPIRow('${r.metric}','${r.record_date}')" style="border:none;background:none;color:#A32D2D;cursor:pointer;font-size:11px">삭제</button></div>`).join('')}
    </div>`:''}
  </div>
  <div class="mf"><button class="btn" onclick="document.getElementById('kpi-card-ov').remove()">취소</button><button class="btn btn-o" onclick="saveKPICard('${id}')"><i class="ti ti-check"></i> 저장</button></div>
  </div>`
  document.body.appendChild(w)
}

window.refreshKPICardVal=async(id,date)=>{
  const r=(D.kpiDaily||[]).find(d=>d.metric===id&&d.record_date===date)
  const inp=document.getElementById('kcc-val')
  if(inp)inp.value=r?.value??''
}

window.saveKPICard=async(id)=>{
  const date=document.getElementById('kcc-date')?.value
  const val=document.getElementById('kcc-val')?.value
  if(!date||val===''||val===null){toast('날짜와 값을 입력해주세요.',false);return}
  const {error}=await sb.from('kpi_daily').upsert({metric:id,record_date:date,value:parseFloat(val),updated_by:curUser.name,updated_at:new Date().toISOString()},{onConflict:'metric,record_date'})
  if(error){toast('저장 실패: '+error.message,false);return}
  await logH('KPI 입력: '+id,date)
  document.getElementById('kpi-card-ov').remove()
  toast('저장됐어요 ✓')
  await loadAll()
}

window.deleteKPIRow=async(metric,date)=>{
  if(!confirm(`${date} 데이터를 삭제할까요?`))return
  await sb.from('kpi_daily').delete().eq('metric',metric).eq('record_date',date)
  toast('삭제됨');await loadAll()
  // 모달 닫기
  document.getElementById('kpi-card-ov')?.remove()
}

window.saveNewKPIItem=()=>{
  const label=document.getElementById('aki-label')?.value.trim()
  const unit=document.getElementById('aki-unit')?.value.trim()||''
  let cat=document.getElementById('aki-cat')?.value
  if(cat==='__new__')cat=document.getElementById('aki-newcat')?.value.trim()||'기타'
  const color=document.getElementById('aki-color')?.value||'#888'
  if(!label){toast('지표 이름을 입력해주세요.',false);return}
  const defs=getKPIDef()
  const id='kpi_'+Date.now()
  defs.push({id,label,unit,cat,icon:'ti-chart-bar',color})
  saveKPIDef(defs)
  document.getElementById('add-kpi-item-ov').remove()
  toast('지표 추가됐어요')

window.deleteKPIItem=(id)=>{
  if(!confirm('이 지표를 삭제할까요? 입력된 데이터도 함께 삭제됩니다.'))return

  const KPI_UNITS={revenue:'원',order_count:'건',aov:'원',cvr:'%',cart_abandon:'%',checkout_drop:'%',pay_fail:'%',err_404:'건',supla_miss:'%',login_ok:'%',cs_count:'건',seo_index:'개',organic:'명'}

  // 오늘 기존 입력값

  const w=mkOv('kpi-input-ov')
  w.innerHTML=`<div class="modal" style="width:520px">
  <div class="mh"><span style="font-weight:500"><i class="ti ti-pencil" style="color:var(--o)"></i> KPI 수치 입력</span><button class="btn btn-g" onclick="document.getElementById('kpi-input-ov').remove()"><i class="ti ti-x"></i></button></div>

      <input type="date" id="kpi-date" class="inp" style="margin:0;flex:1" value="${todayStr}" onchange="refreshKPIInputVals()">
      <span style="font-size:11px;color:var(--muted);white-space:nowrap">첫 번째 날짜 = 기준값</span>
    </div>
    <div style="background:var(--ol);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--od);margin-bottom:12px">
      <i class="ti ti-info-circle"></i> 전환 전 처음 입력한 날짜가 기준값(baseline)이 됩니다.
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px" id="kpi-input-grid">
    ${ids.map(id=>`<div>
      <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">${KPI_LABELS[id]} (${KPI_UNITS[id]})</label>
      <input class="inp" style="margin:0" id="ki-${id}" type="number" step="any" placeholder="—" value="${getCurVal(id)}">
    </div>`).join('')}
    </div>
  </div>
  <div class="mf">
    <button class="btn" onclick="document.getElementById('kpi-input-ov').remove()">취소</button>
    <button class="btn btn-o" onclick="saveKPIDaily()"><i class="ti ti-device-floppy"></i> 저장</button>
  </div>
  </div>`
  document.body.appendChild(w)
}

window.refreshKPIInputVals=()=>{
  const date=document.getElementById('kpi-date')?.value
  if(!date)return
  const ids=['revenue','order_count','aov','cvr','cart_abandon','checkout_drop','pay_fail','err_404','supla_miss','login_ok','cs_count','seo_index','organic']
  ids.forEach(id=>{
    const r=(D.kpiDaily||[]).find(d=>d.metric===id&&d.record_date===date)
    const inp=document.getElementById('ki-'+id)
    if(inp)inp.value=r?.value??''
  })
}

window.saveKPIDaily=async()=>{
  const date=document.getElementById('kpi-date')?.value
  if(!date){toast('날짜를 선택해주세요.',false);return}
  const ids=['revenue','order_count','aov','cvr','cart_abandon','checkout_drop','pay_fail','err_404','supla_miss','login_ok','cs_count','seo_index','organic']
  const rows=ids.map(id=>{
    const v=document.getElementById('ki-'+id)?.value
    if(v===''||v===null||v===undefined)return null
    return{metric:id,record_date:date,value:parseFloat(v),updated_by:curUser.name,updated_at:new Date().toISOString()}
  }).filter(Boolean)
  if(!rows.length){toast('입력값이 없어요.',false);return}
  const {error}=await sb.from('kpi_daily').upsert(rows,{onConflict:'metric,record_date'})
  if(error){toast('저장 실패: '+error.message,false);return}
  await logH('KPI 수치 입력',date)
  document.getElementById('kpi-input-ov').remove()
  toast('저장됐어요 ✓')
  await loadAll()
}

function renderFiles(){
  // 댓글에서 파일 첨부된 것 추출
  const allComments=D.comments||[]
  const files=[]

  allComments.forEach(c=>{
    try{
      const parsed=JSON.parse(c.text)
      if(parsed.file){
        const item=D.items.find(i=>i.id===c.item_id)
        const cat=D.cats.find(cat=>cat.id===item?.category_id)
        files.push({
          ...parsed.file,
          comment_text:parsed.text||'',
          link:parsed.link||null,
          item_id:c.item_id,
          item_text:item?.text||'삭제된 항목',
          cat_label:cat?.label||'',
          cat_color:cat?.color||'#888',
          user:c.user_name,
          created_at:c.created_at
        })
      }
    }catch{}
  })

  // 회의록 원문도 포함 (텍스트지만 참고용)
  const fileTypes={
    image:files.filter(f=>f.type?.startsWith('image/')),
    doc:files.filter(f=>!f.type?.startsWith('image/'))
  }

  return`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div>
      <div style="font-size:16px;font-weight:500">파일 보관함</div>
      <div style="font-size:12px;color:var(--muted);margin-top:3px">체크리스트 댓글에 첨부된 파일 모음 — 총 ${files.length}개</div>
    </div>
  </div>

  ${files.length===0?`<div style="text-align:center;padding:60px;color:var(--muted)">
    <div style="font-size:48px;margin-bottom:12px">📎</div>
    <div style="font-size:15px;font-weight:500;margin-bottom:8px">첨부파일이 없어요</div>
    <div style="font-size:13px">체크리스트 상세 페이지에서 댓글 작성 시 파일을 첨부해주세요</div>
  </div>`:`

  <!-- 이미지 파일 -->
  ${fileTypes.image.length?`<div class="card" style="margin-bottom:16px">
    <div class="sh"><span class="st"><i class="ti ti-photo oi"></i> 이미지 (${fileTypes.image.length}개)</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">
    ${fileTypes.image.map(f=>`<div style="border:0.5px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer" onclick="location.href='detail.html?type=item&id=${f.item_id}'">
      <img src="${f.data}" style="width:100%;height:120px;object-fit:cover;display:block">
      <div style="padding:8px">
        <div style="font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px">${f.name}</div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px">${f.user} · ${new Date(f.created_at).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'})}</div>
        <div style="display:flex;gap:4px;align-items:center">
          <span style="font-size:9px;padding:1px 6px;border-radius:4px;background:${f.cat_color}22;color:${f.cat_color}">${f.cat_label}</span>
          <button onclick="event.stopPropagation();downloadFileGlobal('${f.name}','${f.data}')" style="font-size:10px;padding:2px 7px;border:0.5px solid var(--bd);border-radius:5px;background:var(--sf);cursor:pointer;margin-left:auto"><i class="ti ti-download"></i></button>
        </div>
      </div>
    </div>`).join('')}
    </div>
  </div>`:''}

  <!-- 문서 파일 -->
  ${fileTypes.doc.length?`<div class="card">
    <div class="sh"><span class="st"><i class="ti ti-files oi"></i> 문서 & 기타 (${fileTypes.doc.length}개)</span></div>
    ${fileTypes.doc.map(f=>`<div style="display:flex;align-items:center;gap:12px;padding:10px;border:0.5px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer" onclick="location.href='detail.html?type=item&id=${f.item_id}'">
      <div style="width:40px;height:40px;border-radius:8px;background:var(--ol);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="ti ti-file" style="color:var(--o);font-size:20px"></i>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${f.user} · ${new Date(f.created_at).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'})} · ${(f.size/1024).toFixed(1)}KB</div>
        <div style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">📌 ${f.item_text}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <span style="font-size:10px;padding:2px 7px;border-radius:5px;background:${f.cat_color}22;color:${f.cat_color}">${f.cat_label}</span>
        <button onclick="event.stopPropagation();downloadFileGlobal('${f.name}','${f.data}')" style="font-size:11px;padding:4px 10px;border:0.5px solid var(--bd);border-radius:7px;background:var(--sf);cursor:pointer"><i class="ti ti-download"></i> 다운로드</button>
      </div>
    </div>`).join('')}
  </div>`:''}
  `}
`
}

window.downloadFileGlobal=(name,dataUrl)=>{
  const a=document.createElement('a');a.href=dataUrl;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a)
}

    <div style="display:flex;gap:6px"><button class="btn" onclick="openMtg('${m.id}',true)"><i class="ti ti-pencil"></i> 수정</button><button class="btn btn-g" onclick="document.getElementById('mtg-ov').remove()"><i class="ti ti-x"></i></button></div>

    <div class="mb">

      ${(m.decisions||[]).map(d=>`<div style="padding:6px 10px;margin-bottom:3px;background:#EAF3DE;border-radius:8px;font-size:13px;color:#27500A">${d}</div>`).join('')}

window.saveMtgEdit=async(id)=>{
  const sp=elId=>document.getElementById(elId)?.value.split('\n').map(s=>s.trim()).filter(Boolean)
  await sb.from('meetings').update({date:document.getElementById('em-date')?.value,title:document.getElementById('em-title')?.value.trim(),attendees:document.getElementById('em-att')?.value.split(',').map(s=>s.trim()).filter(Boolean),decisions:sp('em-dec'),pending:sp('em-pend'),actions:sp('em-act'),full_text:document.getElementById('em-fulltext')?.value.trim()||null}).eq('id',id)
  await logH('회의록 수정',document.getElementById('em-title')?.value.trim())
  document.getElementById('mtg-ov').remove();toast('수정됨');await loadAll()
}

window.deleteMtg=async(id)=>{
  const m=D.meetings.find(m=>m.id===id);if(!m)return
  const linked=D.actionItems.filter(a=>a.meeting_id===id)
  const msg=linked.length?`"${m.title}" 회의록과 연결된 액션아이템 ${linked.length}건도 함께 삭제할까요?`:`"${m.title}" 삭제할까요?`
  if(!confirm(msg))return
  if(linked.length)await sb.from('action_items').delete().in('id',linked.map(a=>a.id))
  await sb.from('meetings').delete().eq('id',id)
  await logH('회의록 삭제',m.title);document.getElementById('mtg-ov').remove();toast('삭제됨');await loadAll()
}

window.openAddMtg=()=>{
  const w=mkOv('add-mtg-ov')
  w.innerHTML=`<div class="modal"><div class="mh"><span style="font-weight:500">회의록 추가</span><button class="btn btn-g" onclick="document.getElementById('add-mtg-ov').remove()"><i class="ti ti-x"></i></button></div>
  <div class="mb">
    <input class="inp" type="date" id="am-date" value="${new Date().toISOString().slice(0,10)}">
    <input class="inp" id="am-title" placeholder="회의 제목">

window.saveMtg=async()=>{
  const title=document.getElementById('am-title')?.value.trim();if(!title)return
  const sp=id=>document.getElementById(id).value.split('\n').map(s=>s.trim()).filter(Boolean)
  await sb.from('meetings').insert({date:document.getElementById('am-date').value,title,attendees:document.getElementById('am-att').value.split(',').map(s=>s.trim()).filter(Boolean),decisions:sp('am-dec'),pending:sp('am-pend'),actions:sp('am-act'),created_by:curUser.name})
  await logH('회의록 등록',title);document.getElementById('add-mtg-ov').remove();toast('저장됨');await loadAll()
}

// AI 회의록 요약
window.openAIMtg=()=>{
  const w=mkOv('ai-mtg-ov')
  const today=new Date().toISOString().slice(0,10)
  w.innerHTML=`<div class="modal"><div class="mh"><span style="font-weight:500"><i class="ti ti-robot" style="color:var(--o)"></i> AI 회의록 요약</span><button class="btn btn-g" onclick="document.getElementById('ai-mtg-ov').remove()"><i class="ti ti-x"></i></button></div>
  <div class="mb">
    <div style="background:var(--ol);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--od);margin-bottom:12px">회의록 전문을 붙여넣으면 AI가 결정사항·액션아이템을 자동 추출합니다.</div>
    <input class="inp" id="aim-title" placeholder="회의 제목">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input class="inp" type="date" id="aim-date" value="${today}" style="margin:0"><input class="inp" id="aim-att" placeholder="참석자 (쉼표 구분)" style="margin:0"></div>
    <textarea class="inp" id="aim-raw" style="min-height:160px;margin-top:8px" placeholder="회의록 전문을 붙여넣으세요..."></textarea>
    <div id="aim-loading" style="display:none;text-align:center;padding:16px;color:var(--muted)"><i class="ti ti-loader" style="font-size:20px;animation:spin 1s linear infinite;display:inline-block"></i><div style="margin-top:6px;font-size:13px">AI 분석 중...</div></div>
    <div id="aim-result" style="display:none;margin-top:12px;border-top:0.5px solid var(--bd);padding-top:12px">
      <div style="font-size:12px;font-weight:500;color:var(--o);margin-bottom:8px"><i class="ti ti-sparkles"></i> AI 요약 결과</div>
      <div id="aim-summary-box" style="background:var(--sf);border-radius:9px;padding:12px;font-size:13px;line-height:1.8;white-space:pre-wrap"></div>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-o" onclick="saveParsedMtg()"><i class="ti ti-device-floppy"></i> 회의록 저장</button>
        <button class="btn" onclick="addParsedActions()"><i class="ti ti-list-check"></i> 액션아이템으로 추가</button>
      </div>
    </div>
  </div>
  <div class="mf"><button class="btn" onclick="document.getElementById('ai-mtg-ov').remove()">닫기</button><button class="btn btn-o" id="aim-btn" onclick="runAIMtg()"><i class="ti ti-robot"></i> AI 요약 실행</button></div>
  </div>`
  document.body.appendChild(w);window._parsedMtg=null
}

window.runAIMtg=async()=>{
  const raw=document.getElementById('aim-raw')?.value.trim();if(!raw){toast('내용을 입력해주세요.',false);return}
  document.getElementById('aim-loading').style.display='block'
  document.getElementById('aim-result').style.display='none'
  const btn=document.getElementById('aim-btn');btn.disabled=true
  try{
    const resp=await fetch('/api/summarize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:raw})})
    const respData=await resp.json().catch(()=>({error:'응답 파싱 실패'}))
    if(!resp.ok||respData.error)throw new Error(respData.error||'서버 오류 '+resp.status)
    const p=respData
    window._parsedMtg={...p,title:document.getElementById('aim-title')?.value.trim()||'AI 회의록',date:document.getElementById('aim-date')?.value,attendees:document.getElementById('aim-att')?.value.split(',').map(s=>s.trim()).filter(Boolean),raw}
    document.getElementById('aim-loading').style.display='none'
    document.getElementById('aim-result').style.display='block'
    document.getElementById('aim-summary-box').innerHTML=
      `<strong>핵심 요약</strong>\n${p.summary||''}\n\n<strong style="color:#3B6D11">✅ 결정사항 (${(p.decisions||[]).length}건)</strong>\n${(p.decisions||[]).map((d,i)=>`${i+1}. ${d}`).join('\n')||'없음'}\n\n<strong style="color:#A32D2D">❓ 미확인 사항</strong>\n${(p.pending||[]).map(x=>`• ${x}`).join('\n')||'없음'}\n\n<strong style="color:var(--o)">📌 액션아이템 (${(p.actions||[]).length}건)</strong>\n${(p.actions||[]).map((a,i)=>`${i+1}. ${a}`).join('\n')||'없음'}`
  }catch(e){
    document.getElementById('aim-loading').style.display='none'
    toast('AI 분석 실패: '+e.message,false)
  }
  btn.disabled=false
}

window.saveParsedMtg=async()=>{
  const p=window._parsedMtg;if(!p)return
  await sb.from('meetings').insert({date:p.date,title:p.title,attendees:p.attendees,decisions:p.decisions||[],pending:p.pending||[],actions:p.actions||[],full_text:p.raw||null,created_by:curUser.name})
  await logH('AI 회의록 저장',p.title);document.getElementById('ai-mtg-ov').remove();toast('저장됨');await loadAll()
}

window.addParsedActions=async()=>{
  const p=window._parsedMtg;if(!p||!p.actions?.length)return
  for(const a of p.actions)await sb.from('action_items').insert({cat:'회의록',text:a,owner:null,owners:[],status:'할 일',comments:[],created_by:curUser.name})
  await logH('회의록에서 액션 '+p.actions.length+'건 추가',p.title)
  toast('액션아이템 '+p.actions.length+'건 추가됨')
  document.getElementById('ai-mtg-ov').remove();await loadAll()
  window.activeCat='회의록액션';showTab('ck')
}

// D-day 편집
function renderActivityItem(h,i,lastIdx){
  const isComplete=h.action.includes('완료')
  const isAdd=h.action.includes('추가')||h.action.includes('등록')
  const isEdit=h.action.includes('변경')||h.action.includes('수정')
  const iconColor=isComplete?'#3B6D11':isAdd?'#185FA5':isEdit?'#854F0B':'#888'
  const icon=isComplete?'ti-circle-check':isAdd?'ti-circle-plus':isEdit?'ti-pencil':'ti-circle-dot'
  const m=MEMBERS.find(m=>m.name===h.user_name)||{color:'#888'}

  // item_id 있으면 상세 페이지로, 없으면 탭으로 이동
  let clickAction=''
  if(h.item_id){
    clickAction=`location.href='detail.html?type=item&id=${h.item_id}'`
  } else if(h.action.includes('회의록')){
    clickAction="showTab('mtg')"
  } else if(h.action.includes('KPI')){
    clickAction="showTab('kpi')"
  } else if(h.action.includes('액션')){
    clickAction="showTab('ck');setCat('회의록액션')"
  } else {
    clickAction="showTab('ck')"
  }

  return`<div onclick="${clickAction}" style="display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:0.5px solid var(--bd);cursor:pointer;border-radius:8px;transition:background .12s;margin:0 -4px" onmouseover="this.style.background='var(--sf)'" onmouseout="this.style.background=''">
    <div style="position:relative;flex-shrink:0">
      <div class="av" style="width:28px;height:28px;font-size:11px;background:${m.color}">${h.user_name?h.user_name[0]:'?'}</div>
      <div style="position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:${iconColor};border:1.5px solid var(--card);display:flex;align-items:center;justify-content:center">
        <i class="ti ${icon}" style="font-size:8px;color:#fff"></i>
      </div>
    </div>
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;line-height:1.4">
        <span style="font-weight:600">${h.user_name}</span>
        <span style="color:var(--muted)">님이 </span>
        <span style="color:${iconColor};font-weight:500">${h.action}</span>
        ${h.target?`<span style="color:var(--muted)"> — </span><span style="font-size:12px;color:var(--text);background:var(--sf);padding:1px 6px;border-radius:4px">${h.target.slice(0,40)}${h.target.length>40?'...':''}</span>`:''}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">${new Date(h.created_at).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
    </div>
  </div>`
}

let _activityExpanded=false
window.toggleActivityFeed=()=>{
  _activityExpanded=!_activityExpanded
  const feed=document.getElementById('activity-feed')
  const btn=document.getElementById('activity-more-btn')
  const icon=document.getElementById('activity-more-icon')
  if(!feed||!btn)return
  if(_activityExpanded){
    feed.innerHTML=D.history.slice(0,20).map((h,i)=>renderActivityItem(h,i,19)).join('')
    btn.innerHTML=`<i class="ti ti-chevron-up" id="activity-more-icon"></i> 접기`
  } else {
    feed.innerHTML=D.history.slice(0,3).map((h,i)=>renderActivityItem(h,i,2)).join('')
    btn.innerHTML=`<i class="ti ti-chevron-down" id="activity-more-icon"></i> 더보기 (${D.history.length-3}건 더)`
  }
}

window.openMemberTasks=(name)=>{
  const allItems=[...D.items,...D.actionItems]
  const myItems=allItems.filter(a=>{
    const owners=Array.isArray(a.owners)&&a.owners.length?a.owners:a.owner?[a.owner]:[]
    return owners.includes(name)
  })
  const done=myItems.filter(i=>i.done||i.status==='완료')
  const todo=myItems.filter(i=>!i.done&&i.status!=='완료').sort((a,b)=>new Date(a.deadline||'9999')-new Date(b.deadline||'9999'))
  const m=MEMBERS.find(m=>m.name===name)||{name,color:'#888'}
  const w=mkOv('member-tasks-ov')
  w.innerHTML=`<div class="modal" style="width:560px">
  <div class="mh" style="border-top-color:${m.color}">
    <div style="display:flex;align-items:center;gap:10px">
      ${avEl(name,36)}
      <div>
        <div style="font-weight:500;font-size:15px">${name}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">전체 ${myItems.length}건 · 완료 ${done.length}건 · 미완료 ${todo.length}건</div>
      </div>
    </div>
    <button class="btn btn-g" onclick="document.getElementById('member-tasks-ov').remove()"><i class="ti ti-x"></i></button>
  </div>
  <div class="mb" style="padding:0">
    <!-- 진행률 바 -->
    <div style="padding:12px 18px;border-bottom:0.5px solid var(--bd);background:var(--sf)">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">
        <span style="color:var(--muted)">전체 진행률</span>
        <span style="font-weight:500">${myItems.length?Math.round(done.length/myItems.length*100):0}%</span>
      </div>
      <div class="pgb" style="height:6px"><div class="pgf" style="width:${myItems.length?Math.round(done.length/myItems.length*100):0}%;background:${m.color}"></div></div>
    </div>

    <!-- 미완료 -->
    ${todo.length?`<div style="padding:10px 18px 6px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px">미완료 (${todo.length}건)</div>
    ${todo.map(i=>{
      const isDone=i.done||i.status==='완료'
      const color=i.category_id?getCatColor(i.category_id):'var(--o)'
      const cat=i.category_id?D.cats.find(c=>c.id===i.category_id)?.label||'':'회의록 액션'
      return`<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 18px;border-bottom:0.5px solid var(--bd);cursor:pointer;transition:background .12s" onclick="document.getElementById('member-tasks-ov').remove();${i.category_id?`location.href='detail.html?type=item&id=${i.id}'`:`openAIDetail('${i.id}')`}" onmouseover="this.style.background='var(--sf)'" onmouseout="this.style.background=''">
        <div style="width:3px;border-radius:2px;background:${color};align-self:stretch;flex-shrink:0;min-height:36px"></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px">${i.text}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
            <span style="font-size:10px;color:${color};background:${color}18;padding:1px 6px;border-radius:4px">${cat}</span>
            <span class="badge ${i.status==='진행중'?'bb':i.status==='검증대기'?'bo':'bgr'}">${i.status||'할 일'}</span>
            ${i.deadline?dlc(i.deadline,false):''}
          </div>
        </div>
        <i class="ti ti-chevron-right" style="color:var(--muted);font-size:13px;flex-shrink:0;margin-top:3px"></i>
      </div>`
    }).join('')}`:''}

    <!-- 완료 -->
    ${done.length?`<div style="padding:10px 18px 6px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;margin-top:4px">완료 (${done.length}건)</div>
    ${done.map(i=>{
      const color=i.category_id?getCatColor(i.category_id):'var(--o)'
      const cat=i.category_id?D.cats.find(c=>c.id===i.category_id)?.label||'':'회의록 액션'
      return`<div style="display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:0.5px solid var(--bd);opacity:.6">
        <div style="width:3px;border-radius:2px;background:${color};align-self:stretch;flex-shrink:0;min-height:28px"></div>
        <div style="flex:1;min-width:0;font-size:12px;text-decoration:line-through;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.text}</div>
        <span class="badge bg">완료</span>
      </div>`
    }).join('')}`:''}

    ${!myItems.length?`<div style="text-align:center;padding:30px;font-size:14px;color:var(--muted)">${name}님 담당 항목 없음</div>`:''}
  </div>
  </div>`
  document.body.appendChild(w)
}

}
